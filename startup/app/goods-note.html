<title>グッズ交換ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: iPhone標準の作り（大見出し・角丸のまとまりの一覧・下のタブ・下から出る入力画面）。色は推し色1色から、背景・線・見出しをすべて作る。あえて明るい1テーマ */
:root{
  --oshi:#e8457c;
  --bg:color-mix(in srgb,var(--oshi) 8%,#fffafc); --group:#ffffff; --fg:#3b3040; --sub:#8c8192;
  --sep:color-mix(in srgb,var(--oshi) 14%,#ece7ef); --fill:color-mix(in srgb,var(--oshi) 11%,#f6f3f8);
  --deep:color-mix(in srgb,var(--oshi) 80%,#3b3040); --bar:rgba(255,255,255,.84);
  --late:#ef4b5a; --wait:#f29d38; --ok:#3cbf86; --shadow:0 1px 3px color-mix(in srgb,var(--oshi) 12%,transparent);
  --f:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,"Hiragino Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.35;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:600px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:flex-end;align-items:center;height:44px}
.iconbtn{border:none;background:none;color:var(--oshi);padding:8px;margin-right:-8px;display:grid;place-items:center;cursor:pointer;border-radius:10px}
.iconbtn svg{width:26px;height:26px}
h1{font-family:var(--round);color:var(--deep);font-size:32px;font-weight:700;letter-spacing:.01em;margin:0 0 14px;line-height:1.15}
.caption{font-size:13px;color:var(--sub);text-transform:none;margin:22px 16px 7px}
.foot{font-size:13px;color:var(--sub);margin:7px 16px 0;line-height:1.45}
.group{background:var(--group);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:left;
  background:none;border:none;color:inherit;font:inherit;cursor:pointer}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.cell.has-thumb{--inset:84px}
.cell:active{background:var(--fill)}
.cell .main{flex:1;min-width:0}
.cell .t{font-size:17px;overflow-wrap:anywhere}
.cell .s{font-size:14px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere;line-height:1.4}
.chev{color:var(--sub);opacity:.6;flex:none}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--fill);flex:none;display:grid;place-items:center;color:var(--sub)}
.thumb svg{width:24px;height:24px;opacity:.6}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.status.late{color:var(--late);font-weight:600}.status.late .dot{background:var(--late)}
.status.wait .dot{background:var(--wait)}.status.done .dot{background:var(--ok)}.status.open .dot{background:var(--oshi)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--oshi) 14%,transparent);color:var(--oshi);margin-right:6px}
.tag.grey{background:var(--fill);color:var(--sub)}
.toggles{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.toggle{font:inherit;font-size:14px;border:none;border-radius:999px;padding:6px 13px;background:var(--fill);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.toggle svg{width:15px;height:15px}
.toggle.on{background:var(--oshi);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:4px}
.seg button{font:inherit;font-size:14px;font-weight:500;border:none;background:none;color:var(--fg);padding:6px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--group);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.searchbox{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin-bottom:6px}
.searchbox svg{width:17px;height:17px;color:var(--sub);flex:none}
.searchbox input{border:none;background:none;font:inherit;font-size:17px;color:var(--fg);flex:1;min-width:0;outline:none;padding:0}
.answer{padding:13px 16px;font-size:16px}
.answer b{color:var(--oshi)}
.answer.no b{color:var(--sub)}
.summary{display:grid;grid-template-columns:repeat(3,1fr)}
.summary div{padding:12px 16px}
.summary div+div{border-left:.5px solid var(--sep)}
.summary small{display:block;font-size:12px;color:var(--sub)}
.summary b{font-family:var(--round);color:var(--deep);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.summary b.late{color:var(--late)}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:8px;overflow:hidden;flex:none}
.stepper button{border:none;background:none;color:var(--fg);font:inherit;font-size:20px;width:36px;height:30px;cursor:pointer}
.stepper span{min-width:34px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums;border-inline:.5px solid var(--sep);line-height:30px}
.linkcell{color:var(--oshi)}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:15px;line-height:1.5}
.sample{background:var(--group);box-shadow:var(--shadow);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:15px}
.sample span{flex:1;color:var(--sub)}
.sample button{font:inherit;font-size:15px;border:none;background:none;color:var(--oshi);cursor:pointer;font-weight:600;padding:4px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding:5px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto}
nav.tabs button{border:none;background:none;font:inherit;font-size:10px;font-weight:500;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;cursor:pointer}
nav.tabs svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--oshi)}
/* 下から出る入力画面 */
dialog{border:none;padding:0;margin:auto auto 0;width:100%;max-width:600px;max-height:92vh;border-radius:12px 12px 0 0;background:var(--bg);color:var(--fg);overflow:auto}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheetbar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 16px;background:var(--bg);border-bottom:.5px solid var(--sep)}
.sheetbar h3{margin:0;font-family:var(--round);color:var(--deep);font-size:17px;font-weight:700}
.sheetbar button{font:inherit;font-size:17px;border:none;background:none;color:var(--oshi);cursor:pointer;padding:6px 0}
.sheetbar .save{justify-self:end;font-weight:600}
.sheetbar .cancel{justify-self:start}
.sheetbody{padding:4px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.field label{flex:none;width:6.5em;font-size:16px}
.field input,.field select{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:16px;color:var(--fg);padding:12px 0;outline:none;text-align:right}
.field input::placeholder{color:var(--sub);opacity:.7}
.field.switch label{flex:1;width:auto}
.field textarea{flex:1;border:none;background:none;font:inherit;font-size:16px;color:var(--fg);padding:12px 0;min-height:150px;outline:none;resize:vertical}
.picks{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.picks button{font:inherit;font-size:13px;border:none;border-radius:999px;padding:5px 11px;background:var(--group);color:var(--fg);cursor:pointer}
.picks button:active{background:var(--oshi);color:#fff}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--ok)}
.sw:checked::after{transform:translateX(20px)}
.photo{display:flex;align-items:center;gap:14px;padding:12px 16px}
.photo img,.photo .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover}
.photo label{color:var(--oshi);font-size:16px;cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.danger{color:var(--late)!important;justify-content:center}
.colors{display:flex;flex-wrap:wrap;gap:12px;padding:14px 16px}
.colors button{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;position:relative}
.colors button[aria-pressed="true"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--fg)}
.poster{width:100%;border-radius:16px;box-shadow:var(--shadow);display:block;background:var(--group)}
textarea.plain{width:100%;border:none;background:var(--group);box-shadow:var(--shadow);border-radius:16px;font:inherit;font-size:14px;color:var(--fg);padding:12px 14px;min-height:96px;resize:vertical}
:focus-visible{outline:2px solid var(--oshi);outline-offset:2px}
</style>

<div class="app">
  <div class="top"><button id="addBtn" class="iconbtn" type="button" aria-label="追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <h1 id="pageTitle">交換</h1>
  <div id="sampleBanner" class="sample" hidden><span>見本を表示しています</span><button id="clearSample" type="button">消してはじめる</button></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="画面の切り替え"><div class="in">
  <button type="button" data-tab="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>交換</button>
  <button type="button" data-tab="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>持ち物</button>
  <button type="button" data-tab="wants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>求</button>
  <button type="button" data-tab="poster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>募集画像</button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>設定</button>
</div></nav>

<dialog id="dlg"><form id="dlgForm"></form></dialog>

<script>
(()=>{
/* ---------- 保存（端末の中だけ） ---------- */
const DBN='goods-note',KEY='state';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function load(){
  try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
  catch(e){try{return JSON.parse(localStorage.getItem(DBN)||'null')}catch(_){return null}}
}
async function save(){
  const data=JSON.parse(JSON.stringify(S));
  try{const db=await idb();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(data,KEY);t.oncomplete=res;t.onerror=res})}
  catch(e){try{localStorage.setItem(DBN,JSON.stringify(data))}catch(_){}}
}

/* ---------- データ ---------- */
const OSHI=['#e8457c','#ff3b30','#ff9500','#f5c400','#34c759','#00b8a9','#0a84ff','#5e5ce6','#af52de','#8e8e93'];
const blank=()=>({items:[],wants:[],deals:[],handle:'',terms:'',oshi:S?.oshi||OSHI[0]});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=n=>{const d=today();d.setDate(d.getDate()+n);return iso(d)};
function sample(){
  return {sample:true,handle:'@example',terms:'同種交換・郵送（定形郵便）優先',oshi:OSHI[0],
  items:[
    {id:uid(),name:'缶バッジ 第2弾',work:'見本アニメ',chara:'キャラA',qty:2,give:true,photo:'',sample:true},
    {id:uid(),name:'アクリルスタンド',work:'見本アニメ',chara:'キャラB',qty:1,give:true,photo:'',sample:true},
    {id:uid(),name:'ブロマイド くじB賞',work:'見本アニメ',chara:'キャラA',qty:1,give:false,photo:'',sample:true}],
  wants:[
    {id:uid(),name:'缶バッジ 第2弾',work:'見本アニメ',chara:'キャラC',note:'1つ',photo:'',sample:true},
    {id:uid(),name:'アクリルキーホルダー',work:'見本アニメ',chara:'キャラC',note:'',photo:'',sample:true}],
  deals:[
    {id:uid(),partner:'@sample_friend',give:'キャラA 缶バッジ 第2弾',get:'キャラC 缶バッジ 第2弾',method:'郵送',shipBy:addDays(-1),sent:false,received:false,note:'くじの発送待ち',cancel:false,sample:true},
    {id:uid(),partner:'@sample_mutual',give:'キャラB アクリルスタンド',get:'キャラC アクリルキーホルダー',method:'手渡し',shipBy:addDays(5),sent:true,received:false,note:'イベント会場で',cancel:false,sample:true}]};
}
let S=null;
let tab='deals', q='', dealSeg='open';

/* ---------- 写真を小さくする ---------- */
function shrink(file,max=420){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res('');im.src=fr.result};fr.onerror=()=>res('');fr.readAsDataURL(file)})}

/* ---------- 表示の部品 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!s)return'';const [,m,d]=s.split('-');return `${+m}月${+d}日`};
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const label=x=>[x.chara,x.name].filter(Boolean).join(' ');
const ICON_IMG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>';
const CHEV='<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg>';
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const thumb=p=>p?`<img class="thumb" src="${p}" alt="">`:`<div class="thumb">${ICON_IMG}</div>`;
function dealState(d){
  if(d.cancel)return{cls:'done',label:'取り消し'};
  if(d.sent&&d.received)return{cls:'done',label:'完了'};
  if(!d.sent&&d.shipBy&&new Date(d.shipBy)<today())return{cls:'late',label:`期限切れ（${fmt(d.shipBy)}）`};
  if(d.sent&&!d.received)return{cls:'wait',label:'相手からの到着待ち'};
  return{cls:'open',label:d.shipBy?`${fmt(d.shipBy)}までに${d.method==='手渡し'?'渡す':'発送'}`:'約束中'};
}
const TITLES={deals:'交換',items:'持ち物',wants:'求',poster:'募集画像',settings:'設定'};
function render(){
  document.documentElement.style.setProperty('--oshi',S.oshi||OSHI[0]);
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  $('#pageTitle').textContent=TITLES[tab];
  $('#sampleBanner').hidden=!S.sample;
  $('#addBtn').style.visibility=(tab==='poster'||tab==='settings')?'hidden':'visible';
  const v=$('#view');
  v.innerHTML={deals:viewDeals,items:viewItems,wants:viewWants,poster:viewPoster,settings:viewSettings}[tab]();
  if(tab==='poster')drawPoster();
}
function viewDeals(){
  const open=S.deals.filter(d=>!d.cancel&&!(d.sent&&d.received)).sort((a,b)=>(a.shipBy||'9').localeCompare(b.shipBy||'9'));
  const closed=S.deals.filter(d=>d.cancel||(d.sent&&d.received));
  const late=open.filter(d=>dealState(d).cls==='late').length, waiting=open.filter(d=>d.sent&&!d.received).length;
  const list=dealSeg==='open'?open:closed;
  const cell=d=>{const st=dealState(d);return `<div class="cell" role="group">
    <div class="main" data-act="editDeal" data-id="${d.id}" style="cursor:pointer">
      <div class="t">${esc(d.partner||'相手未入力')}</div>
      <div class="s">出す　${esc(d.give)}<br>もらう　${esc(d.get)}</div>
      <div class="status ${st.cls}"><i class="dot"></i>${esc(st.label)}<span>・${esc(d.method)}</span>${d.sample?'<span class="tag grey" style="margin-left:4px">見本</span>':''}</div>
      ${d.note?`<div class="s">${esc(d.note)}</div>`:''}
      ${d.cancel?'':`<div class="toggles">
        <button type="button" class="toggle ${d.sent?'on':''}" data-act="sent" data-id="${d.id}">${d.sent?CHECK:''}${d.method==='手渡し'?'渡した':'送った'}</button>
        <button type="button" class="toggle ${d.received?'on':''}" data-act="recv" data-id="${d.id}">${d.received?CHECK:''}受け取った</button></div>`}
    </div>${CHEV}</div>`};
  return `<div class="group summary"><div><small>進行中</small><b>${open.length}</b></div><div><small>期限切れ</small><b class="${late?'late':''}">${late}</b></div><div><small>到着待ち</small><b>${waiting}</b></div></div>
    <div style="height:16px"></div>
    <div class="seg" role="group" aria-label="表示する交換"><button type="button" data-seg="open" aria-pressed="${dealSeg==='open'}">進行中</button><button type="button" data-seg="closed" aria-pressed="${dealSeg==='closed'}">終わった</button></div>
    <div style="height:10px"></div>
    ${list.length?`<div class="group">${list.map(cell).join('')}</div>`:`<div class="group empty">${dealSeg==='open'?'進行中の交換はありません。<br>右上の＋で約束を記録できます。持ち物を登録していなくても書けます。':'終わった交換はまだありません。'}</div>`}`;
}
function viewItems(){
  const hits=q?S.items.filter(i=>norm(i.name+i.work+i.chara).includes(norm(q))):null;
  const list=hits??S.items;
  const total=S.items.reduce((a,i)=>a+(+i.qty||0),0);
  const cell=i=>`<div class="cell has-thumb">${thumb(i.photo)}
    <div class="main" data-act="editItem" data-id="${i.id}" style="cursor:pointer"><div class="t">${esc(label(i))}</div>
      <div class="s">${i.give?'<span class="tag">譲</span>':''}${i.sample?'<span class="tag grey">見本</span>':''}${esc(i.work||'')}</div></div>
    <div class="stepper"><button type="button" data-act="dec" data-id="${i.id}" aria-label="1つ減らす">−</button><span>${+i.qty||0}</span><button type="button" data-act="inc" data-id="${i.id}" aria-label="1つ増やす">＋</button></div></div>`;
  return `<label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="q" type="search" placeholder="これ持ってる？" value="${esc(q)}" aria-label="持ち物を探す"></label>
    ${q?`<div class="group answer ${hits.length?'':'no'}">${hits.length?`<b>持っています</b>　${hits.length}種類・${hits.reduce((a,i)=>a+(+i.qty||0),0)}個`:'<b>見つかりません</b>　まだ持っていないかもしれません'}</div><div style="height:12px"></div>`
      :`<div class="group summary" style="margin-top:8px"><div><small>種類</small><b>${S.items.length}</b></div><div><small>合計</small><b>${total}</b></div><div><small>譲に出す</small><b>${S.items.filter(i=>i.give).length}</b></div></div>`}
    ${q?'':'<p class="caption">一覧</p>'}
    ${list.length?`<div class="group">${list.map(cell).join('')}</div>`:(q?'':`<div class="group empty">まだ登録がありません。</div>`)}
    ${q?'':`<div class="group" style="margin-top:12px"><button type="button" class="cell linkcell" data-act="bulk" data-kind="items">まとめて追加</button></div>
    <p class="foot">全部を登録しなくて大丈夫です。交換に出すものや、重ねて買いやすいものだけで十分です。</p>`}`;
}
function viewWants(){
  const cell=w=>{const have=S.items.some(i=>norm(i.name)===norm(w.name)&&norm(i.chara)===norm(w.chara));return `<button type="button" class="cell has-thumb" data-act="editWant" data-id="${w.id}">${thumb(w.photo)}
    <div class="main"><div class="t">${esc(label(w))}</div>
    <div class="s">${have?'<span class="tag">持っています</span>':''}${w.sample?'<span class="tag grey">見本</span>':''}${esc([w.work,w.note].filter(Boolean).join('・'))}</div></div>${CHEV}</button>`};
  return `${S.wants.length?`<div class="group">${S.wants.map(cell).join('')}</div>`:`<div class="group empty">欲しいものはまだありません。</div>`}
    <div class="group" style="margin-top:12px"><button type="button" class="cell linkcell" data-act="bulk" data-kind="wants">まとめて追加</button></div>`;
}
function viewPoster(){
  return `<div class="group">
      <div class="field"><label for="handle">アカウント</label><input id="handle" value="${esc(S.handle)}" placeholder="@yourname"></div>
      <div class="field"><label for="terms">条件</label><input id="terms" value="${esc(S.terms)}" placeholder="同種交換・郵送優先"></div></div>
    <p class="foot">持ち物で「譲」にしたものと、求のものから作ります。画像を長押しすると写真に保存できます。</p>
    <div style="height:14px"></div>
    <img id="posterImg" class="poster" alt="募集画像のプレビュー">`;
}
function viewSettings(){
  return `<p class="caption">推し色</p>
    <div class="group colors" role="group" aria-label="推し色">${OSHI.map(c=>`<button type="button" data-oshi="${c}" style="background:${c}" aria-label="${c}" aria-pressed="${S.oshi===c}"></button>`).join('')}</div>
    <p class="foot">ボタンや募集画像の色が変わります。</p>
    <p class="caption">バックアップ</p>
    <div class="group"><button type="button" class="cell linkcell" data-act="export">データを書き出してコピー</button></div>
    <p class="foot">データはこのiPhoneの中だけにあります。機種変更やブラウザのデータ削除で消えるので、ときどき書き出してメモなどに貼っておいてください。</p>
    <div style="height:10px"></div>
    <textarea id="backupText" class="plain" aria-label="書き出したデータ" readonly placeholder="書き出したデータがここに出ます"></textarea>
    <p class="caption">読み込み</p>
    <textarea id="importText" class="plain" aria-label="読み込むデータ" placeholder="書き出した文字をここに貼り付け"></textarea>
    <div class="group" style="margin-top:10px"><button type="button" class="cell linkcell" data-act="import">読み込む（今のデータは置き換わります）</button></div>
    <p id="backupMsg" class="foot" role="status"></p>`;
}

/* ---------- 募集画像（1080×1350） ---------- */
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
async function drawPoster(){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const F='-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif', R='"Zen Maru Gothic","Hiragino Maru Gothic ProN",'+F, oshi=S.oshi||OSHI[0];
  const mix=(a,b,t)=>{const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(v*t+B[i]*(1-t)).toString(16).padStart(2,'0')).join('')};
  const paper=mix(oshi,'#ffffff',.08), tile=mix(oshi,'#ffffff',.14), deep=mix(oshi,'#3b3040',.8), ink='#3b3040';
  g.fillStyle=paper;g.fillRect(0,0,W,H);
  g.fillStyle='#ffffff';rr(g,32,32,W-64,H-64,40);g.fill();
  g.fillStyle=deep;g.font=`700 64px ${R}`;g.fillText('交換募集',64,130);
  g.fillStyle='#6d6d72';g.font=`500 32px ${F}`;g.fillText(S.handle||'',64,170);
  async function block(title,arr,y0,y1){
    g.fillStyle=title==='譲'?oshi:mix(oshi,'#ffffff',.25);rr(g,64,y0,96,52,26);g.fill();
    g.fillStyle=title==='譲'?'#fff':deep;g.font=`700 30px ${F}`;g.fillText(title,96,y0+37);
    g.fillStyle='#6d6d72';g.font=`500 26px ${F}`;g.fillText(`${arr.length}件`,178,y0+36);
    const cols=4,gap=20,cw=(W-128-gap*(cols-1))/cols,ch=cw+56;const y=y0+76;
    for(let k=0;k<Math.min(arr.length,8);k++){
      const it=arr[k],x=64+(k%cols)*(cw+gap),yy=y+Math.floor(k/cols)*ch;if(yy+ch>y1)break;
      g.fillStyle=tile;rr(g,x,yy,cw,cw,24);g.fill();
      const im=await loadImg(it.photo);
      if(im){g.save();rr(g,x,yy,cw,cw,24);g.clip();const s=Math.max(cw/im.width,cw/im.height);g.drawImage(im,x+(cw-im.width*s)/2,yy+(cw-im.height*s)/2,im.width*s,im.height*s);g.restore()}
      else{g.fillStyle='#c7c7cc';g.font=`600 24px ${F}`;g.textAlign='center';g.fillText('No Photo',x+cw/2,yy+cw/2+8);g.textAlign='left'}
      g.fillStyle=ink;g.font=`600 23px ${F}`;const t=label(it);g.fillText(t.length>10?t.slice(0,9)+'…':t,x+2,yy+cw+34);
    }
    if(!arr.length){g.fillStyle='#c7c7cc';g.font=`500 28px ${F}`;g.fillText('なし',64,y+44)}
    if(arr.length>8){g.fillStyle='#6d6d72';g.font=`500 24px ${F}`;g.textAlign='right';g.fillText(`ほか${arr.length-8}件`,W-64,y0+36);g.textAlign='left'}
  }
  await block('譲',S.items.filter(i=>i.give),210,720);
  await block('求',S.wants,740,1230);
  g.fillStyle=tile;g.fillRect(64,1250,W-128,3);
  g.fillStyle=ink;g.font=`500 28px ${F}`;g.fillText(S.terms||'',64,1300);
  const img=$('#posterImg');if(img)img.src=c.toDataURL('image/png');
}

/* ---------- 入力の画面（下から出る） ---------- */
const dlg=$('#dlg'),form=$('#dlgForm');
let pendingPhoto=null;
function open(title,body,onSave,onDelete){
  form.innerHTML=`<div class="sheetbar"><button type="button" class="cancel" id="cancelBtn">キャンセル</button><h3>${title}</h3><button type="submit" class="save">保存</button></div>
    <div class="sheetbody">${body}${onDelete?'<div class="group" style="margin-top:24px"><button type="button" class="cell danger" id="delBtn">削除</button></div>':''}</div>`;
  pendingPhoto=null;
  form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;await onSave(new FormData(form));dlg.close();await save();render()};
  $('#cancelBtn').onclick=()=>dlg.close();
  if(onDelete){let armed=false;$('#delBtn').onclick=async e=>{if(!armed){armed=true;e.currentTarget.textContent='もう一度押すと削除します';return}onDelete();dlg.close();await save();render()}}
  const ph=form.querySelector('input[type=file]');
  if(ph)ph.onchange=async()=>{if(ph.files[0]){pendingPhoto=await shrink(ph.files[0]);const pv=form.querySelector('.photo img,.photo .thumb');if(pv)pv.outerHTML=`<img src="${pendingPhoto}" alt="">`}};
  dlg.showModal();
}
function leaveSample(){if(S.sample)S=blank()}
function picks(target,arr,where){
  if(!arr.length)return `<p class="foot">${where}を登録すると、ここからタップで選べます。</p>`;
  return `<div class="picks">${arr.slice(0,14).map(x=>`<button type="button" data-pick="${target}" data-val="${esc(label(x))}">${esc(label(x))}</button>`).join('')}</div>`;
}
const field=(lab,id,name,val,attrs='')=>`<div class="field"><label for="${id}">${lab}</label><input id="${id}" name="${name}" value="${esc(val??'')}" ${attrs}></div>`;
function photoField(id,src){return `<div class="photo">${src?`<img src="${src}" alt="">`:`<div class="thumb">${ICON_IMG}</div>`}<label for="${id}">${src?'写真を変える':'写真を追加'}</label><input type="file" accept="image/*" id="${id}"></div>`}
function editDeal(d){
  const isNew=!d;d=d||{method:'郵送',sent:false,received:false};
  open(isNew?'交換を記録':'交換を編集',
   `<p class="caption">相手</p><div class="group">${field('相手','f-partner','partner',d.partner,'required placeholder="@partner"')}</div>
    <p class="caption">自分が出すもの</p><div class="group">${field('出す','f-give','give',d.give,'required placeholder="選ぶか書く"')}</div>
    ${picks('f-give',S.items.filter(i=>i.give).concat(S.items.filter(i=>!i.give)),'持ち物')}
    <p class="caption">相手からもらうもの</p><div class="group">${field('もらう','f-get','get',d.get,'required placeholder="選ぶか書く"')}</div>
    ${picks('f-get',S.wants,'求')}
    <p class="caption">やりとり</p><div class="group">
      <div class="field"><label for="f-method">方法</label><select id="f-method" name="method"><option ${d.method==='郵送'?'selected':''}>郵送</option><option ${d.method==='手渡し'?'selected':''}>手渡し</option></select></div>
      ${field('期限','f-shipBy','shipBy',d.shipBy||'','type="date"')}
      ${field('メモ','f-note','note',d.note,'placeholder="くじの発送待ち など"')}
      ${isNew?'':`<div class="field switch"><label for="f-cancel">取り消しになった</label><input type="checkbox" class="sw" id="f-cancel" name="cancel" ${d.cancel?'checked':''}></div>`}</div>`,
    fd=>{if(isNew){leaveSample();d.id=uid();S.deals.push(d)}Object.assign(d,{partner:fd.get('partner'),give:fd.get('give'),get:fd.get('get'),method:fd.get('method'),shipBy:fd.get('shipBy'),note:fd.get('note'),cancel:!!fd.get('cancel'),sample:false})},
    isNew?null:()=>{S.deals=S.deals.filter(x=>x!==d)});
}
function editItem(i){
  const isNew=!i;i=i||{qty:1,give:false};
  open(isNew?'持ち物を追加':'持ち物を編集',
   `<div style="height:14px"></div><div class="group">${photoField('f-photo',i.photo)}</div>
    <div style="height:18px"></div><div class="group">${field('名前','f-name','name',i.name,'required placeholder="缶バッジ 第2弾"')}${field('作品','f-work','work',i.work)}${field('キャラ','f-chara','chara',i.chara)}${field('個数','f-qty','qty',i.qty,'type="number" min="0" inputmode="numeric"')}
    <div class="field switch"><label for="f-give2">譲に出す</label><input type="checkbox" class="sw" id="f-give2" name="give" ${i.give?'checked':''}></div></div>`,
    fd=>{if(isNew){leaveSample();i.id=uid();S.items.push(i)}Object.assign(i,{name:fd.get('name'),work:fd.get('work'),chara:fd.get('chara'),qty:+fd.get('qty')||0,give:!!fd.get('give'),sample:false});if(pendingPhoto)i.photo=pendingPhoto},
    isNew?null:()=>{S.items=S.items.filter(x=>x!==i)});
}
function editWant(w){
  const isNew=!w;w=w||{};
  open(isNew?'欲しいものを追加':'欲しいものを編集',
   `<div style="height:14px"></div><div class="group">${photoField('f-wphoto',w.photo)}</div>
    <div style="height:18px"></div><div class="group">${field('名前','f-wname','name',w.name,'required')}${field('作品','f-wwork','work',w.work)}${field('キャラ','f-wchara','chara',w.chara)}${field('メモ','f-wnote','note',w.note,'placeholder="1つ など"')}</div>`,
    fd=>{if(isNew){leaveSample();w.id=uid();S.wants.push(w)}Object.assign(w,{name:fd.get('name'),work:fd.get('work'),chara:fd.get('chara'),note:fd.get('note'),sample:false});if(pendingPhoto)w.photo=pendingPhoto},
    isNew?null:()=>{S.wants=S.wants.filter(x=>x!==w)});
}
function bulkAdd(kind){
  const isItem=kind==='items';
  open('まとめて追加',
   `<p class="caption">1行に1つ。「×2」で個数になります</p>
    <div class="group"><div class="field"><textarea name="lines" id="f-lines" aria-label="まとめて追加する内容" placeholder="キャラA 缶バッジ 第2弾 ×2&#10;キャラB アクスタ&#10;ブロマイド くじB賞"></textarea></div></div>
    <p class="foot">メモやXの投稿から貼り付けてもかまいません。写真はあとから足せます。</p>
    <div style="height:14px"></div>
    <div class="group">${field('作品','f-bwork','work','','placeholder="全部に共通なら"')}
    ${isItem?'<div class="field switch"><label for="f-bgive">全部を譲に出す</label><input type="checkbox" class="sw" id="f-bgive" name="give" checked></div>':''}</div>`,
    fd=>{const lines=String(fd.get('lines')||'').split(/\n/).map(l=>l.trim()).filter(Boolean);if(!lines.length)return;leaveSample();
      for(const l of lines){const m=l.match(/^(.*?)[\s　]*[×xX✕*＊]\s*(\d+)$/);const name=(m?m[1]:l).trim(),qty=m?+m[2]:1;
        if(isItem)S.items.push({id:uid(),name,work:fd.get('work')||'',chara:'',qty,give:!!fd.get('give'),photo:''});
        else S.wants.push({id:uid(),name,work:fd.get('work')||'',chara:'',note:qty>1?`${qty}つ`:'',photo:''});}});
}

/* ---------- 操作 ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;q='';render();window.scrollTo(0,0)});
$('#addBtn').onclick=()=>({deals:()=>editDeal(),items:()=>editItem(),wants:()=>editWant()})[tab]?.();
$('#clearSample').onclick=async()=>{S=blank();await save();render()};
form.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const inp=document.getElementById(b.dataset.pick);if(!inp)return;const v=b.dataset.val;inp.value=inp.value.trim()?inp.value.trim()+'、'+v:v});
document.getElementById('view').addEventListener('click',async e=>{
  const sg=e.target.closest('[data-seg]');if(sg){dealSeg=sg.dataset.seg;render();return}
  const oc=e.target.closest('[data-oshi]');if(oc){S.oshi=oc.dataset.oshi;await save();render();return}
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,a=b.dataset.act;
  if(a==='sent'||a==='recv'){e.stopPropagation();const d=S.deals.find(x=>x.id===id);if(!d)return;if(a==='sent')d.sent=!d.sent;else d.received=!d.received;await save();render();return}
  if(a==='inc'||a==='dec'){const i=S.items.find(x=>x.id===id);if(!i)return;i.qty=Math.max(0,(+i.qty||0)+(a==='inc'?1:-1));await save();render();return}
  if(a==='bulk')return bulkAdd(b.dataset.kind);
  if(a==='editDeal')return editDeal(S.deals.find(x=>x.id===id));
  if(a==='editItem')return editItem(S.items.find(x=>x.id===id));
  if(a==='editWant')return editWant(S.wants.find(x=>x.id===id));
  if(a==='export'){const t=JSON.stringify({app:'goods-note',v:1,at:new Date().toISOString(),data:S});const ta=$('#backupText');ta.value=t;
    try{await navigator.clipboard.writeText(t);$('#backupMsg').textContent='コピーしました。メモなどに貼って残してください。'}catch(_){ta.focus();ta.select();$('#backupMsg').textContent='上の文字を選んでコピーしてください。'}}
  if(a==='import'){try{const o=JSON.parse($('#importText').value);if(!o||o.app!=='goods-note'||!o.data)throw 0;S=Object.assign(blank(),o.data);await save();render();$('#backupMsg').textContent='読み込みました。'}
    catch(_){$('#backupMsg').textContent='読み込めませんでした。書き出したときの文字を、そのまま全部貼り付けてください。'}}
});
document.addEventListener('input',async e=>{
  if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const el=$('#q');el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
  if(e.target.id==='handle'||e.target.id==='terms'){S[e.target.id]=e.target.value;clearTimeout(window.__pt);window.__pt=setTimeout(async()=>{await save();drawPoster()},300)}
});

/* ---------- 起動 ---------- */
(async()=>{const d=await load();S=d&&Array.isArray(d.items)?Object.assign({oshi:OSHI[0]},d):sample();render()})();
})();
</script>
