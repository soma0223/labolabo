<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
/* チューナーの画面：1列のカード、中心に「音の高さのレーン」。合っている=青緑、高い=橙、低い=青。下に5つのタブ */
:root{
  --bg:#f3f6f6; --sheet:#ffffff; --ink:#14232a; --muted:#566a72; --rule:#d3dddf;
  --accent:#0b7a80; --accent-soft:#dff1f1; --hi:#b8530a; --hi-soft:#fbe9d8; --lo:#2c5bd0; --lo-soft:#e2e9fb; --bad:#b3261e;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-code:"M PLUS 1 Code","Hiragino Sans",ui-monospace,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --t-xs:12px;--t-s:14px;--t-m:16px;--t-l:19px;--t-xl:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --sheet:#162125; --ink:#e4eef0; --muted:#93a8ae; --rule:#29383d;
  --accent:#5fd0d2; --accent-soft:#143436; --hi:#f2a45f; --hi-soft:#3a2713; --lo:#8fb0ff; --lo-soft:#1b2745; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --sheet:#162125; --ink:#e4eef0; --muted:#93a8ae; --rule:#29383d;
  --accent:#5fd0d2; --accent-soft:#143436; --hi:#f2a45f; --hi-soft:#3a2713; --lo:#8fb0ff; --lo-soft:#1b2745; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-m)/1.75 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) 110px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:var(--t-xl);font-weight:700;letter-spacing:.04em}
h2{font-size:var(--t-l);font-weight:700}
h3{font-size:var(--t-m);font-weight:700}
p{margin:0}
ul{margin:0;padding-left:1.2em}
.code{font-family:var(--f-code);font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted)}
header.top,main{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
main{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.note{font-size:var(--t-s);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.btn{all:unset;cursor:pointer;padding:11px 18px;border-radius:9px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:var(--t-s);text-align:center}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.btn.on{background:var(--accent);color:var(--sheet);box-shadow:none}
.btn.big{padding:14px 22px;font-size:var(--t-m);flex:1 1 auto}
.btn:focus-visible,summary:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;font:600 11px var(--f-code);letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.weak{background:var(--hi-soft);color:var(--hi)}
.tag.mid{background:var(--lo-soft);color:var(--lo)}
.why{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 8px 8px 0;font-size:var(--t-s)}
.why b{display:block;font:600 11px var(--f-code);letter-spacing:.1em;color:var(--accent)}
.warnbox{border:1px solid var(--hi);background:var(--hi-soft);color:var(--ink);padding:var(--s3) var(--s4);border-radius:8px;font-size:var(--t-s)}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s3);font-size:var(--t-s)}
dl.kv dt{font-weight:700;color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0}
details{border-top:1px solid var(--rule);padding-top:var(--s2)}
details>summary{cursor:pointer;font-weight:700;font-size:var(--t-s);color:var(--accent);border-radius:4px}
details>div{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2);font-size:var(--t-s)}
.steps{display:flex;flex-direction:column;gap:var(--s2)}
.step{display:flex;gap:var(--s3);align-items:center;padding:var(--s3);border:1px solid var(--rule);border-radius:10px}
.step .n{font:600 var(--t-s) var(--f-code);color:var(--muted);width:20px}
.step .t{flex:1;min-width:0}
.step .t small{display:block;color:var(--muted);font-size:var(--t-xs);line-height:1.5}
.step .done{font:600 var(--t-xs) var(--f-code);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.notes{display:flex;gap:var(--s2);justify-content:center}
.notes span{font:600 var(--t-l) var(--f-code);padding:6px 14px;border-radius:9px;border:1px solid var(--rule);color:var(--muted)}
.notes span.on{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.phase{text-align:center;font-weight:700;font-size:var(--t-l)}
.hear{text-align:center;font:600 var(--t-xs) var(--f-code);color:var(--muted)}
.hear.on{color:var(--accent)}
canvas.lane{width:100%;height:190px;display:block;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.nums div{border:1px solid var(--rule);border-radius:10px;padding:var(--s2) var(--s3);min-width:0}
.nums small{display:block;font-size:var(--t-xs);color:var(--muted);line-height:1.4}
.nums b{font:600 var(--t-l) var(--f-code);font-variant-numeric:tabular-nums}
.c-ok{color:var(--accent)}.c-hi{color:var(--hi)}.c-lo{color:var(--lo)}
table{border-collapse:collapse;width:100%;font-size:var(--t-s);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
th{font-size:var(--t-xs);color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{all:unset;cursor:pointer;flex:1 1 0;max-width:128px;text-align:center;padding:8px 2px;border-radius:9px;font-size:var(--t-xs);font-weight:700;color:var(--muted)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .1s linear}}
</style>

<header class="top"><h1>うたラボ</h1><span class="code" id="hdr"></span></header>
<main id="view"></main>
<nav class="tabs" aria-label="画面">
  <button data-tab="home">きょう</button>
  <button data-tab="warm">準備</button>
  <button data-tab="pitch">音程</button>
  <button data-tab="learn">仕組み</button>
  <button data-tab="log">記録</button>
</nav>

<script>
(function(){
"use strict";
/* ---------- 状態 ---------- */
var KEY='uta-lab-v1';
var S={range:null,stage:1,pattern:'single',sets:[],days:{},est:[]};
try{var raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function day(){var k=today(); if(!S.days[k]) S.days[k]={warm:{}}; if(!S.days[k].warm) S.days[k].warm={}; return S.days[k];}
var tab='home', runId=0, raf=0, micState='unknown';
var W=null;   /* 準備の進行 */
var T=null;   /* 音程の1回 */
var SET=null; /* 音程の5回1セット */
var R=null;   /* 音域の測定 */
var wipe=false;
var view=document.getElementById('view');

/* ---------- 音 ---------- */
var ac=null, analyser=null, buf=null, yd=null;
function ensureAC(){ if(!ac){var C=window.AudioContext||window.webkitAudioContext; ac=new C();} if(ac.state==='suspended') ac.resume(); return ac; }
function micOn(){
  if(analyser) return Promise.resolve(true);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micState='blocked';return Promise.resolve(false);}
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
    ensureAC(); var src=ac.createMediaStreamSource(st); analyser=ac.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    buf=new Float32Array(2048); micState='ok'; return true;
  }).catch(function(){micState='blocked';return false;});
}
/* YIN法（de Cheveigné & Kawahara, 2002）で声の高さを求める */
function yin(b,sr){
  var n=b.length, half=n>>1, i, tau, rms=0;
  for(i=0;i<n;i++) rms+=b[i]*b[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.008) return {f:0,rms:rms};
  var tMin=Math.max(2,Math.floor(sr/1100)), tMax=Math.min(half-2,Math.floor(sr/65));
  if(!yd||yd.length<tMax+2) yd=new Float32Array(tMax+2);
  var run=0; yd[0]=1;
  for(tau=1;tau<=tMax+1;tau++){
    var s=0; for(i=0;i<half;i++){var d=b[i]-b[i+tau]; s+=d*d;}
    run+=s; yd[tau]=run>0? s*tau/run : 1;
  }
  var best=-1;
  for(tau=tMin;tau<=tMax;tau++){ if(yd[tau]<0.15){ while(tau+1<=tMax&&yd[tau+1]<yd[tau]) tau++; best=tau; break; } }
  if(best<0){ var mn=1; for(tau=tMin;tau<=tMax;tau++){ if(yd[tau]<mn){mn=yd[tau];best=tau;} } if(mn>0.35) return {f:0,rms:rms}; }
  var a=yd[best-1], c0=yd[best], c=yd[best+1], den=a-2*c0+c, sh=den? 0.5*(a-c)/den : 0;
  if(sh>1||sh<-1) sh=0;
  return {f:sr/(best+sh),rms:rms};
}
function detect(){ if(!analyser) return {f:0,rms:0}; analyser.getFloatTimeDomainData(buf); return yin(buf,ac.sampleRate); }
function tone(m,ms,when){
  ensureAC(); var t=ac.currentTime+(when||0)/1000, d=ms/1000;
  var o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.28,t+0.03); g.gain.setValueAtTime(0.28,t+d-0.12); g.gain.linearRampToValueAtTime(0,t+d-0.02);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
}
function f2m(f){return 69+12*Math.log(f/440)/Math.LN2;}
var NN=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
function nname(m){m=Math.round(m);return NN[((m%12)+12)%12]+(Math.floor(m/12)-1);}
function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}), h=s.length>>1; return s.length%2? s[h] : (s[h-1]+s[h])/2; }
function pct(a,p){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}); return s[Math.min(s.length-1,Math.floor(p*s.length))]; }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* ms の間、毎フレーム声を調べる。mic が無いときは時間だけ進める */
function capture(ms,onFrame){
  return new Promise(function(res){
    var fr=[], t0=performance.now(), my=runId;
    (function tick(){
      if(my!==runId) return;
      var t=performance.now()-t0, r=detect();
      fr.push({t:t,f:r.f,rms:r.rms});
      if(onFrame) onFrame(t,r,fr);
      if(t<ms) raf=requestAnimationFrame(tick); else res(fr);
    })();
  });
}
function stopAll(){ runId++; cancelAnimationFrame(raf); }

/* ---------- 中身：準備の3つ ---------- */
var WARM=[
 {id:'breath',name:'息を一定に吐く',sub:'「スー」と細く、15秒',ms:15000,mic:true,
  why:'音程のぶれを減らし、声に芯を作る土台です。',
  how:'声の高さと大きさは、声帯の下にかかる息の圧力で決まります。圧力が揺れると、音程も声の大きさも揺れます。',
  tip:'吸ったときに広がった肋骨とお腹まわりを、吐いている間すぐにしぼませません。遠くのろうそくの火を、消さずに揺らし続けるつもりで吐きます。',
  check:'最後まで同じ強さで吐けた。',
  ev:[['','仕組みは確立された知識'],['mid','練習法は伝統的な指導法（支え）']]},
 {id:'siren',name:'ストローでサイレン',sub:'低い音から高い音へ行き来、60秒',ms:60000,mic:true,
  why:'喉の締めつけを取り、地声と裏声をつなぎます。高い音の土台です。',
  how:'口先を細くすると口の中の圧力が上がり、声帯が少ない力で振動します。喉に負担をかけずに声帯を伸ばす練習ができます（半閉鎖声道エクササイズ、Titze）。',
  tip:'ストローをくわえて「うー」と、救急車のサイレンのように上下します。高いところほど小さく軽く出します。途中で裏返ってかまいません。ストローがなければ、唇をブルブル震わせるか、口をすぼめた「うー」でも代わりになります。',
  check:'喉が痛くない。終わった後に声が軽く出る。',
  ev:[['','研究で効果が確かめられている']]},
 {id:'onset',name:'出だしをそろえる',sub:'小さく短く「あ、あ、あ」、30秒',ms:30000,mic:false,
  why:'一声目の印象を作る練習です。',
  how:'息と声帯の閉じが同時に始まると、息もれもぶつけた音もない出だしになります。',
  tip:'小さな声で短く「あ」を続けます。息が先に出る「は」にも、喉を詰めた「っあ」にもしません。机の上に、指でそっと点を置くつもりで出します。',
  check:'出だしに息の音も、喉の詰まる音もない。',
  ev:[['','仕組みは確立された知識'],['mid','イメージは指導法']]}
];
var STAGE={1:['見ながら合わせる','歌っている間、声の高さが見えます。'],2:['歌った後に見る','歌っている間は見えません。終わってから答え合わせをします。'],3:['先に自分で当てる','答えを見る前に、高かったか低かったかを自分で言います。']};
var PAT={single:{name:'1音',off:[0],len:2500},step:{name:'3音・となり',off:[0,2,4],len:1100},leap:{name:'3音・とび',off:[0,4,7],len:1100}};
var OKC=35; /* 合っているとみなす幅（セント）。目安として置いた値 */

/* ---------- 表示の部品 ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tags(ev){return ev.map(function(e){return '<span class="tag '+e[0]+'">'+e[1]+'</span>';}).join(' ');}
function micNote(){
  if(micState!=='blocked') return '';
  return '<div class="warnbox"><b>このページではマイクが使えません。</b><br>Claudeのアプリの中で開いている場合、マイクは止められています。同じファイルをブラウザで直接開くと、声の判定が使えます。お手本の音と説明は、このままでも使えます。</div>';
}
function sgn(c){c=Math.round(c);return (c>0?'+':'')+c;}
function cls(c){return Math.abs(c)<=OKC?'c-ok':(c>0?'c-hi':'c-lo');}
function word(c){return Math.abs(c)<=OKC?'合っている':(c>0?'高い':'低い');}

/* ---------- きょう ---------- */
function vHome(){
  var d=day(), wdone=WARM.filter(function(w){return d.warm[w.id];}).length, psets=S.sets.filter(function(s){return s.d===today();}).length;
  var h='<section class="sheet"><h2>喉の調子は？</h2><div class="row">'+
    [['good','いい'],['ok','ふつう'],['bad','痛い・かれている']].map(function(o){return '<button class="btn line'+(d.throat===o[0]?' on':'')+'" data-act="throat" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  if(d.throat==='bad') h+='<div class="warnbox">今日は歌う練習を休みます。やるなら「ストローでサイレン」を小さな声で1分だけにします。痛みやかすれが2週間以上続くときは、耳鼻咽喉科で診てもらってください。</div>';
  h+='</section>';
  h+='<section class="sheet"><h2>きょうの練習</h2><div class="steps">'+
    '<div class="step"><span class="n">1</span><div class="t"><b>準備</b><small>息・ストロー・出だし。約2分</small></div><span class="done">'+wdone+' / 3</span><button class="btn sub" data-act="go" data-v="warm">開く</button></div>'+
    '<div class="step"><span class="n">2</span><div class="t"><b>音程</b><small>5回で1セット。約3分</small></div><span class="done">'+psets+' セット</span><button class="btn sub" data-act="go" data-v="pitch">開く</button></div>'+
    '</div><p class="note">1日に長くやるより、短い練習を毎日のほうが身につきます（分散練習）。</p></section>';
  if(S.sets.length>=2){
    var a=S.sets[0], b=S.sets[S.sets.length-1];
    h+='<section class="sheet"><h2>最初の自分と比べる</h2><div class="nums"><div><small>最初のセットのずれ</small><b>'+Math.round(a.dev)+'</b></div><div><small>いちばん新しいセット</small><b>'+Math.round(b.dev)+'</b></div><div><small>いまの段階</small><b>'+S.stage+'</b></div></div><p class="note">数字はセント（半音の100分の1）。小さいほど合っています。</p></section>';
  }
  h+='<section class="sheet"><h2>この順番の理由</h2><p class="note">息と声帯が安定していないと、音程の練習をしても声がぶれます。だから準備を先に置いています。高い音と響きの練習は、この2つの後に足していきます。仕組みとコツは「仕組み」のタブでいつでも読めます。</p></section>';
  return h;
}

/* ---------- 準備 ---------- */
function vWarm(){
  var d=day(), h=micNote();
  WARM.forEach(function(w,i){
    var run=W&&W.i===i;
    h+='<section class="sheet"><div class="row" style="justify-content:space-between"><h2>'+(i+1)+'. '+w.name+'</h2>'+(d.warm[w.id]?'<span class="tag">きょう済み</span>':'')+'</div><p class="note">'+w.sub+'</p>';
    h+='<dl class="kv"><dt>コツ</dt><dd>'+w.tip+'</dd><dt>確かめ</dt><dd>'+w.check+'</dd></dl>';
    if(run&&W.phase==='run'){
      h+='<div class="bar"><i id="bar"></i></div><div class="hear" id="hear">'+(w.mic?'声を待っています':'タイマーが進んでいます')+'</div><div class="row"><button class="btn line" data-act="warmStop">やめる</button></div>';
    }else{
      if(run&&W.phase==='done'&&W.msg) h+='<div class="why"><b>結果</b>'+W.msg+'</div>';
      h+='<div class="row"><button class="btn" data-act="warmGo" data-v="'+i+'">'+(d.warm[w.id]?'もう一度':'はじめる')+'</button></div>';
    }
    h+='<details><summary>何のため・仕組み</summary><div><p><b>何のため：</b>'+w.why+'</p><p><b>仕組み：</b>'+w.how+'</p><p>'+tags(w.ev)+'</p></div></details></section>';
  });
  return h;
}
function warmGo(i){
  stopAll(); var my=runId, w=WARM[i]; W={i:i,phase:'run'};
  (w.mic? micOn() : Promise.resolve(false)).then(function(mic){
    if(my!==runId) return; render();
    return capture(w.ms,function(t,r){
      var b=document.getElementById('bar'); if(b) b.style.width=Math.min(100,t/w.ms*100)+'%';

function pickRoot(){
  var p=PAT[S.pattern], span=Math.max.apply(null,p.off), lo=S.range.lo+1, hi=Math.max(lo,S.range.hi-1-span), m, k=0;
  do{ m=lo+Math.floor(Math.random()*(hi-lo+1)); }while(T&&m===T.root&&hi>lo&&++k<8);
  return m;
}
function playNotes(){ var p=PAT[S.pattern]; p.off.forEach(function(o,i){ tone(T.root+o,p.len-80,i*p.len); }); return p.off.length*p.len; }
function mark(i){ var el=document.getElementById('notes'); if(!el) return; Array.prototype.forEach.call(el.children,function(c,j){c.className=j===i?'on':'';}); }
function trial(repeat){
  stopAll(); var my=runId, p=PAT[S.pattern];
  if(!SET||SET.done||SET.n>=5) SET={n:0,ok:0,devs:[],ons:[]};
  if(!repeat||!T) T={root:pickRoot()};
  T.phase='listen'; T.res=null; T.guess=null; ensureAC();
  micOn().then(function(mic){
    if(my!==runId) return;
    if(!mic){ T.phase='nomic'; render(); playNotes(); return; }
    render(); var total=playNotes(), notes=p.off.map(function(o){return T.root+o;});
    var t0=performance.now();
    (function hl(){ if(my!==runId||T.phase!=='listen') return; mark(Math.min(notes.length-1,Math.floor((performance.now()-t0)/p.len))); requestAnimationFrame(hl); })();
    sleep(total+350).then(function(){
      if(my!==runId) return;
      T.phase='sing'; render();
      var cv=document.getElementById('lane');
      capture(total,function(t,r,fr){
        var b=document.getElementById('bar'); if(b) b.style.width=Math.min(100,t/total*100)+'%';
        mark(Math.min(notes.length-1,Math.floor(t/p.len)));
        var hd=document.getElementById('hear'); if(hd){ hd.className='hear'+(r.f?' on':''); hd.textContent=r.f?(S.stage===1?nname(f2m(r.f)):'聞こえています'):'声を待っています'; }
        if(cv) drawLane(cv,notes,p.len,fr);
      }).then(function(fr){
        T.frames=fr; T.res=analyze(fr,notes,p.len);
        if(S.stage===3&&T.res.heard){ T.phase='guess'; render(); } else finish();
      });
    });
  });
}
function finish(){
  var r=T.res; T.phase='result';
  if(r.heard&&!T.counted){ T.counted=true; SET.n++; if(r.ok) SET.ok++; SET.devs.push(r.dev); SET.ons.push(Math.abs(r.onset));
    if(T.guess){ var truth=Math.abs(r.sustain)<=OKC?'ok':(r.sustain>0?'hi':'lo'); S.est.push(T.guess===truth?1:0); save(); } }
  render();
}
function analyze(fr,notes,len){
  var slots=notes.map(function(m,i){
    var a=fr.filter(function(x){return x.t>=i*len&&x.t<(i+1)*len;});
    var v=a.filter(function(x){return x.f>0;}).map(function(x){return {t:x.t,c:(f2m(x.f)-m)*100};});
    var oct=0, med=median(v.map(function(x){return x.c;}));
    if(Math.abs(med)>800){ oct=Math.round(med/1200); v.forEach(function(x){x.c-=oct*1200;}); }
    v=v.filter(function(x){return Math.abs(x.c)<500;});
    var t1=v.length?v[0].t:0, on=v.filter(function(x){return x.t<t1+250;}), su=v.filter(function(x){return x.t>=t1+250;});
    if(su.length<4) su=v;
    var sm=median(su.map(function(x){return x.c;}));
    return {voiced:a.length?v.length/a.length:0,oct:oct,onset:median(on.map(function(x){return x.c;})),sustain:sm,wob:median(su.map(function(x){return Math.abs(x.c-sm);}))*1.48};
  });
  var heard=slots.every(function(s){return s.voiced>=0.25;});
  var avg=function(k){return slots.reduce(function(p,s){return p+s[k];},0)/slots.length;};
  var res={heard:heard,oct:slots.some(function(s){return s.oct;}),onset:slots[0].onset,sustain:avg('sustain'),wob:avg('wob'),
    dev:slots.reduce(function(p,s){return p+Math.abs(s.sustain);},0)/slots.length,ok:heard&&slots.every(function(s){return Math.abs(s.sustain)<=OKC;})};
  var tip;
  if(res.ok&&Math.abs(res.onset)>OKC+10) tip='伸ばしている間は合っていますが、出だしが'+(res.onset<0?'低く':'高く')+'入っています。'+(res.onset<0?'下からずり上げて探している形です。':'')+'声を出す前に、頭の中でその音をはっきり鳴らしてから出します。出だしが合うと、一声目の印象が変わります。';
  else if(res.ok&&res.wob>30) tip='高さは合っていますが、ぶれが大きめです。息の圧力が揺れています。準備の「息を一定に吐く」と同じ吐き方で伸ばします。';
  else if(res.ok) tip='合っています。同じ感覚でもう一度出せるか確かめます。';
  else if(res.sustain<0) tip='全体に低めです。息の支えが途中で抜けると低くなります。肋骨をしぼませずに、音の少し上に乗るつもりで出します。';
  else if(res.sustain>0) tip='全体に高めです。力で押すと高くなります。音量を少し下げて、軽く出します。';
  else tip='音によって高い・低いが分かれています。1音に戻して、1つずつ合わせます。';
  res.tip=tip; return res;
}
function drawLane(cv,notes,len,fr){
  var dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w) return;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  var g=cv.getContext('2d'), cs=getComputedStyle(document.documentElement), col=function(n){return cs.getPropertyValue(n).trim();};
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  var lo=Math.min.apply(null,notes)-3, hi=Math.max.apply(null,notes)+3, total=notes.length*len;
  var y=function(m){return h-(m-lo)/(hi-lo)*h;}, x=function(t){return t/total*w;};
  g.strokeStyle=col('--rule'); g.lineWidth=1;
  for(var m=Math.ceil(lo);m<=hi;m++){ g.beginPath(); g.moveTo(0,y(m)); g.lineTo(w,y(m)); g.stroke(); }
  notes.forEach(function(n,i){
    g.fillStyle=col('--accent-soft'); g.fillRect(x(i*len),y(n+OKC/100),x(len),y(n-OKC/100)-y(n+OKC/100));
    g.strokeStyle=col('--accent'); g.lineWidth=2; g.beginPath(); g.moveTo(x(i*len),y(n)); g.lineTo(x((i+1)*len),y(n)); g.stroke();
  });
  fr.forEach(function(p){
    if(!p.f) return; var i=Math.min(notes.length-1,Math.floor(p.t/len)), mm=f2m(p.f), c=(mm-notes[i])*100;
    if(Math.abs(c)>800) mm-=Math.round(c/1200)*12, c=(mm-notes[i])*100;
    if(mm<lo||mm>hi) return;
    g.fillStyle=Math.abs(c)<=OKC?col('--accent'):(c>0?col('--hi'):col('--lo'));
    g.beginPath(); g.arc(x(p.t),y(mm),2.6,0,6.3); g.fill();
  });
}

function rangeGo(step){

  ['「喉を開けて」のように体の部分に注意を向けるより、体の外の結果に注意を向けるほうが上達しやすいことが、多くの運動で確かめられています（Wulf の注意の焦点の研究）。',
   '<b>外に向けるイメージ：</b>部屋の向こうの壁の一点に声を届ける。声を前歯の先から前に出す。',
   '「鼻の付け根に響かせる」は、うまく出たときにそこが振動して感じられる、という結果の感覚です。できたかどうかの確認に使います。']],
 ['音程がずれる理由',[['','研究で確かめられている']],
  ['音程が外れる人の多くは、音を正しく聞き分けられています。問題は、聞いた音を声に変える対応づけにあります（Pfordresher & Brown, 2007）。',
   '自分の声は骨を通っても聞こえるので、歌っている最中の感覚はあてになりません。だから、声を出して、ずれを外から知って、直す、を繰り返します。',
   '上達するとは、聞いて直さなくても最初から合うようになることです。段階3の「先に自分で当てる」は、自分の中のずれの感覚を育てるための練習です。']],
 ['カラオケの点数',[['weak','配点の詳細は公開されていない']],
  ['採点の中心は音程です。そのほかに、安定性、ロングトーン、ビブラート、抑揚などが見られます。',
   '点数は結果なので、直接は追いません。音程のずれと声のぶれが減れば、点数は後からついてきます。']],
 ['喉を守る',[['','声の医学の一般的な知識']],
  ['<ul><li>痛みやかすれがある日は歌いません。</li><li>練習は短く分けます。張り上げる練習を長く続けません。</li><li>水をこまめに飲みます。</li><li>かすれが2週間以上続くときは、耳鼻咽喉科で診てもらいます。</li></ul>']]
];
function vLearn(){
  return '<section class="sheet"><h2>仕組みとコツ</h2><p class="note">それぞれに、根拠の強さを付けています。</p>'+LEARN.map(function(L){
    return '<details><summary>'+L[0]+'</summary><div>'+L[2].map(function(p){return p.charAt(0)==='<'&&p.slice(0,3)==='<ul'?p:'<p>'+p+'</p>';}).join('')+'<p>'+tags(L[1])+'</p></div></details>';
  }).join('')+'</section>';
}

/* ---------- 記録 ---------- */
function vLog(){
  var h='';
  if(!S.sets.length) h+='<section class="sheet"><h2>記録</h2><p class="note">音程の練習を1セット終えると、ここにずれの移り変わりが出ます。比べる相手は、過去の自分です。</p></section>';
  else{
    var ds=S.sets.map(function(s){return s.dev;}), mx=Math.max.apply(null,ds.concat([60])), n=ds.length, W0=300, H0=80;
    var pts=ds.map(function(d,i){return (n===1?W0/2:i/(n-1)*W0).toFixed(1)+','+(H0-4-d/mx*(H0-8)).toFixed(1);});
    h+='<section class="sheet"><h2>ずれの移り変わり</h2><svg viewBox="0 0 '+W0+' '+H0+'" style="width:100%;height:auto;display:block" role="img" aria-label="セットごとのずれ"><line x1="0" x2="'+W0+'" y1="'+(H0-4-OKC/mx*(H0-8))+'" y2="'+(H0-4-OKC/mx*(H0-8))+'" stroke="var(--rule)" stroke-dasharray="4 4"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+pts.map(function(p){var q=p.split(',');return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="var(--accent)"/>';}).join('')+'</svg><p class="note">下に行くほど合っています。点線は「合っている」の幅（'+OKC+'セント）。</p>';
    if(S.est.length>=3) h+='<p>自分の感覚が当たった割合：<b>'+Math.round(S.est.reduce(function(p,c){return p+c;},0)/S.est.length*100)+'%</b>（'+S.est.length+'回）</p>';
    h+='<div class="scroll"><table><tr><th>日</th><th>段階</th><th>音の数</th><th>合った</th><th>ずれ</th><th>出だし</th></tr>'+S.sets.slice().reverse().slice(0,30).map(function(s){return '<tr><td>'+s.d.slice(5)+'</td><td>'+s.stage+'</td><td>'+PAT[s.pattern].name+'</td><td>'+s.ok+'/5</td><td>'+Math.round(s.dev)+'</td><td>'+Math.round(s.onset)+'</td></tr>';}).join('')+'</table></div></section>';
  }
  var sir=Object.keys(S.days).filter(function(k){return S.days[k].sirenHi;}).sort().slice(-10);
  if(sir.length) h+='<section class="sheet"><h2>サイレンで届いた上の音</h2><div class="scroll"><table><tr><th>日</th><th>上の音</th></tr>'+sir.reverse().map(function(k){return '<tr><td>'+k.slice(5)+'</td><td>'+nname(S.days[k].sirenHi)+'</td></tr>';}).join('')+'</table></div></section>';
  h+='<section class="sheet"><h3>記録の置き場所</h3><p class="note">記録は、この端末のこのブラウザの中だけに保存されます。</p><div class="row">'+(wipe?'<button class="btn" style="background:var(--bad)" data-act="wipeYes">本当に全部消す</button><button class="btn line" data-act="wipeNo">やめる</button>':'<button class="btn line" data-act="wipe">記録を全部消す</button>')+'</div></section>';
  return h;
}

/* ---------- 描画と操作 ---------- */
var V={home:vHome,warm:vWarm,pitch:vPitch,learn:vLearn,log:vLog};
function render(){
  view.innerHTML=V[tab]();
  document.getElementById('hdr').textContent=today().replace(/-/g,'.');
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){b.className=b.dataset.tab===tab?'on':'';});
  if(tab==='pitch'&&T&&T.phase==='result'&&T.res&&T.res.heard){ var p=PAT[S.pattern], cv=document.getElementById('lane'); if(cv) drawLane(cv,p.off.map(function(o){return T.root+o;}),p.len,T.frames); }
}
function endSet(){ var avg=function(a){return a.reduce(function(p,c){return p+c;},0)/a.length;}; var s={d:today(),stage:S.stage,pattern:S.pattern,ok:SET.ok,dev:avg(SET.devs),onset:avg(SET.ons)}; S.sets.push(s); save(); SET={done:s}; T=null; }
var ACT={
  go:function(d){stopAll();tab=d.v;render();window.scrollTo(0,0);},
  throat:function(d){day().throat=d.v;save();render();},
  warmGo:function(d){warmGo(+d.v);},
  warmStop:function(){stopAll();W=null;render();},
  stage:function(d){S.stage=+d.v;save();if(SET&&SET.done)SET=null;render();},
  pattern:function(d){S.pattern=d.v;save();if(SET&&SET.done)SET=null;render();},
  trial:function(){trial(false);},
  again:function(){trial(true);},
  next:function(){ if(SET&&SET.n>=5){endSet();render();window.scrollTo(0,0);} else trial(false); },
  hear:function(){playNotes();},
  guess:function(d){T.guess=d.v;finish();},
  quit:function(){stopAll();T=null;if(SET&&!SET.done)SET=null;render();},
  rangeGo:function(d){rangeGo(d.v);},
  rangeRedo:function(){stopAll();T=null;SET=null;R={};render();},
  preset:function(d){var a=d.v.split(',');S.range={lo:+a[0],hi:+a[1]};save();R=null;render();},
  wipe:function(){wipe=true;render();},
  wipeNo:function(){wipe=false;render();},
  wipeYes:function(){S={range:null,stage:1,pattern:'single',sets:[],days:{},est:[]};save();wipe=false;T=null;SET=null;R=null;W=null;render();}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]'); if(t){ stopAll(); W=null; if(T&&T.phase!=='result') {T=null; if(SET&&!SET.done&&!SET.n) SET=null;} if(R&&R.phase==='run') R=S.range?null:{}; tab=t.dataset.tab; wipe=false; render(); window.scrollTo(0,0); return; }
  var a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset);
});
render();
})();
</script>
