<title>ジブンラボ v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
/* 実験ノート：方眼の紙に、証拠は蛍光ペン、判定は段階スタンプ。左に工程のレール、右に作業面。中心に2つの記録 */
:root{
  --paper:#f5f7fa; --grid:#e3e8f0; --sheet:#ffffff; --ink:#1c2333; --muted:#5d6678;
  --rule:#d5dbe5; --accent:#2a54b8; --accent-soft:#e6ecfa; --mark:#fff0a0; --mark-ink:#5a4a00;
  --ok:#1f7a4d; --ok-soft:#e1f3e9; --warn:#a15c00; --warn-soft:#fbeedb; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-code:"M PLUS 1 Code","Hiragino Sans","Noto Sans Mono",ui-monospace,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:36px;
  --t-xs:12px;--t-s:14px;--t-m:16px;--t-l:19px;--t-xl:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --grid:#1b212b; --sheet:#181d26; --ink:#e7ebf2; --muted:#9aa4b5;
  --rule:#2c3441; --accent:#8fb0ff; --accent-soft:#1f2a44; --mark:#5a4d12; --mark-ink:#fff0b0;
  --ok:#6fd39f; --ok-soft:#173326; --warn:#f0b35c; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --grid:#1b212b; --sheet:#181d26; --ink:#e7ebf2; --muted:#9aa4b5;
  --rule:#2c3441; --accent:#8fb0ff; --accent-soft:#1f2a44; --mark:#5a4d12; --mark-ink:#fff0b0;
  --ok:#6fd39f; --ok-soft:#173326; --warn:#f0b35c; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:var(--t-m)/1.75 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) 64px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:var(--t-xl);font-weight:700;letter-spacing:.02em}
h2{font-size:var(--t-l);font-weight:700}
h3{font-size:var(--t-m);font-weight:700}
p{margin:0}
.code{font-family:var(--f-code);font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--s5)}
header.top{max-width:1040px;margin:0 auto var(--s4);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
header.top .lead{color:var(--muted);font-size:var(--t-s)}
.aware{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aware .dot{width:22px;height:22px;border-radius:6px;border:1px solid var(--rule);display:grid;place-items:center;font:600 11px var(--f-code);background:var(--sheet);color:var(--muted)}
.aware .dot.l2{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.aware .dot.l3{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail .grp{font:600 11px var(--f-code);letter-spacing:.1em;color:var(--muted);margin:var(--s3) 0 var(--s1) var(--s2)}
nav.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:var(--s2);padding:7px var(--s2);border-radius:8px;font-size:var(--t-s)}
nav.rail button:hover{background:var(--accent-soft)}
nav.rail button.on{background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);font-weight:700}
nav.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rail .n{font:600 11px var(--f-code);width:28px;color:var(--muted)}
nav.rail .st{margin-left:auto;font:600 11px var(--f-code);color:var(--ok)}
main{min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.sheet.flat{background:transparent;border:0;padding:0}
.why{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 8px 8px 0;font-size:var(--t-s)}
.why b{display:block;font:600 11px var(--f-code);letter-spacing:.1em;color:var(--accent);margin-bottom:2px}
.note{font-size:var(--t-s);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.btn{all:unset;cursor:pointer;padding:10px 18px;border-radius:9px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:var(--t-s);text-align:center}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit;font-size:var(--t-m)}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:4px;font-size:var(--t-s);font-weight:500}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--rule);font-size:var(--t-s);background:var(--sheet)}
.chip.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:700}
.lv{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--f-code);padding:2px 8px;border-radius:6px;border:1px solid var(--rule);white-space:nowrap}
.lv.l0,.lv.l1{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.lv.l2{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.lv.l3{color:var(--sheet);background:var(--ok);border-color:transparent}
.tag{font:600 11px var(--f-code);padding:1px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:var(--s3) var(--s4);white-space:pre-wrap}
.a{padding:var(--s2) var(--s4);border-left:3px solid var(--rule);white-space:pre-wrap;color:var(--ink)}
.judge{font-size:var(--t-s);display:flex;flex-direction:column;gap:6px;padding:var(--s3) var(--s4);border-radius:10px;background:var(--paper)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:var(--t-s)}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-code);color:var(--muted);background:var(--paper);letter-spacing:.04em;white-space:nowrap}
td input{min-width:120px;padding:6px 8px;font-size:var(--t-s)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s3)}
.card{border:1px solid var(--rule);border-radius:10px;padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:6px;background:var(--sheet);min-width:0}
.card.pick{cursor:pointer}.card.pick:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stmt{border:1px solid var(--rule);border-radius:10px;padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:8px}
.stmt .k{font:600 12px var(--f-code);color:var(--accent);letter-spacing:.06em}
.ev{font-size:var(--t-s)}
.ev li{margin:2px 0}
ul{margin:0;padding-left:1.2em}
.banner{padding:var(--s3) var(--s4);border-radius:10px;font-size:var(--t-s);background:var(--warn-soft);color:var(--warn)}
.ok-banner{padding:var(--s3) var(--s4);border-radius:10px;font-size:var(--t-s);background:var(--ok-soft);color:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.opt{border:1px solid var(--rule);border-radius:10px;padding:var(--s4);cursor:pointer;background:var(--sheet)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.rail{align-items:center}
  nav.rail .code{flex:0 0 auto;white-space:nowrap;margin:0 8px!important}
  nav.rail .code br{display:none}
  nav.rail .grp{display:none}
  nav.rail button{flex:0 0 auto;white-space:nowrap}
  nav.rail .st{margin-left:4px}
  .sheet{padding:var(--s4)}
  .split{grid-template-columns:minmax(0,1fr)}
}
</style>

<header class="top">
  <div>
    <div class="code">JIBUN LAB · v3</div>
    <h1>ジブンラボ</h1>
    <p class="lead">企業が何をどう見ているかを知り、自分についての仮説を、試しながら確かめていく就活の実験ノート。</p>
  </div>
  <div>
    <div class="code" style="margin-bottom:4px">自覚の6項目</div>
    <div class="aware" id="awareBar"></div>
  </div>
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="工程"></nav>
  <main id="main"></main>
</div>

<script>
/* ============ 基本 ============ */
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toLocaleDateString("ja-JP");

/* ============ 設計の中身（設計メモ 11章・12章） ============ */
const AWARE=[
  {k:1,name:"企業は見えないものを推し量っている"},
  {k:2,name:"何が証拠になるか"},
  {k:3,name:"企業が最終的に見たいもの"},
  {k:4,name:"設問・選考の手段ごとの意図"},
  {k:5,name:"深掘りの意味"},
  {k:6,name:"自分が会社に求めるもの"}
];
const AWARE_TEXT={
 1:"企業は学生の中身を直接見られません。ES・適性検査・グループ討議・面接・インターンという手段で、見えるものから推し量っています。",
 2:"誰でも言える言葉（「頑張りました」「主体性があります」）は区別の役に立ちません。信用されるのは、手間をかけた具体的な行動です。生成AIで文章が誰でも整えられる今は、文章のうまさも差になりません。",
 3:"日本の新卒採用では、多くの会社が入社後に育てる前提で採ります。そのため、今のスキルより「育てれば伸びるか」と「組織に合い、長く働けるか」を重く見ます。"
};
const LEVEL_NAME=["表面","言葉だけ","説明できる","使える"];
const AREAS=["学業・ゼミ","部活・サークル","アルバイト","インターン","趣味・その他"];
const PERIODS=["高校","大学1年","大学2年","大学3年","今"];
const CUES=[
  {k:"choose",t:"自分で決めた・やり方を変えたこと"},
  {k:"fail",t:"思ったとおりにいかなかったこと"},
  {k:"grow",t:"できるようになったこと・ならなかったこと"},
  {k:"same",t:"別の場所でも同じようなことをしていた"},
  {k:"long",t:"時間や手間をかけ続けたこと"}
];
const NOMEM="（覚えていなければ、「覚えていない」で大丈夫です）";
/* 深掘り（12.31の質問文。1問ずつ順に出す） */
const STEPS=[
 {id:"m0",ep:"main",title:"そのときを思い浮かべる",cand:null,
  qs:["その出来事は、いつ頃、どこでのことでしたか。","そのとき一緒にいたのは、誰でしたか。","写真やメッセージ、作ったものなど、そのときのことが分かるものは残っていますか。"+NOMEM],
  why:"細かいことは、そのときの場所・人・残っているものを思い浮かべ直すと出てきやすくなります。ここは判定しません。"},
 {id:"m1",ep:"main",title:"何をしたか",cand:1,gate:true,
  qs:["そのとき、あなたがしたことを、思い出せる順に書いてください。"],
  follow:{a:"それは、あなたがしたことですか。周りの人がしたことですか。",b:"実際には、どんなことをしたのですか。動きが分かるように教えてください。",c:"何人くらいの、どんな集まりの中でのことでしたか。",d:"それを、どのくらいの期間続けましたか。",e:"その結果、何がどう変わりましたか。数で分かることはありますか。"},
  goal:"主語があなたで、具体的な動きと状況が分かること（段階2）。手間と確かめられる結果まであれば段階3。",
  why:"企業は「頑張った」という言葉ではなく、具体的な行動を証拠として見ています。",
  rubric:"特徴:(a)主語が自分 (b)具体的な動き(「頑張った」でなく「毎週〜を〜した」) (c)状況が特定できる(いつ・どこで・誰と・規模) (d)手間が分かる(期間・量・困難) (e)確かめられる結果(数字・前後比較・第三者の反応)。段階0=抽象語だけ／1=行動はあるが状況か主語があいまい／2=(a)(b)(c)がそろう／3=さらに(d)(e)"},
 {id:"m2",ep:"main",title:"本人の選択か",cand:2,
  qs:["そのやり方に決める前に、ほかにどんなやり方が考えられましたか。","その中から、そのやり方を選んだ決め手は何でしたか。","そのとき、あなたが決めたことと、最初から決まっていたことは、それぞれ何でしたか。"],
  goal:"ほかの選択肢と、選んだ決め手があること（段階2）。環境が決めた部分と自分が決めた部分を分けられれば段階3。",
  why:"企業は、それがあなたの選択だったのか、環境や指示のおかげだったのかを見ています。面接の「環境のおかげでは？」という深掘りに耐えるための材料です。",
  rubric:"特徴:(a)他の選択肢があったことが分かる (b)選んだ決め手が言える (c)自発か指示かが分かる (d)環境が決めた部分と自分が決めた部分を分けて語れる。段階0=役割として語るだけ／1=自分で決めたと言うが他の選択肢が見えない／2=他の選択肢と決め手がある／3=さらに環境が決めた部分と分けている"},
 {id:"m3",ep:"main",title:"思ったとおりにいかなかったこと",cand:4,
  qs:["その中で、思ったとおりにいかなかったことは何でしたか。","そうなった原因は、何だったと思いますか。","そのあと、何を変えましたか。変えてどうなりましたか。","うまくいかなかったとき、気持ちはどうでしたか。どうやって持ち直しましたか。"],
  goal:"原因を、自分で変えられる部分（やり方・判断・準備）に置けていること（段階2）。次に変えた行動と結果まであれば段階3。",
  why:"企業は、失敗の原因をどこに置くかで、次に伸びる人かを見ています。持ち直し方は、ストレス耐性の手がかりになります。",
  rubric:"特徴:(a)失敗が具体的 (b)原因が内的かつ変えられるもの (c)外的要因も認めたうえで自分の部分を切り出している (d)次に何を変え、どうなったか (e)気持ちの持ち直し方。段階0=失敗を語らないか外的な原因だけ／1=内的だが変えられない原因(性格など)／2=内的で変えられる原因／3=さらに次に変えた行動と結果"},
 {id:"m4",ep:"main",title:"伸びた環境と伸び方",cand:7,
  qs:["そのとき力を出せたのは、周りにどんな条件があったからだと思いますか。（任される範囲、反応が返ってくる早さ、一緒にいた人、など）","その経験の前と後で、できるようになったことは何ですか。どうやってできるようになりましたか。","反対に、力が出なかった場面を思い出せますか。そのときと比べて、何が違いましたか。"+NOMEM],
  goal:"具体的な環境の条件と、伸び方の過程が言えること（段階2）。伸びなかった場面と比べて条件を絞れれば段階3。",
  why:"企業は、あなたがどんな環境でどう伸びるかを知り、自社でも同じことが起きるかを見ています。日本の新卒採用では特に重く見られます。",
  rubric:"特徴:(a)力を発揮した環境の要素を具体的に挙げられる (b)伸び方の過程が言える (c)伸びなかった環境と比べて条件を絞り込めている。段階0=環境に触れない／1=「人に恵まれた」など一般的な言葉／2=具体的な環境の要素と伸び方の過程がある／3=さらに伸びなかった環境との比較で条件を絞れている"},
 {id:"m5",ep:"main",title:"大事にしていること",cand:3,
  qs:["さっき話してくれた決め手は、あなたにとって、どんな点で大事でしたか。","それが大事だと思うようになったのは、いつ頃の、どんな経験からですか。"],
  goal:"その人らしい価値観まで届くこと（段階2）。その価値観ができた経験まであれば段階3。",
  why:"価値観は、事実を聞き終えてから聞きます。先に価値観を言うと、その後の話がそれに合うように整えられてしまうからです。",
  rubric:"特徴:(a)理由が行動の言い換えでない (b)「どんな点で大事か」を2段以上上れる (c)行き着いた価値観にその人らしい具体性がある(誰でも言える言葉で終わらない) (d)その価値観ができた経験が言える。段階0=理由がないか言い換え／1=1段の理由／2=その人らしい価値観まで届く／3=さらに由来の経験がある"},
 {id:"s0",ep:"sub",title:"2つ目：そのときを思い浮かべる",cand:null,
  qs:["2つ目の出来事は、いつ頃、どこでのことでしたか。","そのとき一緒にいたのは、誰でしたか。"],
  why:"1つ目と同じく、思い出す土台です。ここは判定しません。"},
 {id:"s1",ep:"sub",title:"2つ目：何をしたか",cand:1,
  qs:["2つ目の出来事で、あなたがしたことを、思い出せる順に書いてください。"],
  follow:{a:"それは、あなたがしたことですか。周りの人がしたことですか。",b:"実際には、どんなことをしたのですか。",c:"何人くらいの、どんな集まりの中でのことでしたか。",d:"どのくらいの期間続けましたか。",e:"その結果、何がどう変わりましたか。"},
  goal:"主語・具体的な動き・状況がそろうこと（段階2）。",
  why:"2つ目は、場面が違っても同じ動き方が出るかを確かめる材料です。",
  rubric:"特徴:(a)主語が自分 (b)具体的な動き (c)状況が特定できる (d)手間 (e)確かめられる結果。段階0=抽象語だけ／1=行動はあるが状況か主語があいまい／2=(a)(b)(c)がそろう／3=さらに(d)(e)"},
 {id:"p1",ep:"both",title:"2つに共通する動き方",cand:5,

  <tr><td>グループ討議</td><td>集団の中での実際のふるまい</td><td>発言の量が多い人が高く見られやすい</td></tr>
  <tr><td>面接</td><td>話の中身と、その場の受け答え</td><td>最初の数分の印象で判断が決まり、その後はその印象を確かめる質問をしがち。型が決まっていない面接ほど印象の比重が上がる</td></tr>
  <tr><td>インターン</td><td>実際に近い仕事の場での行動</td><td>見る人や配属先による違い。2025年卒から、一定の型のインターンで得た情報は選考に使えるようになった</td></tr>
  </tbody></table></div>
  <h3>選考の形の3つの成り立ち</h3>
  <ul><li><b>本当に見たいものを見る手段</b>（型の決まった面接、インターンでの観察）→ 中身で備える</li>
  <li><b>大勢を安く絞る手段</b>（ES、適性検査、学歴）→ 短い時間で伝わる形で備える</li>
  <li><b>他社のまねや慣習で残っている形</b>（どこも同じ設問、雑談的な面接）→ 使い回せる材料で備える</li></ul>
  <h3>変えられないことと、変えられること</h3>
  <p>学歴による判断、面接官ごとのぶれ、結果の運は、あなたには変えられません。変えられるのは、事実の具体性、伝え方、確かめた企業の情報、これからつくる経験です。このアプリは、変えられることに集中します。</p>
  <div class="row"><button class="btn line" data-act="guideRead">読んだ</button></div>
</section>`;
ACT.guideRead=()=>{setAware(1,1);setAware(4,1);note("記録しました。設問ごとの意図は、ESを組み立てるときに予想しながら確かめます。");render()};

/* ---------- 過去を掘り起こす ---------- */
V.recall=()=>`<section class="sheet"><div class="code">過去を掘り起こす · 時期 × 領域</div>
  <h2>何をしていたかを、短い言葉で埋めてください</h2>
  <p class="note">役割や活動を一言ずつ（例：「集客担当」「塾講師」）。空欄があっても大丈夫です。</p>
  <div class="tablewrap"><table><thead><tr><th>時期</th>${AREAS.map(a=>`<th>${esc(a)}</th>`).join("")}</tr></thead><tbody>
  ${PERIODS.map(p=>`<tr><th>${esc(p)}</th>${AREAS.map(a=>{const k=p+"|"+a;return `<td><input type="text" id="g-${esc(k)}" data-bind="grid.${k}" value="${esc(S.grid[k]||"")}"></td>`}).join("")}</tr>`).join("")}
  </tbody></table></div>
  ${why("なぜ表から始めるのか","記憶は「時期 → その時期の活動 → 具体的な1場面」の順に整理されています。上から順にたどると、成功体験だけに偏らず、具体的な場面にたどり着きやすくなります。")}
</section>
<section class="sheet"><div class="code">出来事の候補</div>
  <h2>表を見ながら、次に当てはまる出来事を挙げてください</h2>
  <div class="row">${CUES.map(c=>`<span class="tag">${esc(c.t)}</span>`).join("")}</div>
  ${candForm()}
  ${candList()}
</section>
<section class="sheet"><div class="code">深掘りする2つを選ぶ</div>
  ${pickHtml()}
</section>`;
function candForm(){return `<div class="split">
  <label class="f">出来事（一言で）<input type="text" id="c-title"></label>
  <label class="f">当てはまる問い<select id="c-cue">${CUES.map(c=>`<option value="${c.k}">${esc(c.t)}</option>`).join("")}</select></label>
  <label class="f">時期<select id="c-period">${PERIODS.map(p=>`<option>${esc(p)}</option>`).join("")}</select></label>
  <label class="f">領域<select id="c-area">${AREAS.map(a=>`<option>${esc(a)}</option>`).join("")}</select></label></div>
  <div class="row"><label class="chip"><input type="checkbox" id="c-group" style="margin-right:6px">他の人と一緒に取り組んだ</label><button class="btn" data-act="addCand">候補に加える</button></div>`}
function candList(){return S.cands.length?`<div class="cards">${S.cands.map(c=>`<div class="card"><b>${esc(c.title)}</b><div class="row">${tags(c)}</div><div class="row"><button class="btn line" data-act="delCand" data-id="${c.id}">消す</button></div></div>`).join("")}</div>`:'<p class="note">2つ以上あると、深掘りする出来事を選べます。</p>'}
function pickHtml(){
  const m=ep(S.main),sb=ep(S.sub);let w="";
  if(m&&sb&&m.area===sb.area)w+=`<div class="banner">2つが同じ領域です。違う領域にすると、場面が違っても同じ動き方が出るかを確かめられます。</div>`;
  if(m&&sb&&!m.group&&!sb.group)w+=`<div class="banner">どちらも1人で取り組んだ出来事です。2つ目を他の人と一緒の場面にすると、チームで取り組んだ経験の材料が出てきます。</div>`;
  return `${why("1つ目の選び方","「一番すごい成果」では選びません。信用されるのは、成果の大きさより、あなたが選んだことと、かけた手間です。自分で選べる余地が大きかった／思ったとおりにいかないことがあった／時間や手間がかかった／細かく思い出せる、に多く当てはまるものが向いています。")}
  <div class="cards">${S.cands.map(c=>`<div class="card pick ${S.main===c.id?"sel":""}" data-act="setMain" data-id="${c.id}"><span class="code">1つ目にする</span><b>${esc(c.title)}</b><div class="row">${tags(c)}</div></div>`).join("")}</div>
  <p class="note">2つ目は、1つ目と同じことをした出来事を探して選ばないでください。合うものばかり探すと、判定が甘くなります。比べるのは選んだ後です。</p>
  <div class="cards">${S.cands.filter(c=>c.id!==S.main).map(c=>`<div class="card pick ${S.sub===c.id?"sel":""}" data-act="setSub" data-id="${c.id}"><span class="code">2つ目にする</span><b>${esc(c.title)}</b><div class="row">${tags(c)}</div></div>`).join("")}</div>
  ${w}<div class="row"><button class="btn" data-go="deep" ${m&&sb?"":"disabled"}>深掘りへ</button></div>`}
ACT.addCand=()=>{const t=$("#c-title").value.trim();if(!t)return;S.cands.push({id:uid(),title:t,cue:$("#c-cue").value,period:$("#c-period").value,area:$("#c-area").value,group:$("#c-group").checked,src:"past"});render()};
ACT.delCand=a=>{S.cands=S.cands.filter(c=>c.id!==a.dataset.id);if(S.main===a.dataset.id)S.main=null;if(S.sub===a.dataset.id)S.sub=null;render()};
ACT.setMain=a=>{S.main=a.dataset.id;if(S.sub===S.main)S.sub=null;render()};
ACT.setSub=a=>{S.sub=a.dataset.id;render()};

/* ---------- 深掘り ---------- */
function curStep(){return STEPS.find(s=>!(S.deep[s.id]&&S.deep[s.id].done))||null}
function dget(id){return S.deep[id]||(S.deep[id]={msgs:[],qi:0,level:null,tries:0,done:false,next:null,j:null})}
V.deep=()=>{
  if(!S.main||!S.sub)return `<section class="sheet"><h2>先に、深掘りする出来事を2つ選んでください</h2><div class="row"><button class="btn" data-go="recall">過去を掘り起こす</button></div></section>`;
  const cur=curStep();
  const list=STEPS.map(s=>{const d=S.deep[s.id];return `<div class="row" style="justify-content:space-between;${cur&&cur.id===s.id?"font-weight:700":""}"><span>${esc(s.title)}</span>${s.rubric?(d&&d.level!=null?lv(d.level):'<span class="lv">未</span>'):(d&&d.done?'<span class="lv l2">済</span>':'<span class="lv">未</span>')}</div>`}).join("");
  let body;
  if(!cur)body=`<div class="ok-banner">深掘りがひととおり終わりました。次は、これを「今の自分についての仮説」にまとめます。</div><div class="row"><button class="btn" data-go="self">自分の記録へ</button></div>`;
  else{
    const d=dget(cur.id);const epx=cur.ep==="main"?ep(S.main):cur.ep==="sub"?ep(S.sub):null;
    const q=d.next||cur.qs[Math.min(d.qi,cur.qs.length-1)];
    body=`<div class="code">${epx?esc(epx.title):"2つの出来事"}</div><h2>${esc(cur.title)}</h2>
      ${d.msgs.map(m=>`<div class="q">${esc(m.q)}</div><div class="a">${esc(m.a)}</div>`).join("")}
      ${d.j?feedback(cur.goal,d.j,d.next):""}
      ${d.showWhy?why("この質問で企業が見ていること",cur.why):""}
      ${d.gateStop?`<div class="banner">何度か補っても、具体的な行動がはっきりしませんでした。この出来事の記憶が薄いのかもしれません。同じ質問を重ねると、なかった細部を作ってしまうおそれがあるので、別の出来事に切り替えることをすすめます。</div>
        <div class="row"><button class="btn" data-act="switchEp">別の出来事に切り替える</button><button class="btn line" data-act="forceNext">このまま進む</button></div>`
      :`<div class="q">${esc(q)}</div><textarea id="deep-ans"></textarea>
        <div class="row"><button class="btn" data-act="deepSend">答える</button>${busy?'<span class="spin"></span> 判定中…':""}
        ${d.j&&cur.rubric&&!cur.gate?'<button class="btn line" data-act="forceNext">次の項目へ</button>':""}</div>
        ${!AI&&cur.rubric&&d.qi>=cur.qs.length&&d.level==null?selfJudge(cur):""}`}`;
  }
  return `<section class="sheet">${body}</section><section class="sheet"><div class="code">進み具合</div><p class="note">1つ目：${esc((ep(S.main)||{}).title||"")}／2つ目：${esc((ep(S.sub)||{}).title||"")}</p>${list}
    <p class="note">事実を先に、理由や価値観は後で聞きます。答えた後に、その質問で企業が見ていることを表示します。</p></section>`;
};
function selfJudge(cur){return `<div class="judge"><b>自分で判定してください（AI未接続）</b><div class="note">${esc(cur.rubric)}</div><div class="row">${[0,1,2,3].map(n=>`<button class="chip" data-act="selfLv" data-n="${n}">段階${n}</button>`).join("")}</div></div>`}
ACT.selfLv=a=>{const cur=curStep();const d=dget(cur.id);const n=+a.dataset.n;d.level=n;d.j={level:n,evidence:[]};d.showWhy=true;if(n>=2)d.done=true;else{d.tries++;d.next=cur.follow?Object.values(cur.follow)[d.tries%5]:"判定の基準を見て、足りない事実を1つ足してください。";if(cur.gate&&d.tries>=3)d.gateStop=true}render()};
ACT.deepSend=async()=>{
  const cur=curStep();if(!cur||busy)return;const ans=$("#deep-ans").value.trim();if(!ans)return;
  const d=dget(cur.id);const q=d.next||cur.qs[Math.min(d.qi,cur.qs.length-1)];d.msgs.push({q,a:ans});
  if(!d.next)d.qi++;d.next=null;
  if(d.qi<cur.qs.length&&!d.j){render();return}
  if(!cur.rubric){d.done=true;d.showWhy=true;render();return}
  if(!AI){render();return}
  busy=true;render();
  try{
    const epx=cur.ep==="main"?ep(S.main):cur.ep==="sub"?ep(S.sub):null;
    const r=await aiJSON(`深掘りの項目「${cur.title}」の回答の段階を判定する。
判定基準: ${cur.rubric}
出来事: ${epx?epx.title:"2つの出来事"}
${cur.ep==="both"?"これまでの深掘りの記録:\n"+deepText()+"\n":""}この項目のやりとり:
${d.msgs.map(m=>`問:${m.q}\n答:${m.a}`).join("\n")}
ルール: 書かれていない特徴は満たしていないとみなす。段階を上げる根拠は回答の短い引用で示す。missingは、まだ見えない特徴の記号(a〜e)を重要な順に。followupは、まだ見えない特徴を1つだけ、過去の事実を聞く形で、やさしい言葉で50字以内。「なぜ」を使わない。答えの例を含めない。
JSON:{"level":0,"evidence":["引用"],"missing":["a"],"followup":""}`);
    const level=Math.max(0,Math.min(3,r.level|0));
    d.level=level;d.j={level,evidence:r.evidence||[]};d.showWhy=true;d.tries++;
    if(level>=2){d.done=true;d.next=null}
    else{const k=(r.missing||[])[0];d.next=(cur.follow&&cur.follow[k])||r.followup||"もう少し具体的に、そのとき実際にしたことを教えてください。";if(cur.gate&&d.tries>=3)d.gateStop=true}
    if(level>=2&&cur.id==="p1")setAware(5,1);
  }catch(e){d.msgs.pop();note(aiErr(e))}
  busy=false;render();
};
ACT.forceNext=()=>{const cur=curStep();if(!cur)return;const d=dget(cur.id);d.done=true;d.gateStop=false;render()};
ACT.switchEp=()=>{["m0","m1","m2","m3","m4","m5"].forEach(k=>delete S.deep[k]);S.main=null;S.view="recall";render()};

/* ---------- 日々の記録 ---------- */
V.log=()=>`<section class="sheet"><div class="code">日々の記録 · 1分</div>
  <h2>今日のことを、3つだけ</h2>
  <p class="note">時間がたつと、細かいことは消えていきます。その日のうちに短く残しておくと、あとで深掘りやESの材料になります。記録するタイミングは、あなたが決めてください。</p>
  <label class="f">いつ記録しますか（例：インターン帰りの電車で）<input type="text" id="log-when" data-bind="logWhen" value="${esc(S.logWhen||"")}"></label>
  <label class="f">今日やったことを1つ<input type="text" id="log-did"></label>
  <label class="f">誰と一緒でしたか<input type="text" id="log-who"></label>
  <label class="f">思ったとおりにいったこと、いかなかったこと（どちらか1つ）<input type="text" id="log-how"></label>
  <div class="row"><button class="btn" data-act="logAdd">記録する</button></div>
</section>
${S.logs.length?`<section class="sheet"><h3>これまでの記録</h3><div class="tablewrap"><table><thead><tr><th>日付</th><th>やったこと</th><th>誰と</th><th>いった・いかなかった</th><th></th></tr></thead><tbody>
${S.logs.map(l=>`<tr><td class="code">${esc(l.date)}</td><td>${esc(l.did)}</td><td>${esc(l.who)}</td><td>${esc(l.how)}</td><td>${l.used?'<span class="tag">候補にした</span>':`<button class="btn line" data-act="logToCand" data-id="${l.id}">出来事の候補にする</button>`}</td></tr>`).join("")}
</tbody></table></div></section>`:""}`;
ACT.logAdd=()=>{const did=$("#log-did").value.trim();if(!did)return;S.logs.unshift({id:uid(),date:today(),did,who:$("#log-who").value.trim(),how:$("#log-how").value.trim(),used:false});note("記録しました。");render()};
ACT.logToCand=a=>{const l=S.logs.find(x=>x.id===a.dataset.id);l.used=true;S.cands.push({id:uid(),title:l.did,cue:"long",period:"今",area:"インターン",group:!!l.who,src:"log"});note("出来事の候補に加えました。この記録が、深掘りの材料になります。");render()};

/* ---------- 他人の見方 ---------- */
V.others=()=>{
  const req=reqText();
  return `<section class="sheet"><div class="code">他人の見方</div>
  <h2>あなたを実際の場面で見ていた人に、具体的な場面を聞く</h2>
  ${why("なぜ他人に聞くのか","企業は、あなたの外から、あなたを推し量る「他人」です。評価が絡む特性（考える力、人前でのふるまい）は、本人より他人のほうが正確に見えることがあります。他人の見方を集めることは、企業からの見え方を前もって確かめることに近いと言えます。ただし、不安のような内面は本人のほうが正確です。他人の見方は正解ではなく、事実で確かめる材料として扱います。")}
  <p class="note">立場や場面がばらけるように2〜3人（例：インターンの上司、サークルの仲間、アルバイト先の人）。</p>
  <label class="f">どの場面のあなたについて聞きますか<input type="text" id="o-ctx" data-bind="oCtx" value="${esc(S.oCtx||"")}" placeholder="例：サークルの運営"></label>
  <div class="q" id="o-req">${esc(req)}</div>
  <div class="row"><button class="btn sub" data-act="copyReq">文面をコピー</button></div>
  </section>
  <section class="sheet"><h3>返ってきた答えを、言い換えずに貼る</h3>
  <div class="split"><label class="f">誰から（関係だけ）<input type="text" id="o-who" placeholder="例：インターンの上司"></label><label class="f">どの場面について<input type="text" id="o-c2" value="${esc(S.oCtx||"")}"></label></div>
  <textarea id="o-text"></textarea>
  <div class="row"><button class="btn" data-act="otherAdd">自分の記録と突き合わせる</button>${spin()}</div>
  </section>
  ${S.others.map(o=>`<section class="sheet"><div class="row"><b>${esc(o.who)}</b><span class="tag">${esc(o.ctx)}</span><span class="note">${esc(o.date)}</span></div><div class="a">${esc(o.text)}</div>
    ${o.an?`<div class="judge"><b>一致</b>${(o.an.match||[]).map(x=>`<div>#${x.n} ${esc((S.claims[x.n-1]||{}).claim||"")}　<mark>${esc(x.quote)}</mark></div>`).join("")||'<span class="note">なし</span>'}
      <b>ずれ</b>${(o.an.diff||[]).map(x=>`<div>#${x.n} ${esc(x.note)}　<mark>${esc(x.quote)}</mark></div>`).join("")||'<span class="note">なし</span>'}
      <b>新しい発見（盲点の候補）</b>${(o.an.fresh||[]).map(x=>`<div>${esc(x)}</div>`).join("")||'<span class="note">なし</span>'}
      <span class="note">一致した仮説は「他人も確認」になりました。ずれと新しい発見は、正解ではなく、深掘りで確かめる問いとして扱ってください。</span></div>`:""}</section>`).join("")}`;
};
function reqText(){const c=S.oCtx||"〇〇";return `自分のことを見直していて、${c}のときの私について、気をつかわずに教えてほしいです。
① そのとき、私がどう動いていたか、具体的な場面を1つ
② 私が力を出していたと思う場面と、苦戦していたと思う場面を1つずつ
③ 私が自分で気づいていなさそうなことがあれば
短くて大丈夫です。`}
ACT.copyReq=async()=>{try{await navigator.clipboard.writeText(reqText());note("コピーしました。LINEなどで送ってください。")}catch(e){const el=$("#o-req");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);note("文面を選択しました。コピーして送ってください。")}render()};
ACT.otherAdd=async()=>{
  const text=$("#o-text").value.trim();if(!text)return;
  const o={id:uid(),who:$("#o-who").value.trim()||"（未記入）",ctx:$("#o-c2").value.trim(),text,date:today(),an:null};S.others.unshift(o);
  if(!AI||!S.claims.length){if(!S.claims.length)note("自分の記録がまだないので、突き合わせはあとでできます。");render();return}
  busy=true;render();
  try{const r=await aiJSON(`本人の仮説と、他人から見た本人についての答えを突き合わせる。
本人の仮説:\n${claimsText()}
他人(${o.who}、場面:${o.ctx})の答え:\n${text}
ルール: match=他人の答えの具体的な事実が、その仮説を支えているもの。diff=仮説と食い違うもの（どちらが正しいかは決めない）。fresh=仮説にない動き方。引用は他人の答えから短く。
JSON:{"match":[{"n":1,"quote":""}],"diff":[{"n":1,"quote":"","note":"どう食い違うか"}],"fresh":["仮説にない動き方を短く"]}`);
    o.an={match:r.match||[],diff:r.diff||[],fresh:r.fresh||[]};
    (o.an.match||[]).forEach(x=>{const c=S.claims[x.n-1];if(c&&c.cert<2){c.cert=2;hist(`「${c.claim.slice(0,30)}」が他人の見方でも確かめられた`,`${o.who}の答え`)}});
    (o.an.diff||[]).forEach(x=>S.gaps.push(`他人の見方とのずれ（#${x.n}）：${x.note}`));
  }catch(e){note(aiErr(e))}
  busy=false;render();
};

/* ---------- 自分の記録 ---------- */
V.self=()=>`<section class="sheet"><div class="code">自分の記録</div>
  <h2>今の自分についての仮説</h2>
  <p class="note">形容詞（「主体性がある」）ではなく、場面つきで書きます。どの仮説にも、支える事実をひもづけます。どれも今の仮説なので、試しながら直していきます。</p>

function claimHtml(c,i){

  return `<div class="stmt"><div class="row" style="justify-content:space-between"><span class="k">#${i+1}</span><span class="tag">${esc(CERT[c.cert]||"")}</span></div>

  ${(c.data||[]).length?`<div class="ev"><span class="note">支える事実：</span>${c.data.map(x=>`<mark>${esc(x)}</mark>`).join(" ")}</div>`:""}
  ${c.warrant?`<div class="ev note">なぜ支えになるか：${esc(c.warrant)}</div>`:""}
  <label class="f">次にどう試すか<input type="text" id="cl-next-${i}" data-bind="claims.${i}.next" value="${esc(c.next||"")}"></label>
  <div class="row"><span class="note">どこまで確かめられたか（先に自分で）：</span>${CERT.map((t,j)=>`<button class="chip ${c.selfCert===j?"on":""}" data-act="selfCert" data-i="${i}" data-j="${j}">${esc(t)}</button>`).join("")}</div>
  ${c.selfCert!=null&&c.aiCert!=null?`<div class="note">AIの見立て：<b>${esc(CERT[c.aiCert])}</b>${c.selfCert!==c.aiCert?"。あなたの見立てとずれています。支える事実の数と場面を見直してみてください。":"。一致しました。"}</div>`:""}
  <label class="chip"><input type="checkbox" id="cl-use-${i}" data-bind="claims.${i}.use" ${c.use?"checked":""} style="margin-right:6px">選考で使う</label>
  ${need}
  <div class="row"><button class="btn line" data-act="claimDel" data-i="${i}">消す</button></div></div>`}
ACT.selfCert=a=>{S.claims[+a.dataset.i].selfCert=+a.dataset.j;render()};

ACT.selfDraft=async()=>{
  if(!AI){note(aiErr(new Error("noai")));render();return}
  busy=true;render();
  try{const r=await aiJSON(`深掘りの記録から、本人についての仮説を4つの型で作る。
A 行動のパターン:「私は（どんな場面）では、（どう動く）」。形容詞は使わない。データは2つ以上の出来事から。
B 大事にしていること:「私は（何）を大事にしている。そう思うようになったのは（経験）から」
C 伸びる条件と伸び方:「私は（どんな環境）で、（どういうやり方で）伸びる」
D つまずき方と立て直し方:「私は（どんなとき）につまずきやすく、（どうやって）立て直してきた」
ルール: 各型1〜2つまで。どの仮説にも記録からの短い引用をデータとして付ける。データがなければ作らない。本人の言い回しを残す。certは 0=1つの場面だけ 1=2つの場面で確認。next=その仮説を次の経験でどう試せるか（具体的に1文）。価値観と行動の食い違いはgapsへ。
1つ目: ${(ep(S.main)||{}).title}　2つ目: ${(ep(S.sub)||{}).title}
${deepText()}
JSON:{"claims":[{"type":"A","claim":"","data":["引用"],"warrant":"","cert":0,"next":""}],"gaps":[""]}`,"complex");
    const old=S.claims.length;
    S.claims=(r.claims||[]).slice(0,8).map(c=>({id:uid(),type:["A","B","C","D"].includes(c.type)?c.type:"A",claim:c.claim||"",data:c.data||[],warrant:c.warrant||"",cert:c.cert===1?1:0,aiCert:c.cert===1?1:0,selfCert:null,next:c.next||"",use:false,probes:{}}));
    S.gaps=r.gaps||[];hist(old?"自分の記録の下書きを作り直した":"自分の記録の下書きを作った","深掘り");
  }catch(e){note(aiErr(e))}
  busy=false;render();
};

};

  const items=["最初の一文が設問への答えになっている","【必】の部分がすべて入っている","やさしい言葉と短い文で書かれている（難しい言葉はかえって評価を下げる）","形容詞だけの主張がなく、事実が添えられている","書いた事実を、面接で自分の口で30秒説明できる","深掘りされたいところ（面接で話せる具体的な事実）が入口として置かれている","自分の記録や他の書類（他社のES、性格検査の答え）と食い違っていない"].concat(q.needsCo?["会社名を別の会社に入れ替えても成り立つ文になっていない"]:[]);
  if(!AI){st.checks=items.map(i=>({item:i,ok:false,comment:"自分で確かめてください"}));render();return}

本人の仮説:\n${claimsText()}\n答え:\n${st.draft}
ルール: 「30秒説明できるか」は、答えの中の事実が仮説の事実に裏づけられているかで判断する。commentは、OKでない項目について、直す場所を答えから引用し、次の一手を1文で。
JSON:{"checks":[{"item":"","ok":true,"comment":""}]}`);st.checks=r.checks||[]}catch(e){note(aiErr(e))}
  busy=false;render()};

ACT.ivNew=async()=>{
  const ps=S.pset,per=PERSONAS.find(p=>p.k===ps.persona)||PERSONAS[0];
  if(ps.mode==="first"){S.pcur={type:null,q:["では、自己紹介をお願いします。1分くらいで。","学生時代に力を入れたことを、簡単に教えてください。","当社を志望する理由を教えてください。"][Math.floor(Math.random()*3)]};render();return}
  const c=S.claims.find(x=>x.id===ps.claim);if(!c){note("練習する仮説を選んでください。");render();return}
  const recent=S.practice.filter(p=>p.claimId===c.id).slice(0,3).map(p=>p.type);
  const pool=PROBES.filter(p=>((c.probes||{})[p.k]??-1)<2&&!recent.includes(p.k));const pr=(pool.length?pool:PROBES)[Math.floor(Math.random()*(pool.length||PROBES.length))];
  const last=S.practice.find(p=>p.claimId===c.id&&p.eval);
  if(!AI){S.pcur={type:pr.k,q:pr.ex,claimId:c.id};render();return}
  busy=true;render();
  try{const r=await aiJSON(`あなたは「${per.t}」（${per.d}）です。就活生の次の主張に対して、「${pr.t}」の種類の深掘り質問を1つ、面接官の口調で50字以内で作る（例：${pr.ex}）。
${last?`直前の答えから持った印象が${last.eval.level>=2?"良い":"弱い"}ので、${last.eval.level>=2?"その印象を裏づける":"弱点を確かめる"}方向で聞く。`:""}
主張:${c.claim}\n支える事実:${(c.data||[]).join(" / ")}
JSON:{"question":""}`,"quick");S.pcur={type:pr.k,q:r.question||pr.ex,claimId:c.id}}catch(e){note(aiErr(e))}

ACT.ivAns=async()=>{
  const cur=S.pcur,ps=S.pset;const a=$("#iv-ans").value.trim();if(!a)return;
  const rec={mode:ps.mode,persona:ps.persona,claimId:cur.claimId||null,type:cur.type,q:cur.q,a,date:today(),eval:null};
  S.practice.unshift(rec);
  S.pcur=cur.queue&&cur.queue.length?{type:"data",q:cur.queue[0],queue:cur.queue.slice(1)}:null;
  if(AI){busy=true;render();
    const pr=PROBES.find(x=>x.k===cur.type);const c=S.claims.find(x=>x.id===cur.claimId);
    try{const r=await aiJSON(`面接の答えを評価する。
${pr?`質問の種類:${pr.t}（崩れないために必要な材料:${pr.need}）`:"最初の数分の質問"}
${c?"本人の主張:"+c.claim+"\n支える事実:"+(c.data||[]).join(" / "):"本人の仮説:\n"+claimsText()}
質問:${cur.q}\n答え:${a}
中身の段階0〜3（0=抽象語だけ／1=事実はあるが質問の突いた点に答えられていない／2=質問の突いた点に具体的な事実で答えている／3=さらに限界や例外も自分から示している）。伝え方: answerFirst=最初の一文が問いへの答え, onPoint=聞かれたことに答えている, linked=主張と根拠のつながりを言葉で示している, concise=長すぎない。evidenceは答えからの引用。nextは次の一手を1文（人柄を評価しない）。
JSON:{"level":0,"evidence":[""],"delivery":{"answerFirst":true,"onPoint":true,"linked":true,"concise":true},"next":""}`);
      rec.eval={level:Math.max(0,Math.min(3,r.level|0)),evidence:r.evidence||[],delivery:r.delivery||{},next:r.next||""};
      if(c&&pr){c.probes=c.probes||{};c.probes[pr.k]=Math.max(c.probes[pr.k]??-1,rec.eval.level);if(probeOk(c))hist(`「${c.claim.slice(0,30)}」が6種類の深掘りで崩れなくなった（目標線に到達）`,"面接の練習")}
      if(rec.eval.level>=2)setAware(5,2);
    }catch(e){rec.eval={level:null,evidence:[],delivery:{},next:aiErr(e)}}
    busy=false}
  render();
};

function gaps(){
  const g=[];
  STEPS.filter(s=>s.rubric).forEach(s=>{const d=S.deep[s.id];if(d&&d.done&&d.level!=null&&d.level<2)g.push({src:"深掘り",what:`「${s.title}」が段階${d.level}のまま`})});
  const m=ep(S.main),sb=ep(S.sub);if(m&&sb&&!m.group&&!sb.group)g.push({src:"ES",what:"他の人と一緒に取り組んだ出来事がない（チームで取り組んだ経験の材料）"});
  if(S.claims.length&&!S.claims.some(c=>c.type==="A"&&c.cert>=1))g.push({src:"自分の記録",what:"2つ以上の場面で確かめられた行動のパターンがない"});
  S.claims.filter(c=>c.use&&!probeOk(c)).forEach(c=>{const weak=PROBES.filter(p=>((c.probes||{})[p.k]??-1)<2).map(p=>p.t);g.push({src:"面接",what:`「${c.claim.slice(0,30)}」が、まだ崩れる深掘り：${weak.join("・")}`})});
  S.companies.forEach(c=>(c.qs||[]).filter(x=>x.status==="合わない"&&x.fit===FITS[2]).forEach(x=>g.push({src:"企業",what:`${c.name}：仕事で求められることと合わない（${x.q}）`})));
  AWARE.filter(a=>S.aware[a.k].level<2).forEach(a=>g.push({src:"自覚",what:`「${a.name}」が段階${S.aware[a.k].level}`}));
  return g;
}

  <section class="sheet"><h3>2. 本当にないなら、育てる</h3>
  <div class="split"><div class="card"><b>道1：経験をつくる</b><p class="note">これからのインターンやアルバイトで、自分で選べる余地があり、困難や手間があり、人と関わる役割を選びます。経験したら日々の記録に残し、深掘りに戻ります。経験を作ったり盛ったりして語ることはすすめません。</p></div>
  <div class="card"><b>道2：力を鍛える</b><p class="note">論理的に話す力や伝える力は、その場の受け答えに出ます。思考トレで、少し上の課題に、すぐ評価を受けながら繰り返し取り組みます。</p><div class="row"><button class="btn line" data-go="train">思考トレへ</button></div></div></div>
  <label class="f">今の状況（例：長期インターン中、週3でカフェのアルバイト）<input type="text" id="grow-ctx" data-bind="growCtx" value="${esc(S.growCtx)}"></label>
  <div class="row"><button class="btn" data-act="growPlan" ${g.length?"":"disabled"}>次の一手を考えてもらう</button>${spin()}</div>
  ${S.grow?`<div class="tablewrap"><table><thead><tr><th>穴</th><th>道</th><th>いつ・どこで・何をするか</th></tr></thead><tbody>${S.grow.map(x=>`<tr><td>${esc(x.gap)}</td><td><span class="tag">${esc(x.path)}</span></td><td>${esc(x.action)}</td></tr>`).join("")}</tbody></table></div>`:""}
  </section>`};
ACT.growPlan=async()=>{const g=gaps();
  if(!AI){S.grow=g.map(x=>({gap:x.what,path:x.src==="面接"||x.src==="自覚"?"力":"経験",action:"今の活動の中で、いつ・どこで・何をするかを自分で書いてください"}));render();return}
  busy=true;render();
  try{const r=await aiJSON(`就活生の「まだ見えていない材料」に対して、実際の経験と力を育てる次の一手を考える。作り話や誇張はすすめない。経験をつくる場合は、今の状況の中で、自分で選べる余地・困難や手間・人との関わりがある役割や場面を具体的に。力を鍛える場合は練習を具体的に。actionは「いつ・どこで・何をするか」の形で1〜2文。
今の状況:${S.growCtx||"（未記入）"}\n仮説:\n${claimsText()}\n穴:\n${g.map(x=>"- "+x.what).join("\n")}
JSON:{"suggestions":[{"gap":"","path":"経験","action":""}]}`);S.grow=r.suggestions||[]}catch(e){note(aiErr(e))}
  busy=false;render()};

/* ---------- 思考トレ ---------- */
V.train=()=>{const t=S.train;return `<section class="sheet"><div class="code">思考トレ</div>
  <h2>その場の受け答えに出る力を鍛える</h2>
  <div class="row">${Object.keys(SKILLS).map(k=>`<button class="chip ${t.sk===k?"on":""}" data-act="skSel" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
  ${t.sk?`${why(t.sk,SKILLS[t.sk].l)}<div class="row"><button class="btn" data-act="skTask">お題を出してもらう</button>${spin()}</div>`:""}
  ${t.task?`<div class="q">${esc(t.task)}</div><textarea id="sk-ans" data-bind="train.ans">${esc(t.ans)}</textarea><div class="row"><button class="btn" data-act="skGrade" ${AI?"":"disabled"}>評価してもらう</button></div>`:""}
  ${t.fb?`<div class="judge" style="white-space:pre-wrap">${esc(t.fb)}</div>`:""}</section>`};
ACT.skSel=a=>{S.train={sk:a.dataset.k,task:"",ans:"",fb:""};render()};
ACT.skTask=async()=>{const t=S.train;if(!AI){t.task="身近なテーマを1つ選び、"+SKILLS[t.sk].t.replace("させる","てみてください");render();return}
  busy=true;render();try{t.task=await aiText(`就活生向けの思考トレーニング。「${t.sk}」を鍛えるお題を1問だけ。方針：${SKILLS[t.sk].t}。5分以内で書ける難易度。毎回違う題材（${uid()}）。お題の文章だけを出力。`);t.ans="";t.fb=""}catch(e){t.fb=aiErr(e)}busy=false;render()};
ACT.skGrade=async()=>{const t=S.train;if(!t.ans.trim())return;busy=true;render();
  try{t.fb=await aiText(`「${t.sk}」のお題への回答を評価する。形式：\n■目指すところ（このお題でできてほしいこと、1文）\n■今の位置（できている点を回答から引用して1〜2つ）\n■次の一手（直すと良くなる点を1つ、短い例つき）\nお題：${t.task}\n回答：${t.ans}`)}catch(e){t.fb=aiErr(e)}busy=false;render()};

/* ---------- 伸びの記録 ---------- */
const SELF4=["これからの就活やキャリアについて、考えておくべきことが分かっている","自分の進路を、自分で決められると思う","自分に合いそうな仕事や会社を、自分から調べている","選考で求められることに、自分は応えられると思う"];
V.growth=()=>{
  const used=S.claims.filter(c=>c.use);
  return `<section class="sheet"><div class="code">伸びの記録</div>
  <h2>比べる相手は、過去の自分</h2>
  <p class="note">他の人との比較や順位は出しません。点数を上げることが目的にならないよう、根拠つきの記録として見てください。</p>
  <div class="tablewrap"><table><thead><tr><th>見るもの</th><th>今</th></tr></thead><tbody>
  <tr><td>自覚の6項目（段階2以上）</td><td>${AWARE.filter(a=>S.aware[a.k].level>=2).length}/6</td></tr>
  <tr><td>自分の記録の仮説</td><td>${S.claims.length}（2つの場面で確認 ${S.claims.filter(c=>c.cert===1).length}・他人も確認 ${S.claims.filter(c=>c.cert===2).length}）</td></tr>
  <tr><td>選考で使う仮説のうち、6種類の深掘りで崩れないもの</td><td>${used.filter(probeOk).length}/${used.length}</td></tr>
  <tr><td>企業の記録：必須の条件をすべて偽りにくい情報で確かめた会社</td><td>${S.companies.filter(mustDone).length}/${S.companies.length}</td></tr>
  <tr><td>日々の記録</td><td>${S.logs.length}</td></tr>
  <tr><td>面接の練習</td><td>${S.practice.length}</td></tr>
  </tbody></table></div></section>
  <section class="sheet"><h3>ときどき、4つの問いに答える</h3>
  <p class="note">キャリア適応力（将来への関心・自分で決める・探す・できると思える）の考え方をもとにした、簡単な目安です。研究で使われる尺度そのものではありません。使い始めと、しばらくたってから答えると、自分の変化が見えます。</p>
  ${SELF4.map((q,i)=>`<label class="f">${esc(q)}<select id="s4-${i}">${["","1 そう思わない","2","3","4","5 そう思う"].map(o=>`<option>${o}</option>`).join("")}</select></label>`).join("")}
  <div class="row"><button class="btn sub" data-act="s4Save">記録する</button></div>
  ${S.checks.length?`<div class="tablewrap"><table><thead><tr><th>日付</th>${SELF4.map((_,i)=>`<th>問${i+1}</th>`).join("")}</tr></thead><tbody>${S.checks.map(c=>`<tr><td class="code">${esc(c.date)}</td>${c.v.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
  </section>
  <section class="sheet"><h3>変えた記録</h3>
  ${S.history.length?`<div class="tablewrap"><table><thead><tr><th>日付</th><th>変えたこと</th><th>きっかけ</th></tr></thead><tbody>${S.history.map(l=>`<tr><td class="code">${esc(l.date)}</td><td>${esc(l.what)}</td><td>${esc(l.why||"—")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="note">まだありません。この記録は、そのまま「どういう環境で、どうやって成長したか」の材料になります。</p>'}
  </section>
  <section class="sheet"><h3>使ってみてどうでしたか</h3>
  <div class="split"><label class="f">手間は<select id="rx-1"><option></option><option>軽い</option><option>ちょうどいい</option><option>重い</option></select></label>
  <label class="f">また使いたいか<select id="rx-2"><option></option><option>使いたい</option><option>どちらでもない</option><option>使いたくない</option></select></label></div>
  <div class="row"><button class="btn line" data-act="rxSave">記録する</button></div>
  <div class="row" style="margin-top:12px"><button class="btn line" data-act="resetAsk">最初からやり直す</button></div>
  ${S._reset?`<div class="banner">すべての記録を消します。元に戻せません。<div class="row"><button class="btn" data-act="resetDo">消して最初から</button><button class="btn line" data-act="resetNo">やめる</button></div></div>`:""}
  </section>`};
ACT.s4Save=()=>{const v=SELF4.map((_,i)=>($("#s4-"+i).value||"").slice(0,1));if(v.every(x=>!x))return;S.checks.unshift({date:today(),v});note("記録しました。");render()};
ACT.rxSave=()=>{S.reactions.unshift({date:today(),cost:$("#rx-1").value,again:$("#rx-2").value});note("ありがとうございます。記録しました。");render()};
ACT.resetAsk=()=>{S._reset=true;render()};ACT.resetNo=()=>{S._reset=false;render()};ACT.resetDo=()=>{S=blank();render()};

render();
</script>
