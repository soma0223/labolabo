<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
/* 実験ノート：方眼の紙に、証拠は蛍光ペン、判定は段階スタンプ。左に工程のレール、右に作業面 */
:root{
  --paper:#f5f7fa; --grid:#e3e8f0; --sheet:#ffffff; --ink:#1c2333; --muted:#5d6678;
  --rule:#d5dbe5; --accent:#2a54b8; --accent-soft:#e6ecfa; --mark:#fff0a0; --mark-ink:#5a4a00;
  --ok:#1f7a4d; --ok-soft:#e1f3e9; --warn:#a15c00; --warn-soft:#fbeedb; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-code:"M PLUS 1 Code","Hiragino Sans","Noto Sans Mono",ui-monospace,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:36px;
  --t-xs:12px;--t-s:14px;--t-m:16px;--t-l:19px;--t-xl:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --grid:#1b212b; --sheet:#181d26; --ink:#e7ebf2; --muted:#9aa4b5;
  --rule:#2c3441; --accent:#8fb0ff; --accent-soft:#1f2a44; --mark:#5a4d12; --mark-ink:#fff0b0;
  --ok:#6fd39f; --ok-soft:#173326; --warn:#f0b35c; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --grid:#1b212b; --sheet:#181d26; --ink:#e7ebf2; --muted:#9aa4b5;
  --rule:#2c3441; --accent:#8fb0ff; --accent-soft:#1f2a44; --mark:#5a4d12; --mark-ink:#fff0b0;
  --ok:#6fd39f; --ok-soft:#173326; --warn:#f0b35c; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:var(--t-m)/1.75 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) 64px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:var(--t-xl);font-weight:700;letter-spacing:.02em}
h2{font-size:var(--t-l);font-weight:700}
h3{font-size:var(--t-m);font-weight:700}
p{margin:0}
.code{font-family:var(--f-code);font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--s5)}
header.top{max-width:1040px;margin:0 auto var(--s4);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
header.top .lead{color:var(--muted);font-size:var(--t-s)}
.aware{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aware .dot{width:22px;height:22px;border-radius:6px;border:1px solid var(--rule);display:grid;place-items:center;font:600 11px var(--f-code);background:var(--sheet);color:var(--muted)}
.aware .dot.l2{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.aware .dot.l3{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail .grp{font:600 11px var(--f-code);letter-spacing:.1em;color:var(--muted);margin:var(--s3) 0 var(--s1) var(--s2)}
nav.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:var(--s2);padding:7px var(--s2);border-radius:8px;font-size:var(--t-s)}
nav.rail button:hover{background:var(--accent-soft)}
nav.rail button.on{background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);font-weight:700}
nav.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.rail .n{font:600 11px var(--f-code);width:28px;color:var(--muted)}
nav.rail .st{margin-left:auto;font:600 11px var(--f-code);color:var(--ok)}
main{min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.sheet.flat{background:transparent;border:0;padding:0}
.why{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 8px 8px 0;font-size:var(--t-s)}
.why b{display:block;font:600 11px var(--f-code);letter-spacing:.1em;color:var(--accent);margin-bottom:2px}
.note{font-size:var(--t-s);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.btn{all:unset;cursor:pointer;padding:10px 18px;border-radius:9px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:var(--t-s);text-align:center}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit;font-size:var(--t-m)}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:4px;font-size:var(--t-s);font-weight:500}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--rule);font-size:var(--t-s);background:var(--sheet)}
.chip.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:700}
.lv{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--f-code);padding:2px 8px;border-radius:6px;border:1px solid var(--rule);white-space:nowrap}
.lv.l0,.lv.l1{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.lv.l2{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.lv.l3{color:var(--sheet);background:var(--ok);border-color:transparent}
.tag{font:600 11px var(--f-code);padding:1px 7px;border-radius:5px;background:var(--paper);border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:var(--s3) var(--s4);white-space:pre-wrap}
.a{padding:var(--s2) var(--s4);border-left:3px solid var(--rule);white-space:pre-wrap;color:var(--ink)}
.judge{font-size:var(--t-s);display:flex;flex-direction:column;gap:6px;padding:var(--s3) var(--s4);border-radius:10px;background:var(--paper)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:var(--t-s)}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-code);color:var(--muted);background:var(--paper);letter-spacing:.04em;white-space:nowrap}
td input{min-width:120px;padding:6px 8px;font-size:var(--t-s)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s3)}
.card{border:1px solid var(--rule);border-radius:10px;padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:6px;background:var(--sheet);min-width:0}
.card.pick{cursor:pointer}.card.pick:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stmt{border:1px solid var(--rule);border-radius:10px;padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:8px}
.stmt .k{font:600 12px var(--f-code);color:var(--accent);letter-spacing:.06em}
.ev{font-size:var(--t-s)}
.ev li{margin:2px 0}
ul{margin:0;padding-left:1.2em}
.banner{padding:var(--s3) var(--s4);border-radius:10px;font-size:var(--t-s);background:var(--warn-soft);color:var(--warn)}
.ok-banner{padding:var(--s3) var(--s4);border-radius:10px;font-size:var(--t-s);background:var(--ok-soft);color:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.opt{border:1px solid var(--rule);border-radius:10px;padding:var(--s4);cursor:pointer;background:var(--sheet)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.rail{align-items:center}
  nav.rail .code{flex:0 0 auto;white-space:nowrap;margin:0 8px!important}
  nav.rail .code br{display:none}
  nav.rail .grp{display:none}
  nav.rail button{flex:0 0 auto;white-space:nowrap}
  nav.rail .st{margin-left:4px}
  .sheet{padding:var(--s4)}
  .split{grid-template-columns:minmax(0,1fr)}
}
</style>

<header class="top">
  <div>
    <div class="code">JIBUN LAB · v2</div>
    <h1>ジブンラボ</h1>
    <p class="lead">就活で何を求められているかを自覚し、自分の中身を証拠つきで言葉にするための実験ノート。</p>
  </div>
  <div>
    <div class="code" style="margin-bottom:4px">自覚の6項目</div>
    <div class="aware" id="awareBar"></div>
  </div>
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="工程"></nav>
  <main id="main"></main>
</div>

<script>
/* ============ 基本 ============ */
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toLocaleDateString("ja-JP");

/* ============ 設計で決めた中身（設計メモ 11.15・11.44・11.52〜11.62・11.75） ============ */
const AWARE=[
  {k:1,name:"企業は見えないものを推し量っている",short:"推し量り"},
  {k:2,name:"何が証拠になるか",short:"証拠"},
  {k:3,name:"企業が最終的に見たいもの",short:"最終目的"},
  {k:4,name:"設問ごとの意図",short:"設問"},
  {k:5,name:"深掘りの意味",short:"深掘り"},
  {k:6,name:"自分が会社に求めるもの",short:"自分の軸"}
];
const AWARE_TEXT={
 1:"企業は、学生の中身を直接見ることができません。数十分の面接と1枚のESから、見えるものを手がかりに推し量るしかありません（情報の非対称性）。",
 2:"だから「頑張りました」「主体性があります」のような、誰でも言える言葉は区別の役に立ちません。信用されるのは、手間や時間がかかった具体的な行動です（シグナリング）。",
 3:"企業が最終的に知りたいのは、入社後に成果を出し、長く働いてくれるかです。それを、あなたの能力・性質・価値観と、職場との相性から予測しています。",
 4:"設問ごとに、企業が推し量りたいものは違います。同じエピソードでも、設問によって前に出す部分を変えます。",
 5:"深掘りは、あなたが見せている内容に、本当に中身が伴っているかを確かめるための質問です。具体的には？環境のおかげでは？いつもそう？と、根拠を突いてきます。",
 6:"就活は、企業があなたを選ぶだけでなく、あなたが企業を選ぶ場でもあります。価値観が合うか、伸びる環境があるか、仕事で求められることに応えられるか。どれが自分にとって大事かを知っておく必要があります。"
};
const LEVEL_NAME=["表面","言葉だけ","説明できる","使える"];

const AREAS=["学業・ゼミ","部活・サークル","アルバイト","インターン","趣味・その他"];
const PERIODS=["高校","大学1年","大学2年","大学3年","今"];
const CUES=[
  {k:"choose",t:"自分で決めた・やり方を変えたこと"},
  {k:"fail",t:"うまくいかなかったこと"},
  {k:"grow",t:"できるようになったこと・ならなかったこと"},
  {k:"same",t:"別の場所でも同じようなことをしていた"},
  {k:"long",t:"時間や手間をかけ続けたこと"}
];

const STEPS=[
 {id:"m0",ep:"main",cand:null,title:"そのときを思い浮かべる",
  q:"そのエピソードのとき、どこにいて、誰と一緒で、いつ頃でしたか。写真やLINE、作ったものなど、残っている記録があれば、それも思い出してください。",
  why:"細かいことは、そのときの場所・人・記録を思い浮かべ直すと出てきやすくなります（符号化特定性原理）。ここは判定しません。",
  rubric:null},
 {id:"m1",ep:"main",cand:1,title:"何をしたか",gate:true,
  q:"そのとき、あなたは具体的に何をしましたか。思いつく順に、自由に書いてください。",
  why:"企業は「頑張った」のような言葉ではなく、具体的な行動を証拠として見ています。主語があなたか、何をどうしたか、状況が分かるか、どれだけ手間をかけたか、結果を確かめられるか、を見ていました。",
  rubric:"特徴:(a)主語が自分(「私が」) (b)具体的な動詞(「頑張った」でなく「毎週〜を〜した」) (c)状況が特定できる(いつ・どこで・誰と・規模) (d)コストが分かる(期間・量・犠牲・困難) (e)確かめられる結果(数字・前後比較・第三者の反応)。段階0=抽象語だけ／1=行動はあるが状況か主語があいまい／2=(a)(b)(c)がそろう／3=さらに(d)(e)もそろう"},
 {id:"m2",ep:"main",cand:2,title:"本人の選択か",
  q:"そのやり方以外に、どんな選択肢がありましたか。その中から、なぜそれを選んだのですか。",
  why:"企業は、それがあなた自身の選択だったのか、環境や指示のおかげだったのかを見ています。誰がやっても同じになる状況では、あなたらしさは分かりません。",
  rubric:"特徴:(a)他の選択肢があったことが分かる (b)選んだ決め手が言える (c)自発か指示かが分かる (d)環境が決めた部分と自分が決めた部分を分けて語れる。段階0=役割として語るだけ／1=自分で決めたと言うが他の選択肢が見えない／2=他の選択肢と決め手がある／3=さらに環境が決めた部分と分けている"},
 {id:"m3",ep:"main",cand:4,title:"うまくいかなかったこと",
  q:"その中で、うまくいかなかったことは何でしたか。その原因は何だったと思いますか。そのあと何を変えましたか。気持ちが落ちたときは、どう持ち直しましたか。",
  why:"企業は、失敗の原因をどこに置くかで、次に伸びる人かどうかを見ています（帰属理論）。自分で変えられる部分に原因を置ける人は、改善を続けられます。立ち直り方は、ストレス耐性の手がかりにもなります。",
  rubric:"特徴:(a)失敗が具体的に特定されている (b)原因が内的かつ変えられるもの(やり方・判断・準備)に置かれている (c)外的要因も認めたうえで自分の部分を切り出している (d)次に何を変え、どうなったか (e)気持ちが落ちたときの持ち直し方。段階0=失敗を語らないか外的な原因だけ／1=内的だが変えられない原因(性格など)／2=内的で変えられる原因／3=さらに次に変えた行動と結果"},
 {id:"m4",ep:"main",cand:7,title:"伸びた環境と伸び方",
  q:"そのとき力を発揮できた・伸びたのは、周りにどんな条件があったからだと思いますか（任される範囲、反応が返ってくる早さ、人との関係など）。どうやって伸びていきましたか。",
  why:"企業は、あなたがどんな環境で、どうやって伸びるのかを知り、自社の環境でも同じことが起きるかを見ています。",
  rubric:"特徴:(a)力を発揮した環境の要素を具体的に挙げられる (b)伸び方の過程が言える(何を、どのくらいで、どうやって) (c)伸びなかった環境と比べて条件を絞り込めている。段階0=環境に触れない／1=「人に恵まれた」など一般的な言葉／2=具体的な環境の要素と伸び方の過程がある／3=さらに伸びなかった環境との比較で条件を絞れている"},
 {id:"m5",ep:"main",cand:3,title:"大事にしていること",
  q:"さっき話してくれた「それを選んだ決め手」は、あなたにとって、なぜ大事だったのですか。そう思うようになった経験はありますか。",
  why:"理由を価値観までたどれると、言葉だけでない動機が見えます。最後に聞いたのは、先に価値観を言うと、その後の事実をそれに合わせて整えてしまうからです。",
  rubric:"特徴:(a)理由が行動の言い換えでない (b)「なぜ大事か」を2段以上上れる (c)行き着いた価値観にその人らしい具体性が残っている(「人の役に立ちたい」のような誰でも言える言葉で終わらない) (d)その価値観ができた経験が言える。段階0=理由がないか言い換え／1=1段の理由／2=その人らしい価値観まで届く／3=さらに由来の経験がある"},
 {id:"s0",ep:"sub",cand:null,title:"副：そのときを思い浮かべる",
  q:"2つ目のエピソードについて、どこで、誰と、いつ頃だったかを思い浮かべてください。残っている記録があれば、それも。",
  why:"1つ目と同じく、細かいことを思い出す土台です。ここは判定しません。",rubric:null},
 {id:"s1",ep:"sub",cand:1,title:"副：何をしたか",
  q:"2つ目のエピソードで、あなたは具体的に何をしましたか。",
  why:"2つ目のエピソードは、1つ目と違う場面でも同じ動き方が出るかを確かめる材料です。ここでは具体的な行動まで聞きます。",
  rubric:"特徴:(a)主語が自分 (b)具体的な動詞 (c)状況が特定できる (d)コスト (e)確かめられる結果。段階0=抽象語だけ／1=行動はあるが状況か主語があいまい／2=(a)(b)(c)がそろう／3=さらに(d)(e)"},
 {id:"p1",ep:"both",cand:5,title:"2つに共通する動き方",
  q:"1つ目と2つ目のエピソードを比べて、あなたの動き方に共通するところはありますか。逆に、その動き方が出なかった場面はありますか。",
  why:"企業は「いつもそうなのか、たまたまか」を見ています。場面が違っても同じ動き方が出るなら、それはあなたの性質の証拠になります。出なかった場面は、あなたの強みが使える範囲と、弱みを教えてくれます。",
  rubric:"特徴:(a)2つ以上の別の出来事 (b)共通点が行動のレベルで言える(「頑張った」でなく「まず相手に聞いてから決める」) (c)場面が違うのに同じパターン (d)そのパターンが出なかった場面とその違い。段階0=出来事が1つだけ／1=共通点が抽象的／2=違う場面で行動レベルの共通点がある／3=さらに出なかった場面とその違い"},

let DB=null, DOC=null, saveTimer=null, saving=false, saveAgain=false, storeMode="local";
function lsGet(){try{return JSON.parse(localStorage.getItem("jl2")||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem("jl2",JSON.stringify(S))}catch(e){}}
function persist(){
  lsSet();

  clearTimeout(saveTimer);

}
async function flush(){
  if(saving){saveAgain=true;return}
  saving=true;
  try{await DOC.set({state:JSON.stringify(S),at:Date.now()})}catch(e){}
  saving=false;
  if(saveAgain){saveAgain=false;flush()}
}
function merge(x){const b=blank();return Object.assign(b,x||{},{aware:Object.assign(b.aware,(x||{}).aware||{})})}

const SYS="あなたは就活生の自己分析を支える、厳密で誠実なコーチです。事実にないことは書かない。本人の言葉をなるべくそのまま拾う。褒めすぎない。判定は回答の表面に書かれている特徴だけで行い、根拠となる部分を回答から引用する。";
async function aiJSON(prompt,tier){
  if(!AI)throw new Error("noai");
  return await AI.json(SYS+"\n\n"+prompt,{modelTier:tier||"default",cache:false});
}
async function aiText(prompt){
  if(!AI)throw new Error("noai");
  const r=await AI(prompt,{cache:false});return r.text.trim();
}
let busy=false;
function aiErr(e){
  if(e&&e.code==="not_granted")return "AIの利用が許可されていません。手動で進められます。";
  if(e&&e.code==="rate_limited")return "AIが混み合っています。少し待ってからもう一度押してください。";
  if(e&&e.message==="noai")return "AIはclaude.aiでこのページを開いたときに使えます。手動で進められます。";
  return "AIの応答を受け取れませんでした。もう一度押してください。";
}

function doneMark(k){
  if(k==="intro")return S.intro.done?"✓":"";
  if(k==="recall")return S.cands.length>=2?"✓":"";
  if(k==="pick")return S.main&&S.sub?"✓":"";
  if(k==="deep")return STEPS.every(s=>S.deep[s.id]&&S.deep[s.id].done)?"✓":"";
  if(k==="p1")return S.p1?"✓":"";
  return "";
}

    <div class="why"><b>選び方</b>「一番すごい成果」で選ばないでください。信用されるのは、成果の大きさより、あなたが選んだことと、かけた手間です。次の4つに多く当てはまるものが向いています。<br>・自分で選べる余地が大きかった　・うまくいかなかったことや困難があった　・時間や手間がかかった　・細かいところまで思い出せる</div>
    <div class="cards">${S.cands.map(c=>`<div class="card pick ${S.main===c.id?"sel":""}" data-act="setMain" data-id="${c.id}"><b>${esc(c.title)}</b><div class="row"><span class="tag">${esc(c.period)}</span><span class="tag">${esc(c.area)}</span><span class="tag">${c.group?"集団":"1人"}</span></div></div>`).join("")}</div>
  </section>
  <section class="sheet">
    <div class="code">02 · 副エピソード</div>
    <h2>2つ目を、主とは関係なく選んでください</h2>
    <p class="note">「主と同じことをした出来事」を探して選ばないでください。合うものばかり探すと、判定が甘くなります。比べるのは選んだ後です。主と違う領域、主が1人の出来事なら集団の場面から選びます。</p>
    <div class="cards">${S.cands.filter(c=>c.id!==S.main).map(c=>`<div class="card pick ${S.sub===c.id?"sel":""}" data-act="setSub" data-id="${c.id}"><b>${esc(c.title)}</b><div class="row"><span class="tag">${esc(c.period)}</span><span class="tag">${esc(c.area)}</span><span class="tag">${c.group?"集団":"1人"}</span></div></div>`).join("")}</div>
    ${warn}
    <div class="row"><button class="btn" data-go="deep" ${m&&sb?"":"disabled"}>深掘り へ進む</button></div>
  </section>`;
};
ACT.setMain=a=>{S.main=a.dataset.id;if(S.sub===S.main)S.sub=null;render()};
ACT.setSub=a=>{S.sub=a.dataset.id;render()};

/* ---------- 03 深掘り ---------- */
function curStep(){return STEPS.find(s=>!(S.deep[s.id]&&S.deep[s.id].done))||null}
V.deep=()=>{
  if(!S.main||!S.sub)return `<section class="sheet"><h2>先にエピソードを2つ選んでください</h2><div class="row"><button class="btn" data-go="pick">エピソードを選ぶ</button></div></section>`;
  const cur=curStep();
  const list=STEPS.map(s=>{const d=S.deep[s.id];const on=cur&&cur.id===s.id;
    return `<div class="row" style="justify-content:space-between;${on?"font-weight:700":""}"><span><span class="code">${s.id.toUpperCase()}</span> ${esc(s.title)}</span>${s.rubric?(d&&d.level!=null?lv(d.level):'<span class="lv">未</span>'):(d&&d.done?'<span class="lv l2">済</span>':'<span class="lv">未</span>')}</div>`}).join("");
  let body="";
  if(!cur){body=`<div class="ok-banner">深掘りがひととおり終わりました。次は、これを「自分はこういう人だ」という言葉にまとめます。</div><div class="row"><button class="btn" data-go="p1">まとめる へ進む</button></div>`}
  else{
    const d=S.deep[cur.id]||{msgs:[],level:null,tries:0,done:false};
    const epx=cur.ep==="main"?ep(S.main):cur.ep==="sub"?ep(S.sub):null;
    const pending=d.next||cur.q;
    body=`<div class="code">${cur.id.toUpperCase()} · ${cur.cand?"候補"+cur.cand:"手がかり"}${epx?" · "+esc(epx.title):" · 2つのエピソード"}</div>
      <h2>${esc(cur.title)}</h2>
      ${d.msgs.map((m,i)=>`<div class="q">${esc(m.q)}</div><div class="a">${esc(m.a)}</div>${m.j?judgeHtml(m.j):""}`).join("")}
      ${d.showWhy?why("この質問で企業が見ていること",cur.why):""}
      ${d.gateStop?`<div class="banner">何度か補っても、具体的な行動が段階2に届きませんでした。このエピソードの記憶が薄いのかもしれません。同じ質問を重ねると、なかった細部を作ってしまうおそれがあるので、別のエピソードに切り替えることをおすすめします。</div>
        <div class="row"><button class="btn" data-act="switchEp">別のエピソードに切り替える</button><button class="btn line" data-act="forceNext">このまま進む</button></div>`:`
      <div class="q">${esc(pending)}</div>
      <textarea id="deep-ans" placeholder="思ったままに。具体的に。"></textarea>
      <div class="row"><button class="btn" data-act="deepSend">${cur.rubric?"答える":"書いた"}</button>${busy?'<span class="spin"></span> 判定中…':""}
        ${d.msgs.length&&cur.rubric&&!cur.gate?'<button class="btn line" data-act="forceNext">次の項目へ進む</button>':""}</div>
      ${!AI&&cur.rubric&&d.msgs.length&&d.level==null?selfJudge(cur):""}`}`;
  }
  return `<section class="sheet flat"><div class="cards" style="grid-template-columns:minmax(0,1fr)">
    <div class="sheet">${body}</div>
    <div class="sheet"><div class="code">進み具合</div><p class="note">主：${epLabel(ep(S.main))}<br>副：${epLabel(ep(S.sub))}</p>${list}
    <p class="note">事実を先に、理由や価値観は後で聞きます。先に理由を言うと、その後の話がそれに合うよう整えられてしまうからです。</p></div>
  </div></section>`;
};
function judgeHtml(j){
  return `<div class="judge"><div class="row">${lv(j.level)}${j.evidence&&j.evidence.length?'<span class="note">回答の中の証拠：</span>':""}</div>
    ${j.evidence&&j.evidence.length?`<div>${j.evidence.map(x=>`<mark>${esc(x)}</mark>`).join(" ")}</div>`:""}
    ${j.missing&&j.missing.length?`<div class="note">まだ見えないもの：${esc(j.missing.join("、"))}</div>`:""}</div>`;
}
function selfJudge(cur){
  return `<div class="judge"><b>自分で判定してください（AI未接続）</b><div class="note">${esc(cur.rubric)}</div><div class="row">${[0,1,2,3].map(n=>`<button class="chip" data-act="selfLv" data-n="${n}">段階${n}</button>`).join("")}</div></div>`;
}
ACT.selfLv=a=>{const cur=curStep();const d=S.deep[cur.id];const n=+a.dataset.n;d.level=n;d.msgs[d.msgs.length-1].j={level:n,evidence:[],missing:[]};d.showWhy=true;if(n>=2){d.done=true}else{d.tries++;d.next="判定の基準を見て、足りないところを補ってください。";if(cur.gate&&d.tries>=3)d.gateStop=true}render()};
ACT.deepSend=async()=>{
  const cur=curStep();if(!cur)return;
  const ans=$("#deep-ans").value.trim();if(!ans||busy)return;
  const d=S.deep[cur.id]||(S.deep[cur.id]={msgs:[],level:null,tries:0,done:false});
  d.msgs.push({q:d.next||cur.q,a:ans});d.next=null;
  if(!cur.rubric){d.done=true;d.showWhy=true;render();return}
  if(!AI){render();return}
  busy=true;render();
  try{
    const epx=cur.ep==="main"?ep(S.main):cur.ep==="sub"?ep(S.sub):null;
    const r=await aiJSON(`就活生の自己分析の深掘り。今の項目「${cur.title}」の回答が、どの段階かを判定する。
判定基準: ${cur.rubric}
エピソード: ${epx?epx.title:"主と副の2つ"}
${cur.ep==="both"?"これまでの深掘りの記録:\n"+deepText()+"\n":""}この項目でのやりとり:
${d.msgs.map(m=>`問:${m.q}\n答:${m.a}`).join("\n")}
ルール: 段階を上げる根拠は回答からの短い引用で示す。書かれていない特徴は満たしていないとみなす。次の質問は、まだ見えない特徴を1つだけ、事実を聞く形で、60字以内。答えの例や望ましい答えを含めない。誘導しない。
JSON: {"level":0〜3,"evidence":["引用"],"missing":["まだ見えない特徴を短く"],"followup":"次の質問"}`);
    const level=Math.max(0,Math.min(3,r.level|0));
    d.msgs[d.msgs.length-1].j={level,evidence:r.evidence||[],missing:r.missing||[]};
    d.level=level;d.showWhy=true;d.tries++;
    if(level>=2){d.done=true}
    else{d.next=r.followup||"もう少し具体的に教えてください。";if(cur.gate&&d.tries>=3)d.gateStop=true}
    if(level>=2&&cur.id==="p1")setAware(5,2);
  }catch(e){d.msgs[d.msgs.length-1].j={level:null,evidence:[],missing:[aiErr(e)]};d.msgs.pop();alertNote(aiErr(e))}
  busy=false;render();
};
ACT.forceNext=()=>{const cur=curStep();if(!cur)return;const d=S.deep[cur.id]||(S.deep[cur.id]={msgs:[],level:null,tries:0});d.done=true;d.gateStop=false;render()};
ACT.switchEp=()=>{
  ["m0","m1","m2","m3","m4","m5"].forEach(k=>delete S.deep[k]);
  S.main=null;S.view="pick";render();
};
function alertNote(t){setTimeout(()=>{const m=$("#main");if(m)m.insertAdjacentHTML("afterbegin",`<div class="banner">${esc(t)}</div>`)},0)}

/* ---------- 04 まとめる（P1） ---------- */
const TYPES=[
 {k:"A",t:"行動のパターン",form:"私は（どんな場面）では、（どう動く）"},
 {k:"B",t:"大事にしていること",form:"私は（何）を大事にしている。そう思うようになったのは（どんな経験）から"},
 {k:"C",t:"伸びる条件と伸び方",form:"私は（どんな環境）で、（どういうやり方で）伸びる"},
 {k:"D",t:"つまずき方と立て直し方",form:"私は（どんなとき）につまずきやすく、（どうやって）立て直してきた"}
];
const CERT=["2つの場面で確認","1つの場面だけ・仮説","論拠が弱い"];
V.p1=()=>{
  const p=S.p1;
  return `<section class="sheet">
    <div class="code">04 · まとめる</div>
    <h2>深掘りの事実から、「自分はこういう人だ」を言葉にする</h2>
    <p class="note">形容詞（「主体性がある」）ではなく、場面つきで書きます。どの言葉にも、それを支える事実をひもづけます。事実のない言葉は書きません。</p>
    ${why("最初はAIが下書きを支えます","下書きを、あなた自身の言葉に直してください。自分で作った言葉のほうが、面接で自然に話せ、覚えていられます。慣れてきたら、先に自分で書いてからAIと比べる形に変えられます。")}
    <div class="row"><button class="btn" data-act="p1Draft" ${deepText()?"":"disabled"}>${p?"下書きを作り直す":"下書きを作る"}</button>${busy?'<span class="spin"></span>':""}
      ${p?"":'<button class="btn line" data-act="p1Blank">自分で一から書く</button>'}</div>
  </section>
  ${p?TYPES.map(t=>`<section class="sheet"><div class="code">${t.k} · ${esc(t.t)}</div><p class="note">形：${esc(t.form)}</p>
    ${(p[t.k]||[]).map((s,i)=>stmtHtml(t.k,s,i)).join("")||'<p class="note">まだありません。</p>'}
    <div class="row"><button class="btn line" data-act="p1Add" data-k="${t.k}">言葉を足す</button></div></section>`).join("")
    +(p.gaps&&p.gaps.length?`<section class="sheet"><div class="code">ずれ</div><p class="note">消さずに残します。食い違いを自覚しているほうが、深掘りで崩れにくくなります。次に深掘りする材料にもなります。</p><ul>${p.gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></section>`:"")
    +`<section class="sheet"><label class="f">変えたときの理由（任意。変えた記録に残ります）<input type="text" id="p1-why" placeholder="例：練習で「環境のおかげでは？」に答えられなかったので"></label>
      <div class="row"><button class="btn" data-act="p1Save">直した内容を確定する</button></div></section>`:""}`;
};
function stmtHtml(k,s,i){
  const self=s.selfCert;
  return `<div class="stmt"><div class="k">${k}-${i+1}</div>
    <textarea id="st-${k}-${i}" data-bind="p1.${k}.${i}.claim">${esc(s.claim)}</textarea>
    ${s.data&&s.data.length?`<div class="ev"><span class="note">支える事実：</span>${s.data.map(x=>`<mark>${esc(x)}</mark>`).join(" ")}</div>`:""}
    ${s.warrant?`<div class="ev note">なぜ支えになるか：${esc(s.warrant)}</div>`:""}
    <div class="row"><span class="note">どこまで確かめられたか（先に自分で）：</span>${CERT.map((c,j)=>`<button class="chip ${self===j?"on":""}" data-act="selfCert" data-k="${k}" data-i="${i}" data-j="${j}">${esc(c)}</button>`).join("")}</div>
    ${self!=null&&s.cert!=null?`<div class="note">AIの見立て：<b>${esc(CERT[s.cert]??s.cert)}</b>${self!==s.cert?" ・ あなたの見立てとずれています。根拠になった事実の数と場面を見直してみてください。":" ・ 一致しました。"}</div>`:""}
  </div>`;
}
ACT.selfCert=a=>{const s=S.p1[a.dataset.k][+a.dataset.i];s.selfCert=+a.dataset.j;render()};
ACT.p1Blank=()=>{S.p1={A:[],B:[],C:[],D:[],gaps:[]};render()};
ACT.p1Add=a=>{S.p1[a.dataset.k].push({claim:"",data:[],warrant:"",cert:null});render()};
ACT.p1Draft=async()=>{
  if(!AI){alertNote(aiErr(new Error("noai")));return}
  busy=true;render();
  try{
    const r=await aiJSON(`就活生の深掘りの記録から、本人を表す言葉を4つの型で作る。
型A 行動のパターン: 「私は（どんな場面）では、（どう動く）」。形容詞は使わない。データは2つ以上のエピソードから。
型B 大事にしていること: 「私は（何）を大事にしている。そう思うようになったのは（経験）から」
型C 伸びる条件と伸び方: 「私は（どんな環境）で、（どういうやり方で）伸びる」
型D つまずき方と立て直し方: 「私は（どんなとき）につまずきやすく、（どうやって）立て直してきた」
ルール: 各型1〜2つまで。どの言葉にも、記録からの短い引用をデータとして付ける。データがなければその言葉は作らない。本人の言い回しをなるべく残す。certaintyは 0=2つの場面で確認 1=1つの場面だけ・仮説 2=論拠が弱い。価値観と行動の食い違いは gaps に書く。
記録:
主エピソード: ${(ep(S.main)||{}).title}
副エピソード: ${(ep(S.sub)||{}).title}
${deepText()}
JSON: {"A":[{"claim":"","data":["引用"],"warrant":"なぜその事実が支えになるか","certainty":0}],"B":[...],"C":[...],"D":[...],"gaps":["..."]}`,"complex");
    const fix=arr=>(arr||[]).slice(0,2).map(s=>({claim:s.claim||"",data:s.data||[],warrant:s.warrant||"",cert:Number.isInteger(s.certainty)?s.certainty:1,selfCert:null}));
    const old=S.p1;
    S.p1={A:fix(r.A),B:fix(r.B),C:fix(r.C),D:fix(r.D),gaps:r.gaps||[]};
    S.log.unshift({date:today(),what:old?"まとめの下書きを作り直した":"まとめの下書きを作った",why:""});
  }catch(e){alertNote(aiErr(e))}
  busy=false;render();
};
ACT.p1Save=()=>{
  const w=$("#p1-why").value.trim();
  S.log.unshift({date:today(),what:"まとめを確定："+TYPES.map(t=>(S.p1[t.k]||[]).map(s=>t.k+"「"+s.claim.slice(0,40)+"」").join(" ")).join(" "),why:w});
  render();alertNote("確定しました。変えた記録に残しました。");
};
function p1Text(){
  if(!S.p1)return "（まとめはまだありません）";
  return TYPES.map(t=>`${t.k} ${t.t}:\n`+(S.p1[t.k]||[]).map(s=>`- ${s.claim}（事実: ${(s.data||[]).join(" / ")}）`).join("\n")).join("\n");
}

/* ---------- 05 設問（P2） ---------- */
V.p2=()=>{
  const k=S.p2._sel||null; const q=QUESTIONS.find(x=>x.k===k);
  const top=`<section class="sheet"><div class="code">05 · 設問に組み立てる</div>
    <h2>どの設問を組み立てますか</h2>
    <div class="row">${QUESTIONS.map(x=>`<button class="chip ${k===x.k?"on":""}" data-act="p2Sel" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div>
    <p class="note">設問ごとに別のエピソードは要りません。同じ材料（まとめ）の、前に出す部分と話す向きを変えます。</p></section>`;
  if(!q)return top;
  const st=S.p2[k]||(S.p2[k]={predict:"",revealed:false,draft:"",checks:null,company:""});
  const co=S.companies.find(c=>c.id===st.company);
  return top+`<section class="sheet">
    <div class="code">${esc(q.t)} · まず予想</div>
    <h2>この設問で、企業は何を見ていると思いますか？</h2>
    <textarea id="p2-pred" data-bind="p2.${k}.predict" placeholder="自分の言葉で">${esc(st.predict)}</textarea>
    <div class="row"><button class="btn" data-act="p2Reveal">答え合わせ</button></div>
    ${st.revealed?`${why("企業が見ているもの",q.intent)}${st.fb?`<div class="judge">${esc(st.fb)}</div>`:""}
      <div class="judge"><b>組み立ての順（話す向き：${esc(q.dir)}／材料：${esc(q.uses)}）</b><ol style="margin:0;padding-left:1.4em">${q.parts.map(p=>`<li>${esc(p)}</li>`).join("")}</ol><span class="note">【必】は、字数が足りないときも必ず残す部分です。それ以外は削れます。</span></div>`:""}
  </section>
  ${st.revealed?`<section class="sheet"><div class="code">${esc(q.t)} · 組み立て</div>
    ${q.needsCo?`<label class="f">どの会社向けですか（企業と照らすで記録した会社）<select id="p2-co" data-bind="p2.${k}.company"><option value="">選んでください</option>${S.companies.map(c=>`<option value="${c.id}" ${st.company===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
      ${S.companies.length?"":'<div class="banner">この設問には、企業について確かめた情報が要ります。先に「企業と照らす」で会社を記録してください。</div>'}`:""}
    <div class="row"><button class="btn sub" data-act="p2Draft" ${S.p1&&(!q.needsCo||co)?"":"disabled"}>まとめから下書きを支えてもらう</button>${busy?'<span class="spin"></span>':""}</div>
    <textarea id="p2-draft" data-bind="p2.${k}.draft" style="min-height:200px" placeholder="自分で書くか、下書きを自分の言葉に直してください">${esc(st.draft)}</textarea>
    <div class="row"><button class="btn" data-act="p2Check">点検する</button></div>
    ${st.checks?`<div class="tablewrap"><table><thead><tr><th>点検</th><th>結果</th><th>コメント</th></tr></thead><tbody>${st.checks.map(c=>`<tr><td>${esc(c.item)}</td><td>${c.ok?'<span class="lv l2">OK</span>':'<span class="lv l1">要修正</span>'}</td><td>${esc(c.comment||"")}</td></tr>`).join("")}</tbody></table></div>`:""}
  </section>`:""}`;
};
ACT.p2Sel=a=>{S.p2._sel=a.dataset.k;render()};
ACT.p2Reveal=async()=>{
  const k=S.p2._sel,q=QUESTIONS.find(x=>x.k===k),st=S.p2[k];
  if(!st.predict.trim()){alertNote("先に予想を書いてください。");render();return}
  st.revealed=true;
  if(AI){busy=true;render();
    try{const r=await aiJSON(`就活生に「${q.t}」で企業が何を見ていると思うか予想させた。正解の要点は「${q.intent}」。
予想: ${st.predict}
理解の段階を0〜3で判定（0=表面的／1=言葉だけ／2=理由まで説明できる／3=自分の準備の判断に結びつけている）。
JSON: {"level":数値,"feedback":"予想の言葉を引用しながら、合っている点と抜けている点を2文で"}`,"quick");
      setAware(4,r.level|0);st.fb=r.feedback||"";}catch(e){st.fb=aiErr(e)}
    busy=false;}else setAware(4,1);
  render();
};
ACT.p2Draft=async()=>{
  const k=S.p2._sel,q=QUESTIONS.find(x=>x.k===k),st=S.p2[k];
  const co=S.companies.find(c=>c.id===st.company);
  busy=true;render();
  try{
    const r=await aiJSON(`就活生の「${q.t}」の下書きを、本人のまとめだけを材料に組み立てる。まとめにない事実は足さない。本人の言い回しを残す。
組み立ての順: ${q.parts.join(" → ")}
話す向き: ${q.dir}
まとめ:
${p1Text()}
${co?"企業の記録:\n"+coText(co):""}
JSON: {"draft":"本文。各部分の頭に【部分名】を付ける","notes":["材料が足りなかった部分"]}`);
    st.draft=(r.draft||"")+(r.notes&&r.notes.length?"\n\n（材料が足りない部分："+r.notes.join("、")+"）":"");
  }catch(e){alertNote(aiErr(e))}
  busy=false;render();
};
ACT.p2Check=async()=>{
  const k=S.p2._sel,q=QUESTIONS.find(x=>x.k===k),st=S.p2[k];

ACT.probeNew=async()=>{
  const recent=S.practice.slice(0,3).map(p=>p.type);
  const pool=PROBES.filter(p=>!recent.includes(p.k));const pr=(pool.length?pool:PROBES)[Math.floor(Math.random()*(pool.length?pool.length:PROBES.length))];
  if(!AI){S.practiceCur={type:pr.k,q:pr.ex};render();return}
  busy=true;render();
  try{const r=await aiJSON(`面接官として、就活生の自己PRや経験に対して深掘り質問を1つ作る。質問の種類は「${pr.t}」（例：${pr.ex}）。本人のまとめの中から1つを選び、それを突く。50字以内、面接官の口調。
まとめ:\n${p1Text()}
JSON: {"question":""}`,"quick");S.practiceCur={type:pr.k,q:r.question||pr.ex};}catch(e){alertNote(aiErr(e))}
  busy=false;render();
};
ACT.probeAns=async()=>{
  const cur=S.practiceCur;const a=$("#probe-ans").value.trim();if(!a)return;
  const rec={type:cur.type,q:cur.q,a,date:today(),eval:null};
  S.practice.unshift(rec);S.practiceCur=null;
  if(AI){busy=true;render();
    const pr=PROBES.find(x=>x.k===cur.type);const st=STEPS.find(s=>s.cand===pr.cand&&s.rubric);
    try{const r=await aiJSON(`面接の深掘り質問への答えを評価する。
質問の種類: ${pr.t}
中身の判定基準（候補${pr.cand}）: ${st?st.rubric:""}
伝え方の4つの特徴: answerFirst=最初の一文が問いへの答え, onPoint=聞かれたことに答えている, linked=「なぜなら」「たとえば」など主張と根拠のつながりを示している, concise=必要以上に長くない
本人のまとめ（参考）:\n${p1Text()}
質問: ${cur.q}
答え: ${a}
JSON: {"level":0〜3,"delivery":{"answerFirst":true,"onPoint":true,"linked":true,"concise":true},"comment":"答えを引用しながら、どこが支えられていて、どこが崩れやすいかを2文で"}`);
      rec.eval={level:Math.max(0,Math.min(3,r.level|0)),delivery:r.delivery||{},comment:r.comment||""};
      if(rec.eval.level>=2)setAware(5,2);
    }catch(e){rec.eval={level:null,delivery:{},comment:aiErr(e)}}
    busy=false;}
  render();
};

/* ---------- 08 育てる（d） ---------- */
function gaps(){
  const g=[];
  STEPS.filter(s=>s.rubric).forEach(s=>{const d=S.deep[s.id];if(d&&d.done&&d.level!=null&&d.level<2)g.push({src:"深掘り",what:`「${s.title}」が段階${d.level}のまま`,cand:s.cand})});
  const m=ep(S.main),sb=ep(S.sub);
  if(m&&sb&&!m.group&&!sb.group)g.push({src:"設問の点検",what:"集団の場面のエピソードがない（チームで取り組んだ経験の材料）",cand:1});
  if(S.p1&&!(S.p1.A||[]).some(s=>s.cert===0))g.push({src:"まとめ",what:"2つの場面で確かめられた行動のパターンがない",cand:5});
  S.practice.filter(p=>p.eval&&p.eval.level!=null&&p.eval.level<2).slice(0,3).forEach(p=>{const pr=PROBES.find(x=>x.k===p.type);g.push({src:"練習",what:`「${pr.t}」の質問で崩れた`,cand:pr.cand})});
  S.companies.forEach(c=>(c.qs||[]).filter(x=>x.status==="合わない"&&x.fit===FITS[2]).forEach(x=>g.push({src:"企業",what:`${c.name}：仕事で求められることと合わない（${x.q}）`,cand:null})));
  AWARE.filter(a=>S.aware[a.k].level<2).forEach(a=>g.push({src:"自覚",what:`自覚「${a.name}」が段階${S.aware[a.k].level}`,cand:null,aware:true}));
  return g;
}

  <p class="note">この記録は、そのまま「どういう環境で、どうやって成長したか」の材料になります。新しい経験をしたら、思い出す に戻って新しいエピソードとして足し、影響するところだけ深掘りし直します。</p>
  <div class="row"><button class="btn line" data-go="recall">新しい経験を足す</button></div>
  ${S.log.length?`<div class="tablewrap"><table><thead><tr><th>日付</th><th>変えたこと</th><th>きっかけ</th></tr></thead><tbody>${S.log.map(l=>`<tr><td class="code">${esc(l.date)}</td><td>${esc(l.what)}</td><td>${esc(l.why||"—")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="note">まだ記録はありません。まとめを作ったり直したりすると、ここに残ります。</p>'}
  <div class="row" style="margin-top:12px"><button class="btn line" data-act="resetAsk">最初からやり直す</button></div>
  ${S._reset?`<div class="banner">すべての記録を消します。元に戻せません。<div class="row"><button class="btn" data-act="resetDo">消して最初から</button><button class="btn line" data-act="resetNo">やめる</button></div></div>`:""}
</section>`;
ACT.resetAsk=()=>{S._reset=true;render()};
ACT.resetNo=()=>{S._reset=false;render()};
ACT.resetDo=()=>{S=blank();render()};

render();
</script>
