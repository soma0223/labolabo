<style>
/* チューナーの画面：1列のカード、中心に「音の高さのレーン」。合っている=青緑、高い=橙、低い=青。下に5つのタブ */
:root{
  --bg:#f3f6f6; --sheet:#ffffff; --ink:#14232a; --muted:#566a72; --rule:#d3dddf;
  --accent:#0b7a80; --accent-soft:#dff1f1; --hi:#b8530a; --hi-soft:#fbe9d8; --lo:#2c5bd0; --lo-soft:#e2e9fb; --bad:#b3261e;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-code:"M PLUS 1 Code","Hiragino Sans",ui-monospace,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --t-xs:12px;--t-s:14px;--t-m:16px;--t-l:19px;--t-xl:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --sheet:#162125; --ink:#e4eef0; --muted:#93a8ae; --rule:#29383d;
  --accent:#5fd0d2; --accent-soft:#143436; --hi:#f2a45f; --hi-soft:#3a2713; --lo:#8fb0ff; --lo-soft:#1b2745; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --sheet:#162125; --ink:#e4eef0; --muted:#93a8ae; --rule:#29383d;
  --accent:#5fd0d2; --accent-soft:#143436; --hi:#f2a45f; --hi-soft:#3a2713; --lo:#8fb0ff; --lo-soft:#1b2745; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-m)/1.75 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) 110px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:var(--t-xl);font-weight:700;letter-spacing:.04em}
h2{font-size:var(--t-l);font-weight:700}
h3{font-size:var(--t-m);font-weight:700}
p{margin:0}
ul{margin:0;padding-left:1.2em}
.code{font-family:var(--f-code);font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted)}
header.top,main{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
main{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.note{font-size:var(--t-s);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.btn{all:unset;cursor:pointer;padding:11px 18px;border-radius:9px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:var(--t-s);text-align:center}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.btn.on{background:var(--accent);color:var(--sheet);box-shadow:none}
.btn.big{padding:14px 22px;font-size:var(--t-m);flex:1 1 auto}
.btn:focus-visible,summary:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;font:600 11px var(--f-code);letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.weak{background:var(--hi-soft);color:var(--hi)}
.tag.mid{background:var(--lo-soft);color:var(--lo)}
.why{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 8px 8px 0;font-size:var(--t-s)}
.why b{display:block;font:600 11px var(--f-code);letter-spacing:.1em;color:var(--accent)}
.warnbox{border:1px solid var(--hi);background:var(--hi-soft);color:var(--ink);padding:var(--s3) var(--s4);border-radius:8px;font-size:var(--t-s)}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s3);font-size:var(--t-s)}
dl.kv dt{font-weight:700;color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0}
details{border-top:1px solid var(--rule);padding-top:var(--s2)}
details>summary{cursor:pointer;font-weight:700;font-size:var(--t-s);color:var(--accent);border-radius:4px}
details>div{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2);font-size:var(--t-s)}
.steps{display:flex;flex-direction:column;gap:var(--s2)}
.step{display:flex;gap:var(--s3);align-items:center;padding:var(--s3);border:1px solid var(--rule);border-radius:10px}
.step .n{font:600 var(--t-s) var(--f-code);color:var(--muted);width:20px}
.step .t{flex:1;min-width:0}
.step .t small{display:block;color:var(--muted);font-size:var(--t-xs);line-height:1.5}
.step .done{font:600 var(--t-xs) var(--f-code);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.notes{display:flex;gap:var(--s2);justify-content:center}
.notes span{font:600 var(--t-l) var(--f-code);padding:6px 14px;border-radius:9px;border:1px solid var(--rule);color:var(--muted)}
.notes span.on{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.phase{text-align:center;font-weight:700;font-size:var(--t-l)}
.hear{text-align:center;font:600 var(--t-xs) var(--f-code);color:var(--muted)}
.hear.on{color:var(--accent)}
canvas.lane{width:100%;height:190px;display:block;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.nums div{border:1px solid var(--rule);border-radius:10px;padding:var(--s2) var(--s3);min-width:0}
.nums small{display:block;font-size:var(--t-xs);color:var(--muted);line-height:1.4}
.nums b{font:600 var(--t-l) var(--f-code);font-variant-numeric:tabular-nums}
.c-ok{color:var(--accent)}.c-hi{color:var(--hi)}.c-lo{color:var(--lo)}
table{border-collapse:collapse;width:100%;font-size:var(--t-s);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
th{font-size:var(--t-xs);color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{all:unset;cursor:pointer;flex:1 1 0;max-width:128px;text-align:center;padding:8px 2px;border-radius:9px;font-size:var(--t-xs);font-weight:700;color:var(--muted)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.beat{width:30px;height:30px;border-radius:50%;margin:0 auto;background:var(--rule)}
.beat.on{background:var(--accent)}
.msg{white-space:pre-wrap;padding:var(--s3);border-radius:10px;font-size:var(--t-s);border:1px solid var(--rule)}
.msg.me{background:var(--accent-soft);border-color:transparent;margin-left:var(--s5)}
textarea,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:72px;resize:vertical}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .1s linear}}
</style>

<script>
(function(){
"use strict";
/* ---------- 状態 ---------- */
var KEY='uta-lab-v1';
var S={range:null,stage:1,pattern:'single',sets:[],days:{},est:[],takes:[]};
try{var raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function day(){var k=today(); if(!S.days[k]) S.days[k]={warm:{}}; if(!S.days[k].warm) S.days[k].warm={}; return S.days[k];}
var tab='home', runId=0, raf=0, micState='unknown';
var W=null;   /* 準備の進行 */
var T=null;   /* 音程の1回 */
var SET=null; /* 音程の5回1セット */
var R=null;   /* 音域の測定 */
var wipe=false;
var K=null;   /* 歌って分析 */
var view=document.getElementById('view');

/* ---------- 音 ---------- */
var ac=null, analyser=null, buf=null, yd=null, micStream=null, capStop=false, capFull=false;
function ensureAC(){ if(!ac){var C=window.AudioContext||window.webkitAudioContext; ac=new C();} if(ac.state==='suspended') ac.resume(); return ac; }
function micOn(){
  if(analyser) return Promise.resolve(true);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micState='blocked';return Promise.resolve(false);}
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
    micStream=st; ensureAC(); var src=ac.createMediaStreamSource(st); analyser=ac.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    buf=new Float32Array(2048); micState='ok'; return true;
  }).catch(function(){micState='blocked';return false;});
}
/* YIN法（de Cheveigné & Kawahara, 2002）で声の高さを求める */
function yin(b,sr){
  var n=b.length, half=n>>1, i, tau, rms=0;
  for(i=0;i<n;i++) rms+=b[i]*b[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.008) return {f:0,rms:rms};
  var tMin=Math.max(2,Math.floor(sr/1100)), tMax=Math.min(half-2,Math.floor(sr/65));
  if(!yd||yd.length<tMax+2) yd=new Float32Array(tMax+2);
  var run=0; yd[0]=1;
  for(tau=1;tau<=tMax+1;tau++){
    var s=0; for(i=0;i<half;i++){var d=b[i]-b[i+tau]; s+=d*d;}
    run+=s; yd[tau]=run>0? s*tau/run : 1;
  }
  var best=-1;
  for(tau=tMin;tau<=tMax;tau++){ if(yd[tau]<0.15){ while(tau+1<=tMax&&yd[tau+1]<yd[tau]) tau++; best=tau; break; } }
  if(best<0){ var mn=1; for(tau=tMin;tau<=tMax;tau++){ if(yd[tau]<mn){mn=yd[tau];best=tau;} } if(mn>0.35) return {f:0,rms:rms}; }
  var a=yd[best-1], c0=yd[best], c=yd[best+1], den=a-2*c0+c, sh=den? 0.5*(a-c)/den : 0;
  if(sh>1||sh<-1) sh=0;
  return {f:sr/(best+sh),rms:rms,ap:c0};
}
function detect(){ if(!analyser) return {f:0,rms:0}; analyser.getFloatTimeDomainData(buf); return yin(buf,ac.sampleRate); }
function tone(m,ms,when){
  ensureAC(); var t=ac.currentTime+(when||0)/1000, d=ms/1000;
  var o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.28,t+0.03); g.gain.setValueAtTime(0.28,t+Math.max(0.03,d-0.12)); g.gain.linearRampToValueAtTime(0,t+Math.max(0.05,d-0.02));
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
}
function f2m(f){return 69+12*Math.log(f/440)/Math.LN2;}
var NN=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
function nname(m){m=Math.round(m);return NN[((m%12)+12)%12]+(Math.floor(m/12)-1);}
function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}), h=s.length>>1; return s.length%2? s[h] : (s[h-1]+s[h])/2; }
function pct(a,p){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}); return s[Math.min(s.length-1,Math.floor(p*s.length))]; }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* ms の間、毎フレーム声を調べる。mic が無いときは時間だけ進める */
function capture(ms,onFrame){
  return new Promise(function(res){
    var fr=[], t0=performance.now(), my=runId; capStop=false;
    (function tick(){
      if(my!==runId) return;
      var t=performance.now()-t0, r=detect();
      if(capFull&&r.f) r.spr=sprOf(buf,ac.sampleRate);
      fr.push({t:t,f:r.f,rms:r.rms,ap:r.ap,spr:r.spr});
      if(onFrame) onFrame(t,r,fr);
      if(t<ms&&!capStop) raf=requestAnimationFrame(tick); else res(fr);
    })();
  });
}
function stopAll(){ runId++; cancelAnimationFrame(raf); }

/* ---------- 中身：準備の3つ ---------- */
var WARM=[
 {id:'breath',name:'息を一定に吐く',sub:'「スー」と細く、15秒',ms:15000,mic:true,
  why:'音程のぶれを減らし、声に芯を作る土台です。',
  how:'声の高さと大きさは、声帯の下にかかる息の圧力で決まります。圧力が揺れると、音程も声の大きさも揺れます。',
  tip:'吸ったときに広がった肋骨とお腹まわりを、吐いている間すぐにしぼませません。遠くのろうそくの火を、消さずに揺らし続けるつもりで吐きます。',
  check:'最後まで同じ強さで吐けた。',
  ev:[['','仕組みは確立された知識'],['mid','練習法は伝統的な指導法（支え）']]},
 {id:'siren',name:'ストローでサイレン',sub:'低い音から高い音へ行き来、60秒',ms:60000,mic:true,
  why:'喉の締めつけを取り、地声と裏声をつなぎます。高い音の土台です。',
  how:'口先を細くすると口の中の圧力が上がり、声帯が少ない力で振動します。喉に負担をかけずに声帯を伸ばす練習ができます（半閉鎖声道エクササイズ、Titze）。',
  tip:'ストローをくわえて「うー」と、救急車のサイレンのように上下します。高いところほど小さく軽く出します。途中で裏返ってかまいません。ストローがなければ、唇をブルブル震わせるか、口をすぼめた「うー」でも代わりになります。',
  check:'喉が痛くない。終わった後に声が軽く出る。',
  ev:[['','研究で効果が確かめられている']]},
 {id:'onset',name:'出だしをそろえる',sub:'小さく短く「あ、あ、あ」、30秒',ms:30000,mic:false,
  why:'一声目の印象を作る練習です。',
  how:'息と声帯の閉じが同時に始まると、息もれもぶつけた音もない出だしになります。',
  tip:'小さな声で短く「あ」を続けます。息が先に出る「は」にも、喉を詰めた「っあ」にもしません。机の上に、指でそっと点を置くつもりで出します。',
  check:'出だしに息の音も、喉の詰まる音もない。',
  ev:[['','仕組みは確立された知識'],['mid','イメージは指導法']]}
];
var STAGE={1:['見ながら合わせる','歌っている間、声の高さが見えます。'],2:['歌った後に見る','歌っている間は見えません。終わってから答え合わせをします。'],3:['先に自分で当てる','答えを見る前に、高かったか低かったかを自分で言います。']};
var PAT={single:{name:'1音',off:[0],len:2500},step:{name:'3音・となり',off:[0,2,4],len:1100},leap:{name:'3音・とび',off:[0,4,7],len:1100}};
var OKC=35; /* 合っているとみなす幅（セント）。目安として置いた値 */

/* ---------- 表示の部品 ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tags(ev){return ev.map(function(e){return '<span class="tag '+e[0]+'">'+e[1]+'</span>';}).join(' ');}
function micNote(){
  if(micState!=='blocked') return '';
  return '<div class="warnbox"><b>このページではマイクが使えません。</b><br>Claudeのアプリの中で開いている場合、マイクは止められています。同じファイルをブラウザで直接開くと、声の判定が使えます。お手本の音と説明は、このままでも使えます。</div>';
}
function sgn(c){c=Math.round(c);return (c>0?'+':'')+c;}
function cls(c){return Math.abs(c)<=OKC?'c-ok':(c>0?'c-hi':'c-lo');}
function word(c){return Math.abs(c)<=OKC?'合っている':(c>0?'高い':'低い');}

/* ---------- きょう ---------- */
function vHome(){
  var d=day(), mm=menu(), wdone=mm.filter(function(id){return (d.menuDone||{})[id];}).length, psets=S.sets.filter(function(s){return s.d===today();}).length;
  var h='<section class="sheet"><h2>喉の調子は？</h2><div class="row">'+
    [['good','いい'],['ok','ふつう'],['bad','痛い・かれている']].map(function(o){return '<button class="btn line'+(d.throat===o[0]?' on':'')+'" data-act="throat" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  if(d.throat==='bad') h+='<div class="warnbox">今日は歌う練習を休みます。「基礎」のメニューも、軽い3つだけに変わります。痛みやかすれが2週間以上続くときは、耳鼻咽喉科で診てもらってください。</div>';
  h+='</section>'+vRoad();
  h+='<section class="sheet"><h2>きょうの練習</h2><div class="steps">'+
    '<div class="step"><span class="n">1</span><div class="t"><b>基礎のメニュー</b><small>体・息・喉・声区・響き・耳。その日の弱点に合わせて組みます</small></div><span class="done">'+wdone+' / '+mm.length+'</span><button class="btn sub" data-act="go" data-v="warm">開く</button></div>'+
    '<div class="step"><span class="n">2</span><div class="t"><b>歌って分析</b><small>10〜20秒歌うと、直すところを返します</small></div><span class="done">'+S.takes.filter(function(k){return k.d===today();}).length+' 回</span><button class="btn sub" data-act="go" data-v="sing">開く</button></div>'+
    '<div class="step"><span class="n">3</span><div class="t"><b>音程</b><small>5回で1セット。約3分</small></div><span class="done">'+psets+' セット</span><button class="btn sub" data-act="go" data-v="pitch">開く</button></div>'+
    '<div class="step"><span class="n">4</span><div class="t"><b>コツと仕組み</b><small>困りごと別のコツ図鑑と、体で試して身につけるレッスン</small></div><span class="done">'+(dueList().length?'復習 '+dueList().length+'問':doneCount()+' / '+LES.length)+'</span><button class="btn sub" data-act="go" data-v="learn">開く</button></div>'+
    '</div><p class="note">1日に長くやるより、短い練習を毎日のほうが身につきます（分散練習）。</p></section>';
  if(S.sets.length>=2){
    var a=S.sets[0], b=S.sets[S.sets.length-1];

var DHOW={
 posture:['首の後ろが伸び、頭が背骨の上に乗ると、首の前の筋肉が頭を支えなくてよくなります。喉のまわりの筋肉を、声を出すことだけに使えます。','胸を張りすぎたり、あごを引きすぎたりすると、逆に首が固まります。「楽に高い」くらいが目安です。'],
 release:['あごを閉じる筋肉と、喉を引き上げる筋肉はつながっています。あごがゆるむと、喉が上がりにくくなります。','強くもんだり、首を勢いよく回したりしません。痛みが出るほどやると逆効果です。'],
 tongue:['舌の付け根は、喉ぼとけの上の骨（舌骨）につながっています。付け根がゆるむと喉の位置が安定し、口の奥の空間も広がります。','強く引っぱりすぎると、付け根を痛めます。気持ちよく伸びる程度にします。'],
 inhale:['肋骨の間の筋肉で胸が横に広がると、肺に空気が入る余地が増えます。肩を上げる吸い方は首まわりの筋肉を使うので、喉に力みが残ります。','吸いすぎると、かえって息を押し出したくなり、喉が締まります。8割くらいで止めます。'],
 breath:['声帯の下の息の圧力が一定だと、声の高さと大きさが一定になります。細く一定に吐く練習は、その圧力の調整そのものの練習です。','長さを伸ばそうとして息を絞りすぎると、喉で息を止める癖がつきます。喉は開いたまま、体で量を調整します。'],
 pulse:['「スッ」で息を押す瞬間に、お腹まわりの筋肉が外へ張ります。その張りを長い息の間も保つと、肋骨がしぼむ速さをゆっくりにできます（息の支え）。','お腹を固めて押し込むと、喉にも力が入ります。張りは「外へ広がる」方向で、固めるのではありません。'],
 swell:['息の量をなめらかに変えられると、声の大きさもなめらかに変えられます。強弱の表現の土台です。','大きくするときに喉で押すと、音が上がり、声が固くなります。変えるのは息の量だけです。'],
 onset:['声帯が閉じ始める瞬間と、息が流れ始める瞬間が同時だと、息もれも、喉をぶつける音も出ません。','強く「っあ」と打ちつけると、声帯に負担がかかります。小さく、軽く、を守ります。'],
 three:['良い出だしだけを練習するより、悪い出だしと比べたほうが、違いを耳と体で区別できるようになります（対比による学習）。','喉を詰めた出だしは、数回だけにします。繰り返すと喉が疲れます。'],
 gug:['「グ」は、舌の奥と上あごの奥で息を一度止めてから離す音です。その瞬間に声帯もしっかり閉じ、離した後の「ウ」で喉の奥が開きます。閉じと開きを同時に覚えられます。','「グ」を強く言いすぎると喉が締まります。「グッ」は軽く、伸ばす音は楽に。'],
 flow:['声帯の閉じが弱すぎると息がもれ、強すぎると詰まった声になります。その間に、少ない息で大きく響く閉じ方があります（フロー発声）。息の音を少しずつ減らしていくと、その点を探せます。','息の音を消そうとして喉を締めないこと。締めると詰まった声になり、通りません。'],
 hum:['口を閉じると口の中の圧力が少し上がり、声帯が少ない力で振動します（半閉鎖声道の一種）。唇と鼻のあたりの振動が、響きが前に集まった手がかりになります。','鼻だけに響かせようとすると、鼻声になります。唇の振動も感じるようにします。'],
 siren:['口先を細くすると、口の中に圧力がたまり、それが声帯を下から支えます。声帯がぶつかる力が小さくなり、少ない力で振動します。そのため、地声と裏声の切り替えを、喉に負担をかけずに練習できます（Titze の研究）。','ストローに強く息を吹き込みすぎると、ほおが膨らみ、効果が減ります。ほおが膨らまない程度の息にします。'],
 water:['水の抵抗で、ストローよりさらに口の中の圧力が上がります。泡の出方を見れば、息が一定かどうかが目で分かります。','深く沈めすぎると、息を強く押す必要が出て、喉に力が入ります。2〜3cmにします。'],
 lip:['唇を震わせ続けるには、息の量が一定でなければなりません。唇で口先が狭まるので、ストローと同じく声帯の負担が減ります。','唇が止まるのを息の強さで押し切らないこと。止まるなら、指でほおを軽く押さえると震えやすくなります。'],
 falsetto:['裏声は、声帯を引き伸ばす筋肉が主に働く声です。この筋肉が弱いと、高い音を地声の筋肉だけで押し上げることになります。上から下ろすと、裏声の働きを保ったまま、地声の領域まで伸ばせます。','息を多く混ぜたかすれた裏声では、つなぎの練習になりにくいです。小さくても芯のある裏声にします。'],
 yodel:['声がひっくり返る場所は、地声の筋肉から裏声の筋肉へ、主役が急に入れ替わる場所です。わざと起こせるとその場所を自覚できるので、少しずつ入れ替える（段差なく通る）練習に進めます。','大きな声でひっくり返すと、喉に負担がかかります。中くらいの音量で。'],
 octslide:['1オクターブをなめらかにつなぐと、地声と裏声の筋肉の主役が、少しずつ入れ替わる練習になります。段差なく通れたら、つなぎ目が育っています。','上で裏返らないように力むのは逆効果です。裏返ってもいいので、軽さを優先します。'],
 nay:['「ン」で口を閉じてから始まるので、出だしが整います。「エ」は舌が前に出る母音で、舌の付け根が奥に引っこみません。意地悪な声にすると、喉の奥の上が少し狭まり（トワング）、小さな力で明るく通る声になります。','やりすぎると、きつく鼻にかかった声になります。感覚をつかんだら、歌では2〜3割だけ混ぜます。'],
 messa:['大きくするときは息の圧力と声帯の閉じを増やし、小さくするときは減らします。高さを変えずにこれができると、息と声帯の釣り合いを細かく調整できるようになります。','大きくするときに音が上がる・小さくするときに裏返るのは、喉で調整している印です。最初は音量の幅を小さくします。'],
 humopen:['口を閉じた「ん」は、響きが前に集まりやすい形です。そこから口を開けても響きの場所を保つと、「あ」でも前に響く感覚が作れます。','「あ」に開くときに、あごを大きく落としすぎると、響きが後ろに下がります。開きは指1〜2本分で十分です。'],
 twang:['喉の奥の上（喉頭蓋のまわり）が少し狭まると、2〜4kHzあたりの成分が強くなります。人の耳がいちばん敏感な帯域なので、小さな力で声が通ります（声の音響の研究で確かめられている）。','きつく、鼻にかかった声になったらやりすぎです。歌では2〜3割だけ混ぜます。'],
 vowels:['母音ごとに舌と口の形が変わり、響きの成分も変わります。響きの場所をそろえると、母音が変わっても声の質が変わらず、フレーズがなめらかに聞こえます。','そろえようとして全部の母音を同じ口の形にすると、言葉が聞き取れなくなります。そろえるのは響きで、母音は残します。'],
 jaw:['あごで言葉を作ると、あごの筋肉とつながる喉のまわりの筋肉が動き、喉の位置が揺れます。舌だけで言葉を作ると、喉が安定します。','あごを手で押さえつけると力みます。手は軽く添えるだけにします。'],
 ptk:['唇（パ）・舌先（タ）・舌の奥（カ）を順に速く動かす練習です。子音がはっきりすると言葉が伝わり、言葉の頭も拍にそろって聞こえます。','速さを上げるほど力みやすくなります。はっきり言える速さを優先します。'],
 vocalise:['子音のたびに息と声が途切れると、フレーズがぶつぶつ切れて聞こえます。先に母音だけでなめらかな線を作り、そこに子音を軽く乗せると、なめらかさを保てます。','母音だけで歌うと、音がずり上がったり、ずり下がったりしやすくなります。音と音の間は、すっと移ります。'],

    var r=E.rev.slice(-6), th=r.length?r.reduce(function(p,c){return p+c;},0)/r.length:E.d; D.val=th; D.goalOk=null; S.earTh=th;

    return;
  }

var TP=null;
var IMAP={pitch:'pitch',onset:'onset',wob:'steady',drift:'steady',high:'high',breathy:'breathy',dark:'dark',rhythm:'rhythm',dyn:'expr'};
function tipRate(id){ return ((S.tips||{})[id]||{}).r; }
function vTips(){
  if(!TP){ var k=S.takes[S.takes.length-1]; TP=k&&k.top.length&&IMAP[k.top[0]]?IMAP[k.top[0]]:'high'; }
  var list=TIPS.filter(function(t){return t.p===TP;}), ord=function(t){var r=tipRate(t.id);return r===1?0:r==null?1:r===0?2:3;};
  list.sort(function(a,b){return ord(a)-ord(b);});
  var h='<section class="sheet"><h2>コツ図鑑</h2><p class="note">'+TIPS.length+'個。困りごとを選ぶと、効くコツが出ます。効き方は人によって違うので、試したら「効いた」かどうかを残してください。効いたものが上に並びます。</p><div class="row">'+
    TPROB.map(function(p){return '<button class="btn line'+(TP===p[0]?' on':'')+'" style="padding:6px 12px" data-act="tipProb" data-v="'+p[0]+'">'+p[1]+'</button>';}).join('')+'</div>';
  h+=list.map(function(t){ var r=tipRate(t.id);
    return '<details'+(r===1?' open':'')+'><summary>'+t.n+(r===1?'　<span class="tag">自分に効いた</span>':r===-1?'　<span class="tag weak">合わなかった</span>':r===0?'　<span class="tag mid">変わらなかった</span>':'')+'</summary><div>'+
      '<dl class="kv"><dt>やり方</dt><dd>'+t.do+'</dd><dt>なぜ効くか</dt><dd>'+t.why+'</dd><dt>いつ使う</dt><dd>'+t.when+'</dd>'+(t.warn?'<dt>やりすぎると</dt><dd>'+t.warn+'</dd>':'')+'<dt>根拠</dt><dd>'+tags(t.ev)+'</dd></dl>'+
      '<div class="row">'+(t.drill?'<button class="btn sub" data-act="dOpen" data-v="'+t.drill+'">基礎で練習する</button>':'')+
      [[1,'効いた'],[0,'変わらない'],[-1,'合わない']].map(function(o){return '<button class="btn line'+(r===o[0]?' on':'')+'" style="padding:6px 12px" data-act="tipRate" data-v="'+t.id+'" data-r="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div></div></details>'; }).join('');
  return h+'</section>';
}
function tipsFor(issue){ var p=IMAP[issue]; if(!p) return ''; var l=TIPS.filter(function(t){return t.p===p&&tipRate(t.id)!==-1;}); l.sort(function(a,b){return (tipRate(b.id)===1)-(tipRate(a.id)===1);});
  return '<dt>効くコツ</dt><dd>'+l.slice(0,4).map(function(t){return '<button class="btn line" style="padding:4px 10px;margin:2px 4px 2px 0" data-act="tipOpen" data-v="'+p+'" data-t="'+t.id+'">'+t.n+(tipRate(t.id)===1?'（効いた）':'')+'</button>';}).join('')+'</dd>'; }

/* ---------- 曲練習 ----------
   1回の流れ：基礎の前半 → フレーズを切り出す → 段階を追って歌詞に近づける → 録音 → 止めずに通す → クールダウン。
   フレーズは「聞く → リズム読み → ストロー → 1つの音 → 母音 → ゆっくり歌詞 → 元の速さ → 録音」の8段。言葉・音・速さを一度に全部やらず、1つずつ足す */
var SSTEPS=[
 {n:'原曲を聞いて、頭の中で歌えるようにする',why:'頭の中でメロディーを鳴らせないと、声に出しても合わせる目標がありません。',how:'原曲のこのフレーズだけを5回聞きます。最後の2回は、声を出さずに頭の中で一緒に歌います。'},
 {n:'歌詞をリズムどおりに読む',why:'メロディーより先に、言葉のリズムを体に入れます。',how:'メロディーなしで、原曲に合わせて歌詞を読みます。足で拍を踏むとそろいやすくなります。子音は拍の少し前に置きます。'},
 {n:'ストローか唇ブルブルで通す',why:'喉の負担がいちばん小さい状態で、音の動きを先に覚えます（半閉鎖声道エクササイズ。研究で確かめられている）。',how:'ストローをくわえて「うー」で、または唇をブルブル震わせて、メロディーだけを歌います。高すぎる所は、1オクターブ下でかまいません。'},
 {n:'1つの音で歌う',why:'歌詞の子音や母音で喉の形が変わる前に、声の出し方を固めます。',how:''},
 {n:'母音だけで歌う',why:'子音で途切れない、なめらかな線を作ります。',how:'歌詞から子音を抜いて歌います（「きみのこえ」→「いおおえ」）。母音が変わっても、響きの場所を変えません。'},
 {n:'歌詞で、ゆっくり歌う',why:'1音ずつ正しい高さを確かめる時間を作ります。',how:'半分くらいの速さで、歌詞で歌います。前の段階の楽な出し方が崩れたら、1つ前に戻ります。'},
 {n:'元の速さで歌う',why:'本番の速さで同じように歌えるかを確かめます。',how:'原曲に合わせて歌います。慣れたら、ガイドの声なしのカラオケ → 伴奏なし、と外していきます（お手本に頼らないため）。'},
 {n:'録音して聞き比べる',why:'歌っている間の感覚は当てになりません。外から聞いて、直すところを1つだけ決めます。',how:'このフレーズを録音して、原曲と交互に聞きます。「歌って分析」にかけると、直すところとコツが出ます。'}
];
var SYL=[['ね','高い所が苦しい・こもる','舌が前に保たれ、明るく通ります。喉の締めつけを防ぎます。'],['ら','なめらかさ・リズム','舌先だけで言葉を作るので、あごが動かず、音がつながります。'],['ん','音程を合わせたい','声が小さく、ずれが聞き取りやすくなります。高い所は「う」に変えます。'],['ぐ','息もれ・芯がない','「グ」で声帯がしっかり閉じます。'],['ま','出だしをそろえたい','唇を閉じてから始まるので、出だしがそろいます。']];
var NONOTE=[
 ['flip','裏返る','地声から裏声への切り替わり（換声点）で、段差ができています。裏声では出ているので、音域の中に入っています。','まずその音を裏声のまま歌います。慣れたら「ね」や、泣きそうな声で、少しずつ芯を足します。切り替わりをなめらかにする練習を毎日続けます（数週間〜数か月の単位）。',['octslide','nay','falsetto']],
 ['breathy','かすれる・息になる','裏声が弱く、声帯が閉じきっていません。','裏声を鍛える練習と、「グッ・グッ・グー」で閉じる感覚を作ります。音量を下げすぎないようにします。',['falsetto','gug']],
 ['stuck','詰まる・苦しくて止まる','地声のまま、音量で押し上げています。押すほど声帯が固まり、届かなくなります。','その音だけ音量を下げます。「あ」を「お」寄りにします。あごを上げません。ストローで先に通してから、同じ楽さで歌います。',['siren','nay']],
 ['none','裏声でも出ない','今の音域の外です。','キーを下げます。無理に出そうとすると喉を痛めます。出せる音の上限は、練習で少しずつ広がります（数か月の単位）。',['siren','falsetto']]
];
var MARKS=[['V','息つぎ'],['↗','しゃくり'],['〜','ビブラート'],['＞','強く'],['↘','語尾を抜く']];
var SG=null;
function songs(){ return S.songs||(S.songs=[]); }
function song(){ return songs().filter(function(x){return x.id===SG.sid;})[0]; }
function phr(){ var s=song(); return s&&s.ph.filter(function(x){return x.id===SG.pid;})[0]; }
function stepsDone(p){ return p.st.filter(Boolean).length; }
function sCtx(){ var s=song(), p=SG&&SG.pid?phr():null; if(!s) return '';
  return '【いま曲練習中】曲：'+s.t+'（キー'+(s.key>0?'+':'')+s.key+'）'+(p?'\nフレーズ：「'+p.text+'」\nいまの段階：'+(p.st.indexOf(0)<0?'全部できた':SSTEPS[firstTodo(p)].n)+'（1つの音は「'+p.syl+'」）'+(SG.nn?'\n出ない音の様子：'+NONOTE.filter(function(x){return x[0]===SG.nn;})[0][1]:''):'')+(s.marks?'\n歌詞の印：'+s.marks:''); }
function firstTodo(p){ var i=p.st.indexOf(0); return i<0?SSTEPS.length-1:i; }
function vSongTop(){
  var h='<section class="sheet"><h2>曲練習</h2><p class="note">曲の苦しい所を1〜2フレーズ切り出して、段階を追って歌詞に近づけます。1曲まるごとを何回も歌うより、苦手な所を練習できる回数が増えます。</p>';
  if(songs().length) h+='<div class="steps">'+songs().map(function(s){var n=s.ph.length,d=s.ph.filter(function(p){return stepsDone(p)===SSTEPS.length;}).length;return '<div class="step"><div class="t"><b>'+esc(s.t)+'</b><small>フレーズ '+n+'（仕上がり '+d+'）・キー '+(s.key>0?'+':'')+s.key+'</small></div><button class="btn sub" data-act="sgOpen" data-v="'+s.id+'">開く</button></div>';}).join('')+'</div>';
  return h+'<div class="row"><input id="sgNew" type="text" placeholder="曲名" style="flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)"><button class="btn" data-act="sgAdd">曲を追加</button></div></section>';
}
function vSong(){
  var s=song(); if(!s){ SG=null; return vSing(); }
  if(SG.nn!=null&&!SG.pid) return vNoNote();
  if(SG.pid) return vPhrase();
  var h='<section class="sheet"><div class="row" style="justify-content:space-between"><span class="code">曲練習</span><button class="btn line" style="padding:4px 10px" data-act="sgBack">一覧へ</button></div><h2>'+esc(s.t)+'</h2>';
  h+='<h3>1回の練習の流れ</h3><ol style="margin:0;padding-left:1.4em;font-size:var(--t-s)"><li>基礎のメニューの前半（体・息・ストロー）を5分 <button class="btn line" style="padding:2px 10px" data-act="go" data-v="warm">基礎へ</button></li><li>苦しいフレーズを1〜2つ選んで、下の段階を進める</li><li>録音して原曲と聞き比べる。直すのは1つだけ</li><li>最後に、間違えても止めずに1曲通す</li><li>クールダウン <button class="btn line" style="padding:2px 10px" data-act="dOpen" data-v="cooldown">開く</button></li></ol>';
  h+='<h3>キー</h3><div class="row"><button class="btn line" data-act="sgKey" data-v="-1">下げる</button><b style="font:600 var(--t-l) var(--f-code);min-width:3em;text-align:center">'+(s.key>0?'+':'')+s.key+'</b><button class="btn line" data-act="sgKey" data-v="1">上げる</button></div><p class="note">カラオケのキー変更の数です。苦しいキーのまま練習すると喉を締める癖がつくので、楽に歌える所まで下げます。正しい出し方ができたら、少しずつ上げます。'+(S.range?'あなたの音域：'+nname(S.range.lo)+'〜'+nname(S.range.hi)+'。':'')+'</p>';
  h+='<h3>フレーズ</h3>'+(s.ph.length?'<div class="steps">'+s.ph.map(function(p){var d=stepsDone(p);return '<div class="step"><div class="t"><b>'+esc(p.text)+'</b><small>'+(d===SSTEPS.length?'仕上がり':'段階 '+(firstTodo(p)+1)+' / '+SSTEPS.length+'：'+SSTEPS[firstTodo(p)].n)+'</small></div><button class="btn sub" data-act="phOpen" data-v="'+p.id+'">練習</button></div>';}).join('')+'</div>':'<p class="note">苦しい所の歌詞を、1フレーズずつ追加します。</p>')+
    '<div class="row"><input id="phNew" type="text" placeholder="フレーズの歌詞" style="flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)"><button class="btn" data-act="phAdd">追加</button></div>';
  h+='<h3>出ない音がある</h3><div class="row"><button class="btn line" data-act="nnOpen">出ない音の対処</button></div>';
  h+='<h3>歌詞の印</h3><p class="note">歌詞を貼り、息つぎや表現の場所に印をつけます。毎回ばらばらにならず、決めた通りに歌えます。</p><div class="row">'+MARKS.map(function(m){return '<button class="btn line" style="padding:4px 10px" data-act="mkIns" data-v="'+m[0]+'">'+m[0]+' '+m[1]+'</button>';}).join('')+'</div><textarea id="marks" style="min-height:140px">'+esc(s.marks||'')+'</textarea><div class="row"><button class="btn sub" data-act="mkSave">印を保存</button></div>';
  h+='<h3>止めずに通す</h3><p class="note">本番は止められません。練習の最後に1回、間違えても止めずに通します。</p><div class="row"><button class="btn" data-act="sgRun">止めずに通した</button><span class="note">'+(s.runs.length?'これまで '+s.runs.length+'回（最後：'+s.runs[s.runs.length-1].slice(5)+'）':'まだ')+'</span></div>';
  h+='<details><summary>曲の練習で使える定番のやり方</summary><div><ul><li><b>1オクターブ下で歌う：</b>高くて届かない所を、まず1オクターブ下でメロディーだけ覚えます。</li><li><b>後ろから練習する：</b>フレーズの最後の数語から練習し、1語ずつ前に足します。崩れやすい終わりが安定します。</li><li><b>歌手をまねる：</b>1フレーズを、息つぎ・しゃくり・語尾までそっくりまねます。技術を盗めます。</li><li><b>小さい声で覚える：</b>覚える段階は半分の声で。喉を疲れさせずに回数を増やせます。</li><li><b>頭の中だけで歌う：</b>喉を休める日の練習になります（イメージ練習の効果は研究で確かめられている）。</li><li><b>立って歌う・動画で見る：</b>あごや肩の癖は、自分では気づけません。</li><li><b>採点の音程バーを見ない回を作る：</b>画面のない本番でも合わせられるようにします。</li></ul></div></details>';
  return h+'<div class="row"><button class="btn line" data-act="sgDel">この曲を消す</button>'+(SG.del?'<button class="btn" style="background:var(--bad)" data-act="sgDelYes">本当に消す</button>':'')+'</div></section>'+vAsk('song:'+s.id,sCtx,'s');
}
function vPhrase(){
  var s=song(), p=phr(); if(!p){ SG.pid=null; return vSong(); }
  var cur=SG.step!=null?SG.step:firstTodo(p);
  var h='<section class="sheet"><div class="row" style="justify-content:space-between"><span class="code">'+esc(s.t)+'</span><button class="btn line" style="padding:4px 10px" data-act="phBack">曲へ</button></div><h2>「'+esc(p.text)+'」</h2><div class="steps">';
  SSTEPS.forEach(function(st,i){
    var on=i===cur;
    h+='<div class="step" style="flex-direction:column;align-items:stretch;'+(on?'border-color:var(--accent)':'')+'"><div class="row" style="justify-content:space-between"><div class="t"><b>'+(i+1)+'. '+(i===3?'「'+p.syl+'」で歌う':st.n)+'</b></div>'+(p.st[i]?'<span class="tag">できた</span>':'')+(on?'':'<button class="btn line" style="padding:2px 10px" data-act="phStep" data-v="'+i+'">開く</button>')+'</div>';
    if(on){
      if(i===3){ var sy=SYL.filter(function(x){return x[0]===p.syl;})[0]; h+='<div class="row">'+SYL.map(function(x){return '<button class="btn line'+(p.syl===x[0]?' on':'')+'" style="padding:4px 10px" data-act="phSyl" data-v="'+x[0]+'">「'+x[0]+'」'+x[1]+'</button>';}).join('')+'</div><p style="font-size:var(--t-s)">メロディーを全部「'+p.syl+'」で歌います。'+sy[2]+'</p>'; }
      else h+='<p style="font-size:var(--t-s)">'+st.how+'</p>';
      h+='<p class="note">なぜ：'+st.why+'</p>';
      if(i===7) h+='<div class="row"><button class="btn sub" data-act="go" data-v="sing">歌って分析へ</button></div>';
      h+='<div class="row"><button class="btn" data-act="phDone" data-v="'+i+'">できた</button><button class="btn line" data-act="phNot" data-v="'+i+'">うまくいかない</button></div>';
      if(SG.help===i){
        h+='<div class="why"><b>うまくいかないとき</b>'+(i===0?'もっと短く区切ります。1〜2語ずつ聞いて、頭の中で鳴らせるまで繰り返します。':i===1?'速さを落として読みます。足の拍を先に安定させてから、言葉を乗せます。':'1つ前の段階に戻ります。'+(i>=2?'高くて出ない音がある場合は、下の「出ない音の対処」を見ます。キーを下げる、1オクターブ下で歌う、も使えます。':''))+'</div>'+(i>=2?'<div class="row"><button class="btn line" data-act="nnOpen">出ない音の対処</button>'+(i>0?'<button class="btn line" data-act="phStep" data-v="'+(i-1)+'">1つ前に戻る</button>':'')+'</div>':'');
      }
    }

function rangeGo(step){
  stopAll(); var my=runId; R=R||{}; R.step=step; R.msg='';
  micOn().then(function(mic){
    if(my!==runId) return;
    if(!mic){ R={msg:'マイクが使えないので、下の「測らずに選ぶ」から選んでください。'}; render(); return; }
    R.phase='run'; render();
    capture(3000,function(t,r){ var b=document.getElementById('bar'); if(b) b.style.width=Math.min(100,t/30)+'%'; var hd=document.getElementById('hear'); if(hd){hd.className='hear'+(r.f?' on':'');hd.textContent=r.f?nname(f2m(r.f)):'声を待っています';} }).then(function(fr){
      var ms=fr.filter(function(x){return x.f>0;}).map(function(x){return f2m(x.f);});
      if(ms.length<20){ R={msg:'声を拾えませんでした。マイクに近づいて、もう一度試します。'}; render(); return; }
      var m=Math.round(median(ms));
      if(step==='lo'){ R={lo:m,phase:'mid'}; render(); }
      else{ var lo=R.lo, hi=Math.max(m,lo+7); S.range={lo:lo,hi:hi}; save(); R=null; render(); }
    });
  });
}

  else{
    if(CH.err) h+='<div class="warnbox">'+CH.err+'</div>';
    if(M&&!CH.turns.length) h+='<div class="row"><button class="btn big" data-act="aiCoach">今回の歌を見てもらう</button></div>';
    h+='<label class="note" for="q">質問する（例：サビの高い音で喉が締まる。どう練習すればいい？）</label><textarea id="q"></textarea><div class="row"><button class="btn sub" data-act="aiAsk">送る</button>'+(CH.turns.length?'<button class="btn line" data-act="aiClear">会話を消す</button>':'')+'</div>';
  }
  return h+'</section>';
}
function ask(text){
  if(!AI||CH.busy) return;
  CH.turns.push({role:'user',content:text}); CH.turns=CH.turns.slice(-12); if(CH.turns[0].role!=='user') CH.turns.shift();
  CH.busy=true; CH.err=''; render(); aiCtl=new AbortController();
  var push=function(t){ if(t) CH.turns.push({role:'assistant',content:t}); else CH.turns.pop(); };
  AI([{role:'user',content:RULES+'\n'+ctxText()+(ASKCTX?'\n'+ASKCTX()+'\n【この質問について】練習の途中で聞かれています。150〜300字で、すぐ試せることを先に書きます。':'')}].concat(CH.turns),{cache:false,signal:aiCtl.signal,onText:function(o){var el=document.getElementById('aiout'); if(el) el.textContent=o.text;}})
   .then(function(r){ push(r.text); },function(e){ push(e&&e.text);
     if(e&&e.code==='not_granted'){ AI=null; }
     else if(e&&e.code==='rate_limited') CH.err='少し時間をおいてから、もう一度送ってください。';
     else if(!e||e.code!=='cancelled') CH.err='Claudeから答えを受け取れませんでした。もう一度送ってください。'; })
   .then(function(){ CH.busy=false; render(); });
}
if(window.claude&&typeof window.claude.use==='function'){ try{ window.claude.use('sample').then(function(f){ if(f){AI=f; render();} },function(){}); }catch(e){} }
document.addEventListener('change',function(e){ if(e.target.id==='bpm'){ S.bpm=Math.max(50,Math.min(200,+e.target.value||90)); save(); } if(e.target.id==='file'&&e.target.files[0]) singFile(e.target.files[0]); });
render();
})();
</script>
