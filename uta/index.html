<style>
/* チューナーの画面：1列のカード、中心に「音の高さのレーン」。合っている=青緑、高い=橙、低い=青。下に5つのタブ */
:root{
  --bg:#f3f6f6; --sheet:#ffffff; --ink:#14232a; --muted:#566a72; --rule:#d3dddf;
  --accent:#0b7a80; --accent-soft:#dff1f1; --hi:#b8530a; --hi-soft:#fbe9d8; --lo:#2c5bd0; --lo-soft:#e2e9fb; --bad:#b3261e;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-code:"M PLUS 1 Code","Hiragino Sans",ui-monospace,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --t-xs:12px;--t-s:14px;--t-m:16px;--t-l:19px;--t-xl:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --sheet:#162125; --ink:#e4eef0; --muted:#93a8ae; --rule:#29383d;
  --accent:#5fd0d2; --accent-soft:#143436; --hi:#f2a45f; --hi-soft:#3a2713; --lo:#8fb0ff; --lo-soft:#1b2745; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --sheet:#162125; --ink:#e4eef0; --muted:#93a8ae; --rule:#29383d;
  --accent:#5fd0d2; --accent-soft:#143436; --hi:#f2a45f; --hi-soft:#3a2713; --lo:#8fb0ff; --lo-soft:#1b2745; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-m)/1.75 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) 110px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:var(--t-xl);font-weight:700;letter-spacing:.04em}
h2{font-size:var(--t-l);font-weight:700}
h3{font-size:var(--t-m);font-weight:700}
p{margin:0}
ul{margin:0;padding-left:1.2em}
.code{font-family:var(--f-code);font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted)}
header.top,main{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
main{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.note{font-size:var(--t-s);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.btn{all:unset;cursor:pointer;padding:11px 18px;border-radius:9px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:var(--t-s);text-align:center}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.btn.on{background:var(--accent);color:var(--sheet);box-shadow:none}
.btn.big{padding:14px 22px;font-size:var(--t-m);flex:1 1 auto}
.btn:focus-visible,summary:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;font:600 11px var(--f-code);letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.weak{background:var(--hi-soft);color:var(--hi)}
.tag.mid{background:var(--lo-soft);color:var(--lo)}
.why{border-left:3px solid var(--accent);background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:0 8px 8px 0;font-size:var(--t-s)}
.why b{display:block;font:600 11px var(--f-code);letter-spacing:.1em;color:var(--accent)}
.warnbox{border:1px solid var(--hi);background:var(--hi-soft);color:var(--ink);padding:var(--s3) var(--s4);border-radius:8px;font-size:var(--t-s)}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s3);font-size:var(--t-s)}
dl.kv dt{font-weight:700;color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0}
details{border-top:1px solid var(--rule);padding-top:var(--s2)}
details>summary{cursor:pointer;font-weight:700;font-size:var(--t-s);color:var(--accent);border-radius:4px}
details>div{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2);font-size:var(--t-s)}
.steps{display:flex;flex-direction:column;gap:var(--s2)}
.step{display:flex;gap:var(--s3);align-items:center;padding:var(--s3);border:1px solid var(--rule);border-radius:10px}
.step .n{font:600 var(--t-s) var(--f-code);color:var(--muted);width:20px}
.step .t{flex:1;min-width:0}
.step .t small{display:block;color:var(--muted);font-size:var(--t-xs);line-height:1.5}
.step .done{font:600 var(--t-xs) var(--f-code);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.notes{display:flex;gap:var(--s2);justify-content:center}
.notes span{font:600 var(--t-l) var(--f-code);padding:6px 14px;border-radius:9px;border:1px solid var(--rule);color:var(--muted)}
.notes span.on{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.phase{text-align:center;font-weight:700;font-size:var(--t-l)}
.hear{text-align:center;font:600 var(--t-xs) var(--f-code);color:var(--muted)}
.hear.on{color:var(--accent)}
canvas.lane{width:100%;height:190px;display:block;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.nums div{border:1px solid var(--rule);border-radius:10px;padding:var(--s2) var(--s3);min-width:0}
.nums small{display:block;font-size:var(--t-xs);color:var(--muted);line-height:1.4}
.nums b{font:600 var(--t-l) var(--f-code);font-variant-numeric:tabular-nums}
.c-ok{color:var(--accent)}.c-hi{color:var(--hi)}.c-lo{color:var(--lo)}
table{border-collapse:collapse;width:100%;font-size:var(--t-s);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
th{font-size:var(--t-xs);color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{all:unset;cursor:pointer;flex:1 1 0;max-width:128px;text-align:center;padding:8px 2px;border-radius:9px;font-size:var(--t-xs);font-weight:700;color:var(--muted)}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.beat{width:30px;height:30px;border-radius:50%;margin:0 auto;background:var(--rule)}
.beat.on{background:var(--accent)}
.msg{white-space:pre-wrap;padding:var(--s3);border-radius:10px;font-size:var(--t-s);border:1px solid var(--rule)}
.msg.me{background:var(--accent-soft);border-color:transparent;margin-left:var(--s5)}
textarea,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:72px;resize:vertical}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .1s linear}}
</style>

<script>
(function(){
"use strict";
/* ---------- 状態 ---------- */
var KEY='uta-lab-v1';
var S={range:null,stage:1,pattern:'single',sets:[],days:{},est:[],takes:[]};
try{var raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function day(){var k=today(); if(!S.days[k]) S.days[k]={warm:{}}; if(!S.days[k].warm) S.days[k].warm={}; return S.days[k];}
var tab='home', runId=0, raf=0, micState='unknown';
var W=null;   /* 準備の進行 */
var T=null;   /* 音程の1回 */
var SET=null; /* 音程の5回1セット */
var R=null;   /* 音域の測定 */
var wipe=false;
var K=null;   /* 歌って分析 */
var view=document.getElementById('view');

/* ---------- 音 ---------- */
var ac=null, analyser=null, buf=null, yd=null, micStream=null, capStop=false, capFull=false;
function ensureAC(){ if(!ac){var C=window.AudioContext||window.webkitAudioContext; ac=new C();} if(ac.state==='suspended') ac.resume(); return ac; }
function micOn(){
  if(analyser) return Promise.resolve(true);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micState='blocked';return Promise.resolve(false);}
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
    micStream=st; ensureAC(); var src=ac.createMediaStreamSource(st); analyser=ac.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    buf=new Float32Array(2048); micState='ok'; return true;
  }).catch(function(){micState='blocked';return false;});
}
/* YIN法（de Cheveigné & Kawahara, 2002）で声の高さを求める */
function yin(b,sr){
  var n=b.length, half=n>>1, i, tau, rms=0;
  for(i=0;i<n;i++) rms+=b[i]*b[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.008) return {f:0,rms:rms};
  var tMin=Math.max(2,Math.floor(sr/1100)), tMax=Math.min(half-2,Math.floor(sr/65));
  if(!yd||yd.length<tMax+2) yd=new Float32Array(tMax+2);
  var run=0; yd[0]=1;
  for(tau=1;tau<=tMax+1;tau++){
    var s=0; for(i=0;i<half;i++){var d=b[i]-b[i+tau]; s+=d*d;}
    run+=s; yd[tau]=run>0? s*tau/run : 1;
  }
  var best=-1;
  for(tau=tMin;tau<=tMax;tau++){ if(yd[tau]<0.15){ while(tau+1<=tMax&&yd[tau+1]<yd[tau]) tau++; best=tau; break; } }
  if(best<0){ var mn=1; for(tau=tMin;tau<=tMax;tau++){ if(yd[tau]<mn){mn=yd[tau];best=tau;} } if(mn>0.35) return {f:0,rms:rms}; }
  var a=yd[best-1], c0=yd[best], c=yd[best+1], den=a-2*c0+c, sh=den? 0.5*(a-c)/den : 0;
  if(sh>1||sh<-1) sh=0;
  return {f:sr/(best+sh),rms:rms,ap:c0};
}
function detect(){ if(!analyser) return {f:0,rms:0}; analyser.getFloatTimeDomainData(buf); return yin(buf,ac.sampleRate); }
function tone(m,ms,when){
  ensureAC(); var t=ac.currentTime+(when||0)/1000, d=ms/1000;
  var o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.28,t+0.03); g.gain.setValueAtTime(0.28,t+Math.max(0.03,d-0.12)); g.gain.linearRampToValueAtTime(0,t+Math.max(0.05,d-0.02));
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
}
function f2m(f){return 69+12*Math.log(f/440)/Math.LN2;}
var NN=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
function nname(m){m=Math.round(m);return NN[((m%12)+12)%12]+(Math.floor(m/12)-1);}
function median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}), h=s.length>>1; return s.length%2? s[h] : (s[h-1]+s[h])/2; }
function pct(a,p){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}); return s[Math.min(s.length-1,Math.floor(p*s.length))]; }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* ms の間、毎フレーム声を調べる。mic が無いときは時間だけ進める */
function capture(ms,onFrame){
  return new Promise(function(res){
    var fr=[], t0=performance.now(), my=runId; capStop=false;
    (function tick(){
      if(my!==runId) return;
      var t=performance.now()-t0, r=detect();
      if(capFull&&r.f) r.spr=sprOf(buf,ac.sampleRate);
      fr.push({t:t,f:r.f,rms:r.rms,ap:r.ap,spr:r.spr});
      if(onFrame) onFrame(t,r,fr);
      if(t<ms&&!capStop) raf=requestAnimationFrame(tick); else res(fr);
    })();
  });
}
function stopAll(){ runId++; cancelAnimationFrame(raf); }

/* ---------- 中身：準備の3つ ---------- */
var WARM=[
 {id:'breath',name:'息を一定に吐く',sub:'「スー」と細く、15秒',ms:15000,mic:true,
  why:'音程のぶれを減らし、声に芯を作る土台です。',
  how:'声の高さと大きさは、声帯の下にかかる息の圧力で決まります。圧力が揺れると、音程も声の大きさも揺れます。',
  tip:'吸ったときに広がった肋骨とお腹まわりを、吐いている間すぐにしぼませません。遠くのろうそくの火を、消さずに揺らし続けるつもりで吐きます。',
  check:'最後まで同じ強さで吐けた。',
  ev:[['','仕組みは確立された知識'],['mid','練習法は伝統的な指導法（支え）']]},
 {id:'siren',name:'ストローでサイレン',sub:'低い音から高い音へ行き来、60秒',ms:60000,mic:true,
  why:'喉の締めつけを取り、地声と裏声をつなぎます。高い音の土台です。',
  how:'口先を細くすると口の中の圧力が上がり、声帯が少ない力で振動します。喉に負担をかけずに声帯を伸ばす練習ができます（半閉鎖声道エクササイズ、Titze）。',
  tip:'ストローをくわえて「うー」と、救急車のサイレンのように上下します。高いところほど小さく軽く出します。途中で裏返ってかまいません。ストローがなければ、唇をブルブル震わせるか、口をすぼめた「うー」でも代わりになります。',
  check:'喉が痛くない。終わった後に声が軽く出る。',
  ev:[['','研究で効果が確かめられている']]},
 {id:'onset',name:'出だしをそろえる',sub:'小さく短く「あ、あ、あ」、30秒',ms:30000,mic:false,
  why:'一声目の印象を作る練習です。',
  how:'息と声帯の閉じが同時に始まると、息もれもぶつけた音もない出だしになります。',
  tip:'小さな声で短く「あ」を続けます。息が先に出る「は」にも、喉を詰めた「っあ」にもしません。机の上に、指でそっと点を置くつもりで出します。',
  check:'出だしに息の音も、喉の詰まる音もない。',
  ev:[['','仕組みは確立された知識'],['mid','イメージは指導法']]}
];
var STAGE={1:['見ながら合わせる','歌っている間、声の高さが見えます。'],2:['歌った後に見る','歌っている間は見えません。終わってから答え合わせをします。'],3:['先に自分で当てる','答えを見る前に、高かったか低かったかを自分で言います。']};
var PAT={single:{name:'1音',off:[0],len:2500},step:{name:'3音・となり',off:[0,2,4],len:1100},leap:{name:'3音・とび',off:[0,4,7],len:1100}};
var OKC=35; /* 合っているとみなす幅（セント）。目安として置いた値 */

/* ---------- 表示の部品 ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tags(ev){return ev.map(function(e){return '<span class="tag '+e[0]+'">'+e[1]+'</span>';}).join(' ');}
function micNote(){
  if(micState!=='blocked') return '';
  return '<div class="warnbox"><b>このページではマイクが使えません。</b><br>Claudeのアプリの中で開いている場合、マイクは止められています。同じファイルをブラウザで直接開くと、声の判定が使えます。お手本の音と説明は、このままでも使えます。</div>';
}
function sgn(c){c=Math.round(c);return (c>0?'+':'')+c;}
function cls(c){return Math.abs(c)<=OKC?'c-ok':(c>0?'c-hi':'c-lo');}
function word(c){return Math.abs(c)<=OKC?'合っている':(c>0?'高い':'低い');}

/* ---------- きょう ---------- */
function vHome(){
  var d=day(), mm=menu(), wdone=mm.filter(function(id){return (d.menuDone||{})[id];}).length, psets=S.sets.filter(function(s){return s.d===today();}).length;
  var h='<section class="sheet"><h2>喉の調子は？</h2><div class="row">'+
    [['good','いい'],['ok','ふつう'],['bad','痛い・かれている']].map(function(o){return '<button class="btn line'+(d.throat===o[0]?' on':'')+'" data-act="throat" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  if(d.throat==='bad') h+='<div class="warnbox">今日は歌う練習を休みます。「基礎」のメニューも、軽い3つだけに変わります。痛みやかすれが2週間以上続くときは、耳鼻咽喉科で診てもらってください。</div>';
  h+='</section>'+vRoad();
  h+='<section class="sheet"><h2>きょうの練習</h2><div class="steps">'+
    '<div class="step"><span class="n">1</span><div class="t"><b>基礎のメニュー</b><small>体・息・喉・声区・響き・耳。その日の弱点に合わせて組みます</small></div><span class="done">'+wdone+' / '+mm.length+'</span><button class="btn sub" data-act="go" data-v="warm">開く</button></div>'+
    '<div class="step"><span class="n">2</span><div class="t"><b>歌って分析</b><small>10〜20秒歌うと、直すところを返します</small></div><span class="done">'+S.takes.filter(function(k){return k.d===today();}).length+' 回</span><button class="btn sub" data-act="go" data-v="sing">開く</button></div>'+
    '<div class="step"><span class="n">3</span><div class="t"><b>音程</b><small>5回で1セット。約3分</small></div><span class="done">'+psets+' セット</span><button class="btn sub" data-act="go" data-v="pitch">開く</button></div>'+
    '<div class="step"><span class="n">4</span><div class="t"><b>仕組み</b><small>予想して、体で試して、日をあけて思い出す</small></div><span class="done">'+(dueList().length?'復習 '+dueList().length+'問':doneCount()+' / '+LES.length)+'</span><button class="btn sub" data-act="go" data-v="learn">開く</button></div>'+
    '</div><p class="note">1日に長くやるより、短い練習を毎日のほうが身につきます（分散練習）。</p></section>';
  if(S.sets.length>=2){
    var a=S.sets[0], b=S.sets[S.sets.length-1];

var F=null, FL={start:'出だし',pitch:'音程',core:'芯',ring:'響き'};
function barCb(ms){ return function(t,r){ var b=document.getElementById('bar'); if(b) b.style.width=Math.min(100,t/ms*100)+'%'; var hd=document.getElementById('hear'); if(hd){var on=r.rms>0.006;hd.className='hear'+(on?' on':'');hd.textContent=on?'聞こえています':'声を待っています';} }; }
function firstNote(fr,target){
  var i,vs=-1; for(i=0;i<fr.length-3;i++){ if(fr[i].f&&fr[i+1].f&&fr[i+2].f){vs=i;break;} }
  if(vs<0) return {heard:false};
  var ns=vs; for(i=vs-1;i>=0;i--){ if(fr[i].rms>0.006) ns=i; else break; }
  var pre=fr[vs].t-fr[ns].t, t0=fr[vs].t;
  var v=fr.slice(vs).filter(function(x){return x.f>0&&x.t<t0+1200;}).map(function(x){return {t:x.t-t0,c:(f2m(x.f)-target)*100,ap:x.ap||0,spr:x.spr};});
  var med=median(v.map(function(x){return x.c;})), oct=Math.abs(med)>800?Math.round(med/1200):0;
  v.forEach(function(x){x.c-=oct*1200;}); v=v.filter(function(x){return Math.abs(x.c)<600;});
  if(v.length<12) return {heard:false};
  var cs=function(a){return a.map(function(x){return x.c;});}, on=v.filter(function(x){return x.t<120;}), bd=v.filter(function(x){return x.t>=150&&x.t<900;});
  if(bd.length<5) bd=v; if(!on.length) on=v.slice(0,3);
  var body=median(cs(bd)), onset=median(cs(on)), wob=median(cs(bd).map(function(c){return Math.abs(c-body);}))*1.48;
  var ap=median(v.filter(function(x){return x.t<600;}).map(function(x){return x.ap;}))*100, sp=v.filter(function(x){return x.spr!=null;}).map(function(x){return x.spr;}), spr=sp.length?median(sp):-60;
  var ck={start:Math.abs(onset)<=35&&onset-body>-35,pitch:Math.abs(body)<=25&&wob<=20,core:ap<=6&&pre<=120,ring:spr>=-27}, cue;
  if(!ck.core) cue=pre>120?'声より先に、息が約'+Math.round(pre)+'ミリ秒出ています。息と声を同時に始めます。机の上に、指でそっと点を置くつもりで入ります。':'声に息が混ざっています。短く「グッ」と言うときの閉じ方のまま、歌い出します。';
  else if(!ck.start) cue=onset-body<=-35?'下からずり上げて入っています（出だしが'+Math.round(body-onset)+'セント低い）。イントロの音を頭の中で鳴らし続けて、その音の上に乗るつもりで入ります。':'出だしの高さが'+(onset>0?'高く':'低く')+'外れています。歌い出す前に、頭の中で最初の音をはっきり鳴らします。';
  else if(!ck.pitch) cue=Math.abs(body)>25?'入った後の高さが、'+Math.abs(Math.round(body))+'セント'+(body>0?'高い':'低い')+'です。'+(body>0?'力を抜いて、音量を少し下げます。':'肋骨をしぼませずに、音の少し上に乗ります。'):'入った後に、音が揺れています。「スー」と吐くときと同じ、一定の息で伸ばします。';
  else if(!ck.ring) cue='こもっています。舌の先を下の前歯につけて、声を前歯の先から前に出すつもりで入ります。';
  else cue='4つともそろいました。同じ出し方を、もう一度出します。';
  return {heard:true,ck:ck,all:ck.start&&ck.pitch&&ck.core&&ck.ring,cue:cue};
}
function firstSet(){
  stopAll(); var my=runId;
  micOn().then(function(mic){
    if(my!==runId||!F) return;
    if(!mic){ F.phase='set'; render(); return; }
    F.phase='setrun'; render();
    capture(3000,barCb(3000)).then(function(fr){
      var ms=fr.filter(function(x){return x.f>0;}).map(function(x){return f2m(x.f);});
      if(ms.length<20){ F.phase='set'; F.msg='声を拾えませんでした。マイクに近づいて、もう一度録ります。'; }
      else{ S.firstT=median(ms); save(); F.phase='ready'; F.msg=''; }
      render();
    });
  });
}
function firstGo(){
  stopAll(); var my=runId;
  micOn().then(function(mic){
    if(my!==runId||!F) return;
    if(!mic){ F.phase='set'; render(); return; }
    F.phase='listen'; render(); tone(S.firstT,900);
    sleep(1300).then(function(){
      if(my!==runId) return;
      F.phase='run'; render(); capFull=true;
      capture(2400,barCb(2400)).then(function(fr){ capFull=false; F.cur=firstNote(fr,S.firstT); if(F.cur.heard) F.reps.push(F.cur); F.phase='res'; render(); });
    });
  });
}

function setHear(r){ var hd=document.getElementById('hear'); if(hd){var on=r.rms>0.006;hd.className='hear'+(on?' on':'');hd.textContent=on?(r.f?'聞こえています（'+nname(f2m(r.f))+'）':'聞こえています'):'';} }

function dGo(){
  stopAll(); var my=runId, x=DRI[D.id], L=x.lv[D.lv-1];
  D.phase='run'; D.msg=''; D.ck={}; D.val=null; D.goalOk=null;
  if(x.ear){ D.E={d:100,streak:0,rev:[],last:0,n:0}; render(); earNext(); return; }
  ensureAC();
  (x.met||L.sc||L.beat? micOn() : Promise.resolve(false)).then(function(mic){
    if(my!==runId) return; render();

function finishDrill(msg){ D.phase='done'; D.msg=msg||''; day().warm=day().warm||{}; day().warm[D.id]=true; save(); render(); }
function runTimed(x,L,mic,my){
  if(L.click){ var b=60000/L.click; for(var t=0;t<L.ms;t+=b) tone(96,60,t); }
  if(mic&&x.met) capFull=true;
  capture(L.ms,function(t,r){ setBar(t/L.ms); if(mic) setHear(r); }).then(function(fr){
    capFull=false; if(my!==runId) return;
    var msg='';
    if(mic&&x.met){ var v=MET[x.met].f(fr);
      if(v==null) msg='声を拾えませんでした。マイクに近づいて、もう一度試せます。';
      else{ D.val=v; msg=MET[x.met].name+'：<b>'+MET[x.met].fmt(v)+'</b>';
        if(x.met==='hi'){ day().sirenHi=Math.max(day().sirenHi||0,Math.round(v)); msg+='。日ごとに少しずつ上がれば、高い音の土台ができています。'; }

function runScale(sc,mic,my){
  var P=PATS[sc.p], nd=60000/P.bpm, roots=scReps(sc), measure=mic&&(sc.mode!=='with'||S.phones), hits=0, tot=0, hiMax=0, i=0;
  (function rep(){
    if(my!==runId) return;
    if(i>=roots.length){
      var msg=measure&&tot>20?'お手本の音に合っていた割合：<b>'+Math.round(hits/tot*100)+'%</b>（±50セント以内）。届いたいちばん上の音：'+nname(hiMax)+'。':(mic?'':'マイクが使えないので、判定はしていません。');
      if(measure&&tot>20){ D.val=hits/tot*100; D.goalOk=D.val>=(sc.mode==='first'?50:60); msg+=D.goalOk?'目安を満たしました。':'目安は'+(sc.mode==='first'?50:60)+'%です。'; day().sirenHi=Math.max(day().sirenHi||0,Math.round(hiMax)); }
      else if(mic&&sc.mode==='with'&&!S.phones) msg='スピーカーで鳴らしたので、判定はしていません。イヤホンを使うか、段階2（聞いてから歌う）で判定できます。';
      finishDrill(msg); return;
    }
    var root=roots[i], ns=P.n.map(function(o){return root+o;}), len=ns.length*nd, lead=0;
    setTxt('drep',(i+1)+' / '+roots.length+'　'+nname(root)+' から');
    if(sc.mode==='first'){ tone(root,700); lead=1000; }
    else{ ns.forEach(function(m,j){tone(m,nd-30,j*nd);}); if(sc.mode==='echo') lead=len+350; }
    setTxt('dph',sc.mode==='with'?'一緒に歌う':'聞く');
    var t0=performance.now();
    (function hl(){ if(my!==runId) return; var t=performance.now()-t0; if(t<lead||sc.mode==='with'){ var j=Math.floor((sc.mode==='with'?t:t)/nd); if(sc.mode!=='first'&&j<ns.length) setTxt('dnote',nname(ns[j])); } if(t<lead) requestAnimationFrame(hl); })();
    sleep(sc.mode==='with'?0:lead).then(function(){
      if(my!==runId) return;
      if(sc.mode!=='with') setTxt('dph','歌う');
      capture(len,function(t,r){ setBar((i+t/len)/roots.length); if(mic) setHear(r); var j=Math.min(ns.length-1,Math.floor(t/nd)); if(sc.mode!=='with') setTxt('dnote',sc.mode==='first'&&j>0?'♪':nname(ns[j])); }).then(function(fr){
        if(measure) fr.forEach(function(p){ if(!p.f) return; var j=Math.floor(p.t/nd); if(j>=ns.length||p.t-j*nd<nd*0.3) return; var c=(f2m(p.f)-ns[j])*100; c-=Math.round(c/1200)*1200; tot++; if(Math.abs(c)<=50) hits++; hiMax=Math.max(hiMax,f2m(p.f)); });
        i++; sleep(700).then(rep);

function runBeat(L,mic,my){
  var B=L.beat, b=60000/B.bpm, k;
  for(k=0;k<4;k++) tone(k===0?96:91,70,k*b);
  var t0=performance.now();
  (function cnt(){ if(my!==runId||D.phase!=='run') return; var t=performance.now()-t0; if(t<4*b){ setTxt('dph','カウント '+(Math.floor(t/b)+1)); requestAnimationFrame(cnt); } })();
  sleep(4*b).then(function(){
    if(my!==runId) return; setTxt('dph',B.off?'裏拍で「タ」':'「タ」');
    capture(B.n*b+300,function(t,r){ setBar(t/(B.n*b)); var bd=document.getElementById('beat'); if(bd) bd.className='beat'+((t%b)<b*0.18?' on':''); if(mic) setHear(r); }).then(function(fr){
      if(my!==runId) return;
      if(!mic){ finishDrill('マイクが使えないので、判定はしていません。'); return; }
      var ons=[], quiet=99, i;
      for(i=0;i<fr.length;i++){ var on=fr[i].rms>0.02; if(on&&quiet>=4) ons.push(fr[i].t); quiet=on?0:quiet+1; }
      var tg=function(t){ var x=(t-(B.off?b/2:0))/b; return Math.round(x)*b+(B.off?b/2:0); };
      var dv=ons.filter(function(t){return t<B.n*b-b*0.3+(B.off?b/2:0);}).map(function(t){return t-tg(t);}).filter(function(d){return Math.abs(d)<b*0.45;});
      if(dv.length<8){ finishDrill('「タ」を拾えませんでした（'+dv.length+'回）。はっきり短く歌います。'); return; }
      var md=median(dv), sp=dv.reduce(function(p,d){return p+Math.abs(d-md);},0)/dv.length, h=dv.length>>1;
      var drift=median(dv.slice(h))-median(dv.slice(0,h));
      D.val=sp; D.goalOk=sp<=L.goal;
      finishDrill('拾えた回数：'+dv.length+' / '+B.n+'。拍からのばらつき：<b>'+Math.round(sp)+'ミリ秒</b>（目安 '+L.goal+' 以下）。全体には'+(Math.abs(md)<25?'ほぼ拍どおり':Math.round(Math.abs(md))+'ミリ秒'+(md<0?'早め':'遅め'))+'。'+(Math.abs(drift)>30?'後半ほど'+(drift<0?'走って':'もたって')+'います。':'')+'<br><span class="note">ブルートゥースのイヤホンでは音が遅れて聞こえるので、「早め・遅め」はずれて出ることがあります。ばらつきの数字は影響を受けません。</span>');
    });
  });
}

function earPlay(){ var E=D.E; tone(E.ref,600); tone(E.ref+(E.up?1:-1)*E.d/100,600,900); E.wait=false; render(); sleep(1550).then(function(){ if(D&&D.E===E){E.wait=true;render();} }); }

function earAns(v){
  var E=D.E, ok=(v==='hi')===E.up, dir; E.n++;
  if(ok){ E.streak++; if(E.streak>=2){ E.streak=0; dir=-1; } } else { E.streak=0; dir=1; }
  if(dir){ if(E.last&&dir!==E.last) E.rev.push(E.d); E.last=dir; E.d=Math.max(3,Math.min(200,E.d*(dir<0?0.7:1.4))); }
  if(E.rev.length>=8||E.n>=40){
    var r=E.rev.slice(-6), th=r.length?r.reduce(function(p,c){return p+c;},0)/r.length:E.d; D.val=th; D.goalOk=null; S.earTh=th;

    return;
  }
  earNext();
}

     .then(function(fr){ capFull=false; var v=MET[l.exp.met].f(fr); L[k]=v==null?'fail':v; L.run=null; render(); });
  });
}

function vLog(){

  else{
    var ds=S.sets.map(function(s){return s.dev;}), mx=Math.max.apply(null,ds.concat([60])), n=ds.length, W0=300, H0=80;
    var pts=ds.map(function(d,i){return (n===1?W0/2:i/(n-1)*W0).toFixed(1)+','+(H0-4-d/mx*(H0-8)).toFixed(1);});
    h+='<section class="sheet"><h2>ずれの移り変わり</h2><svg viewBox="0 0 '+W0+' '+H0+'" style="width:100%;height:auto;display:block" role="img" aria-label="セットごとのずれ"><line x1="0" x2="'+W0+'" y1="'+(H0-4-OKC/mx*(H0-8))+'" y2="'+(H0-4-OKC/mx*(H0-8))+'" stroke="var(--rule)" stroke-dasharray="4 4"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+pts.map(function(p){var q=p.split(',');return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="var(--accent)"/>';}).join('')+'</svg><p class="note">下に行くほど合っています。点線は「合っている」の幅（'+OKC+'セント）。</p>';
    if(S.est.length>=3) h+='<p>自分の感覚が当たった割合：<b>'+Math.round(S.est.reduce(function(p,c){return p+c;},0)/S.est.length*100)+'%</b>（'+S.est.length+'回）</p>';
    h+='<div class="scroll"><table><tr><th>日</th><th>段階</th><th>音の数</th><th>合った</th><th>ずれ</th><th>出だし</th></tr>'+S.sets.slice().reverse().slice(0,30).map(function(s){return '<tr><td>'+s.d.slice(5)+'</td><td>'+s.stage+'</td><td>'+PAT[s.pattern].name+'</td><td>'+s.ok+'/5</td><td>'+Math.round(s.dev)+'</td><td>'+Math.round(s.onset)+'</td></tr>';}).join('')+'</table></div></section>';
  }
  if(S.takes.length) h+='<section class="sheet"><h2>歌って分析の記録</h2><div class="scroll"><table><tr><th>日</th><th>音のずれ</th><th>ぶれ</th><th>息もれ</th><th>響き</th><th>直すところ</th></tr>'+S.takes.slice().reverse().slice(0,30).map(function(k){return '<tr><td>'+k.d.slice(5)+'</td><td>'+Math.round(k.dev)+'</td><td>'+(k.wob==null?'-':Math.round(k.wob))+'</td><td>'+(k.ap*100).toFixed(1)+'</td><td>'+(k.spr==null?'-':Math.round(k.spr))+'</td><td>'+k.top.map(function(id){return ISSUE[id].short;}).join('、')+'</td></tr>';}).join('')+'</table></div><p class="note">響きの数字はマイクで変わるので、同じ端末どうしで比べます。</p></section>';
  var sir=Object.keys(S.days).filter(function(k){return S.days[k].sirenHi;}).sort().slice(-10);
  if(sir.length) h+='<section class="sheet"><h2>サイレンで届いた上の音</h2><div class="scroll"><table><tr><th>日</th><th>上の音</th></tr>'+sir.reverse().map(function(k){return '<tr><td>'+k.slice(5)+'</td><td>'+nname(S.days[k].sirenHi)+'</td></tr>';}).join('')+'</table></div></section>';
  h+='<section class="sheet"><h3>記録の置き場所</h3><p class="note">記録は、この端末のこのブラウザの中だけに保存されます。</p><div class="row">'+(wipe?'<button class="btn" style="background:var(--bad)" data-act="wipeYes">本当に全部消す</button><button class="btn line" data-act="wipeNo">やめる</button>':'<button class="btn line" data-act="wipe">記録を全部消す</button>')+'</div></section>';
  return h;
}

  lCheck:function(){var l=les(L.id),r=lrec(l.id); ask('「'+l.title+'」を学びました。問い「'+l.own+'」に、私は「'+r.own+'」と書きました。'+(r.note?'体で試したときの感覚は「'+r.note+'」です。':'')+'理解が合っているかを確かめて、ずれていれば直してください。合っていれば、次に歌で試すことを1つだけ教えてください。200字以内で。');},

/* Claude との連動：claude.ai のページで開いたときだけ使える。Claude は歌声そのものは聞けないので、測った数字を渡す */
var AI=null, CH={turns:[],busy:false,err:''}, aiCtl=null;
var RULES='あなたは、歌の練習アプリ「うたラボ」の中で、利用者の歌の上達を手伝うコーチです。\n'+
'【大事な前提】あなたは歌声そのものを聞いていません。アプリが録音から測った数字だけを見ています。聞いたかのような言い方はしません。数字からは言えないことは、言えないと書きます。\n'+
'【測定の限界】元の曲のメロディーとは比べていない（各音がいちばん近い音の真ん中からどれだけ外れているかを見ている）。全体の高さのずれは引いてある。「直す」の区切りは目安として置いた値。響きと息もれの数字はマイクで変わる。リズムは拍に合わせて録音したときだけ。\n'+
'【使える知識】音源フィルタ理論、声区（地声と裏声）、フロー発声、半閉鎖声道エクササイズ（Titze）、Speech Level Singing（Riggs）、Estill Voice Training、Complete Vocal Technique、ベルカントとアッポッジョ（Lamperti、Miller）、コダーイ、ダルクローズ、運動学習（ガイダンス仮説、注意を体の外に向ける、分散練習、交互練習）。\n'+
'【アプリの中の練習】基礎（体・息・声帯の閉じ・喉をゆるめる発声・声区・響き・言葉・耳・リズム・クールダウンの32種類。音階はお手本を減らしていく3段階）、音程（表示を見ながら→歌った後に見る→先に自分で当てる）、歌って分析。できるだけこれらに結びつけます。\n'+
'【答え方】日本語。やさしい言葉。記号（#や*）による装飾は使わず、ふつうの文と改行だけで書く。300〜500字。直すところは一度に1つか2つまで。それぞれに「なぜそうするか」を一言添える。イメージは体の外に向けたものを優先する。根拠の強さ（研究で確かめられている／指導法として広く使われている／推論）を区別して書く。人柄ではなく行動について言う。痛みや長引くかすれは耳鼻咽喉科を勧める。\n';
function sumText(M){ return Object.keys(ISSUE).filter(function(id){return M.sev[id]!=null;}).map(function(id){var v=M.sev[id];return ISSUE[id].short+'：'+ISSUE[id].val(M)+' → '+(v>1?'直す':v>0.8?'もう少し':'良い');}).join('\n'); }
function ctxText(){
  var L=[], M=K&&K.M&&!K.M.short?K.M:null;
  if(M){ L.push('【今回の歌の測定】'+nname(M.lo)+'〜'+nname(M.hi)+'、'+M.notes+'音、ビブラート'+M.vib+'か所'); L.push(sumText(M)); L.push('音ごと（音名,長さミリ秒,真ん中からのずれセント,出だしのずれセント）：'+M.list.slice(0,40).join(' / ')); }
  if(S.takes.length){ L.push('【これまでの分析（古い順）】'); S.takes.slice(-6).forEach(function(k){L.push(k.d+' 音のずれ'+Math.round(k.dev)+' 直すところ：'+(k.top.map(function(id){return ISSUE[id].short;}).join('・')||'なし'));}); }
  if(S.sets.length) L.push('【音程の練習】'+S.sets.length+'セット。最初のずれ'+Math.round(S.sets[0].dev)+'、最新'+Math.round(S.sets[S.sets.length-1].dev)+'セント。表示の段階'+S.stage);
  if(S.range) L.push('【音域】'+nname(S.range.lo)+'〜'+nname(S.range.hi));
  return L.join('\n')||'（まだ測定はありません）';
}
function vChat(){
  var M=K&&K.M&&!K.M.short?K.M:null;
  if(!AI){
    if(!M||tab!=='sing') return '';
    return '<section class="sheet"><h2>Claudeに相談する</h2><p class="note">この開き方では、アプリの中から直接Claudeに聞けません。下の文面をコピーして、Claudeとの会話に貼ると、同じ相談ができます。claude.ai のページで開けば、ここから直接聞けます。</p><textarea id="sum" readonly>'+esc('歌の練習アプリの測定結果です。原因の見立てと、練習を教えてください。\n'+ctxText())+'</textarea><div class="row"><button class="btn sub" data-act="copy">文面をコピー</button></div>'+(CH.err?'<p class="note">'+CH.err+'</p>':'')+'</section>';
  }
  var h='<section class="sheet"><h2>Claudeに聞く</h2><p class="note">Claudeは歌声そのものは聞けません。アプリが測った数字と、これまでの記録を読んで答えます。</p>';
  CH.turns.forEach(function(t){h+='<div class="msg'+(t.role==='user'?' me':'')+'">'+esc(t.content)+'</div>';});
  if(CH.busy) h+='<div class="msg" id="aiout">考えています…</div><div class="row"><button class="btn line" data-act="aiStop">止める</button></div>';
  else{
    if(CH.err) h+='<div class="warnbox">'+CH.err+'</div>';
    if(M&&!CH.turns.length) h+='<div class="row"><button class="btn big" data-act="aiCoach">今回の歌を見てもらう</button></div>';
    h+='<label class="note" for="q">質問する（例：サビの高い音で喉が締まる。どう練習すればいい？）</label><textarea id="q"></textarea><div class="row"><button class="btn sub" data-act="aiAsk">送る</button>'+(CH.turns.length?'<button class="btn line" data-act="aiClear">会話を消す</button>':'')+'</div>';
  }
  return h+'</section>';
}
function ask(text){
  if(!AI||CH.busy) return;
  CH.turns.push({role:'user',content:text}); CH.turns=CH.turns.slice(-12); if(CH.turns[0].role!=='user') CH.turns.shift();
  CH.busy=true; CH.err=''; render(); aiCtl=new AbortController();
  var push=function(t){ if(t) CH.turns.push({role:'assistant',content:t}); else CH.turns.pop(); };
  AI([{role:'user',content:RULES+'\n'+ctxText()}].concat(CH.turns),{cache:false,signal:aiCtl.signal,onText:function(o){var el=document.getElementById('aiout'); if(el) el.textContent=o.text;}})
   .then(function(r){ push(r.text); },function(e){ push(e&&e.text);
     if(e&&e.code==='not_granted'){ AI=null; }
     else if(e&&e.code==='rate_limited') CH.err='少し時間をおいてから、もう一度送ってください。';
     else if(!e||e.code!=='cancelled') CH.err='Claudeから答えを受け取れませんでした。もう一度送ってください。'; })
   .then(function(){ CH.busy=false; render(); });
}
if(window.claude&&typeof window.claude.use==='function'){ try{ window.claude.use('sample').then(function(f){ if(f){AI=f; render();} },function(){}); }catch(e){} }

render();
})();
